    index and the discriminant bound as stated hypotheses. It turned out no
    such hypothesis is required: wallExpr_eq is a polynomial IDENTITY, true of
    every triple of reals, and the circle and line forms need only `t` nonzero
    and a nonvanishing minor, both of which are hypotheses of the individual
    theorems rather than standing assumptions. So CLAUDE.md section 4's rule --
