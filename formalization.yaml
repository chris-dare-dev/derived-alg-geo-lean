    Wall/ MAPS TO NO SECTION OF `source`. Numerical walls in the (s,t) half
    plane are tilt-stability material (Arcara-Bertram, Maciocia,
    Bayer-Macri-Toda), not Bridgeland 2007. No @[cites], no registry entries.

    WeakStabilityCondition/StabilityCondition/Walls/Numerical/Basic.lean works with NumClass = R x R x R, a triple `(r, c, d)`
    standing for (ch0, ch1.H, ch2), and the twisted charge
    Re Z = -d + s c - (s^2/2) r + (t^2/2) r, Im Z = t (c - s r). The wall
    expression is the cross product of two charges. The central result,
    wallExpr_eq, is that it collapses to
    t * (minC + s minB + ((s^2+t^2)/2) minA), where minA, minB, minC are the
    three 2x2 minors of the matrix with rows v and w. Hence for t nonzero the
    wall is minA (s^2+t^2) + 2 minB s + 2 minC = 0: a circle centred on the
    s-axis when minA is nonzero, a vertical line when minA vanishes and minB
    does not. Centre and radius are given in cleared form so no division
    appears. Each minor is alternating, so the wall depends only on w modulo v
    (wallExpr_shift). charge_eq_zero_iff locates the single degenerate point.

    ADDED 2026-08-07: THE NESTING THEOREM, which the file's own docstring had
    listed as out of reach. That docstring said the statement -- two distinct
    walls for the same v never meet -- "needs the extra input that both minor
    vectors are cross products against a common v, and a rank argument in R^3.
    Neither is done." The first half is minor_orth, a one-line ring identity:
    ch2 * minA + deg * minB + rk * minC = 0, which is exactly the statement
    that (minA, minB, minC) is v cross w with its coordinates reversed. The
    second half turns out not to be needed at all.

    With minor_orth, two walls through one point give two circle equations and
    two orthogonality relations; eliminating pairwise leaves
    (deg - s rk) * crossAB = 0 and (ch2 - ((s^2+t^2)/2) rk) * crossAB = 0, and
    the file's own charge_eq_zero_iff already says those two coefficients
    vanish TOGETHER exactly when v's charge vanishes at (s,t). So off that
    locus crossAB = 0 and the other two cross terms follow from the circle
    equations alone (minorCross_eq_zero_of_two_walls). wall_eq_of_meet then
    concludes that the two walls agree at every point;
    wall_subset_of_crossZero does one inclusion and the reverse is the same
    lemma with the arguments swapped, since the cross terms are antisymmetric.
    The R^3 rank argument never appears -- the two orthogonality relations do
    its work, and what would have been a genericity assumption is instead an
    explicit hypothesis.

    THE CHARGE HYPOTHESIS IS PROVED NECESSARY, not merely stated.
    wall_eq_of_meet_needs_charge exhibits v = (2,0,1), whose charge vanishes at
    (0,1). There the wall equation collapses to minA + 2 minC = 0, which
    minor_orth makes automatic for EVERY w, so at that one point all walls of v
    meet at once. w1 = (0,1,0) gives the unit circle and w2 = (1,0,0) the line
    s = 0; both minor vectors are nonzero, they meet at (0,1), and (0,2)
    separates them. Every hypothesis of wall_eq_of_meet except the charge one
    holds and the conclusion is false.

