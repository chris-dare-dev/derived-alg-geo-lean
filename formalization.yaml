    44 of those are `private` (42 of them theorems) and are STRUCTURALLY
    unlistable: Lean mangles a private name to `_private.<Module>.<n>.<Name>`,
    so it cannot be written as a short name from an importing module, and
    `scripts/StabilityConditionAudit.lean`'s instruction "adding a declaration to the library
    means adding it here" cannot be followed for them. The earlier figure 42
    was counting private THEOREMS; there are 44 private DECLARATIONS.

    59 more are STRUCTURE FIELD PROJECTIONS emitted by the `structure` command.
    These are not a coverage gap in any useful sense and listing them would be
    noise.

    That leaves ZERO public declarations not yet added: the 59 quoted here
    previously (with 20 in GLTildeSurj.lean) were closed by #105 in two steps
    on 2026-08-07. Nothing detects a NEW shortfall automatically:
    check_audit.py cross-checks output count against Audit.lean's commands
    (the #102 truncation fix) but never reads the source tree, and Audit.lean
    fails to build only when a name it ALREADY lists disappears, never when a
    name it should list appears. scripts/StabilityConditionCensus.lean reports it, but it is a
    script someone runs, not a CI gate; a name added without a matching entry
    still lands green.

