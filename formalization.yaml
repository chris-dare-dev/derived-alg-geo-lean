    AutIsometry.lean (2026-08-05) targets the ISOMETRY clause of Lemma 8.2,
    partially. mapEquiv_slicingDist proves the Aut action preserves the
    foundational library's slicingDist -- the sup over nonzero objects of the phi-plus and
    phi-minus discrepancies, StabilityCondition/Defs.lean -- exactly, with no
    finiteness hypothesis and with both sides allowed to be infinite.
    actStabAut_slicingDist and AutPairQuot_smul_slicingDist carry it from bare
    slicings to stability conditions and to the MulAction of AutPairQuot v.
    Two supporting lemmas were missing and are stated here for the first time:
    Slicing.phiPlus_congr / phiMinus_congr, the iso-invariance of the intrinsic
    phases, which the foundational library inlines at four separate sites in
    Deformation/DeformedGtLe.lean without ever naming; and isZero_functor_iff /
    isZero_inverse_iff, which Functor.map_isZero gives in one direction only.

    The proof does NOT reindex the supremum along Phi, and cannot: Phi.functor
    .obj is a function on the OBJECT TYPE of C, and an equivalence of
    categories makes it injective only up to isomorphism, so there is no Equiv
    to rewrite along. Each side dominates the other pointwise instead, which is
    what forced phiPlus_congr into existence.

    StabilityMass.lean, HNMassUniqueness.lean, StabilityDistance.lean, and
    AutFullIsometry.lean form the subsequent full-metric chain.
    HNFiltration.mass is the finite sum of charge norms for one filtration.
    stabilityMass initially takes the supremum of those sums over every HN
    filtration, avoiding a non-functorial Classical.choice.
    HNFiltration.mass_eq_mass proves the sums are independent of the
    filtration, and stabilityMass_eq_mass identifies the envelope with any of
    them. The mass is finite, positive on nonzero objects, invariant under
    object isomorphism, and transported exactly by AutPair.act. stabilityDist
    is the supremum over nonzero objects of the maximum of phi-plus, phi-minus,
    and the ordinary absolute logarithmic mass discrepancy. It is reflexive,
    symmetric, satisfies the triangle inequality, and dominates slicingDist.
    AutPair.act_stabilityDist and AutPairQuot_smul_stabilityDist prove exact
    invariance of all three coordinates.

