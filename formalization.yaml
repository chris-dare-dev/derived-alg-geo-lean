    THE HAPPEL-REITEN-SMALO TILT IS NOT FORMALIZED, and the directory name
    `Tilting/` invites the opposite reading, so it is stated here rather than
    left to a docstring. What exists is the torsion pair -- the INPUT datum --
    and its elementary theory. The tilt is the construction, from a torsion
    pair in the heart of a t-structure, of a second t-structure whose heart is
    the extension of the torsion class by the shifted torsion-free class. It is
    a much larger obligation: Mathlib's `Triangulated.TStructure` requires an
    `exists_triangle_zero_one` field, and producing that triangle for the
    tilted aisles needs the octahedral axiom. None of it is attempted here and
    no declaration below asserts it.

    A consequence worth being explicit about: NOTHING IN Tilting/ CONNECTS TO
    A STABILITY CONDITION YET. The reason a torsion pair is interesting for
    this repo is that the tilt is the engine behind every construction of
    stability conditions on a surface. That motivation is recorded in the
    module docstring as motivation, not as a formalized link.

    Mukai/ IS THE SAME DIVERGENCE, ONE LEVEL UP, and is recorded separately
    because the suggestive naming makes it easier to misread. `MukaiLattice N`
    is the abstract extension Z x N x Z of ANY additive group carrying ANY
    symmetric Z-bilinear form. It is NOT the Mukai lattice of a K3 surface.
    Taking N = NS(X) with the intersection form would recover the algebraic
    Mukai lattice H^0 + NS + H^4, but that identification needs D^b(Coh X),
    Chern characters and Hirzebruch-Riemann-Roch, none of which exist in
    Mathlib at the pin, and CLAUDE.md section 4 closes that lane outright. It is
    an unrealized assumption and is never discharged here. Every theorem in the
    lane is true of an arbitrary symmetric bilinear Z-lattice and would remain
    true if no K3 surface existed.

    Three specific names carry a claim they do not prove, and each says so at
    its declaration. `expectedDim v = <v,v> + 2` is a DEFINITION recording which
    numerical quantity is tracked; the statement that a moduli space of stable
    objects with primitive Mukai vector v has that dimension is Mukai's theorem,
    is geometry, and is NOT asserted. `IsSpherical` is the numerical condition
    <v,v> = -2, not a claim that any spherical object exists or that such
    objects have those classes. `IsHyperbolicPair` is the numerical condition
    that a pair has negative Gram determinant; the correspondence between such
    rank-two data and actual walls in a space of stability conditions is
    Bayer-Macri Theorem 5.7, is geometry, and is NOT formalized -- the file's
    module docstring states this and no declaration depends on it.

    THE WALL CLASSIFICATION ITSELF IS NOT FORMALIZED. What exists is the
    rank-two numerical substrate the classification is phrased over, plus the
    two existence predicates HasSphericalClass and HasIsotropicClass. Assigning
    a wall type -- totally semistable, divisorial, flopping, fake -- to a
    rank-two datum requires moduli of stable objects and is out of scope by
    CLAUDE.md section 4. Do not cite this lane as "the Bayer-Macri wall
    classification is formalized".

    WeakStabilityCondition/StabilityCondition/Symmetry/GLTilde/Basic.lean defines GLTilde as Bridgeland's pair presentation
    of GL+(2,R)-tilde. The group, surjective projection, Z fibre, explicit
    section, global topology, continuity of the projection, contractibility,
    simple connectedness, covering-map property, and topological-group
    compatibility are now proved.
    GLTilde.universalCoverData packages the covering-map, surjectivity, and
    simply-connected source properties; exact_deckHom_toMatHom separately
    supplies the deck group. GLTilde.isTopologicalGroup packages continuous
    multiplication and inversion. Mathlib has no single bundled
    universal-cover predicate at this pin, so these exact declarations are the
    public trust surface rather than an inferred larger API.

    WeakStabilityCondition/StabilityCondition/Metric/Isometry/Phase.lean proves preservation of the foundational library's phase-only
    slicingDist. StabilityMass.lean, HNMassUniqueness.lean, and
    StabilityDistance.lean now supply a literal finite HN-mass coordinate and
    AutFullIsometry.lean proves that AutPairQuot v preserves the resulting
    stabilityDist exactly.

    The mass coordinate is now Bridgeland's ordinary HN mass:
    HNFiltration.mass_eq_mass proves independence of the filtration, and
    stabilityMass_eq_mass plus stabilityMass_ne_top identify the choice-free
    envelope with the expected finite sum. logMassDist retains a total
    definition on ENNReal, but massDist_eq_abs_log proves that stability
    conditions always use its ordinary finite absolute-logarithmic branch.

    Proposition 8.1 also asserts separation and equality of the induced
    topology with Section 6. StabilityDistanceSeparation.lean proves
    separation for the ordinary K0-valued space and, more generally, for a
    surjective class map. Without surjectivity it proves precisely the
    observable conclusion: equality of the slicing and Z.comp v.
    StabilityDistanceTopology.lean proves the analytic estimates, both
    cofinality directions conditional on `StabilityMassTriangleInequality`,
    and the compatible EMetricSpace construction. Triangle.lean proves that
    mass premise and exposes the unconditional
    `stabilityDistanceTopologyCompatible` corollary. The
    ofEDistOfTopology route retains the Section 6 topology definitionally, so
    no raw metric instance or topology diamond is present. The registry
    relation to Proposition 8.1 is still no_claim pending exact-head human
    source-faithfulness review and owner acceptance, not pending further mass
    mathematics. The relation of the full-distance isometry to Lemma 8.2 also
    remains no_claim because the acting group has not been identified with
    bare Aut(D).

    Independently, AutPairQuot v is not Aut(D): it includes a compatible
    lattice automorphism and is not proved equivalent to the external group of
    exact autoequivalences. Do not cite AutPairQuot_smul_stabilityDist as the
    literal paper theorem; call it full-distance invariance for the compatible
    autoequivalence group and state the remaining group-level boundary.

    WeakStabilityCondition/StabilityCondition/Symmetry/Autoequivalence/Slicing/Quotient.lean defines AutQuot C as the quotient of
    triangulated auto-equivalences by natural isomorphism of the forward
    functors. Inverse natural isomorphisms are derived from uniqueness of right
    adjoints. No separate external object named Aut(D) is identified with this
    quotient, so citations should still name AutQuot C rather than silently
    substitute an external definition.

    The topological action result now includes both levels: each fixed
    GLTilde, AutPairQuot, or direct-product element acts by a homeomorphism,
    and the action maps are jointly continuous. The AutPairQuot factor uses
    the discrete topology; this does not identify it with any independently
    topologized external group of autoequivalences.

    EffectiveCombinedSymmetry is the quotient by the full kernel of the
    combined action, not by a subgroup merely asserted to be generated by the
    deck/double-shift overlap. The explicit pair `(deck 1, [2])` is proved to
    lie in that kernel, with `[2]` acting as `deck (-1)` under this project's
    left-action conventions. Equality of the full kernel with the cyclic
    subgroup it generates is not claimed.

