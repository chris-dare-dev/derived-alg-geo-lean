    NOTHING connects it to a stability condition -- that is a further theorem,
    targeted by the #81 weak-stability program and not attempted here. Do not
    cite this lane as "stability conditions on surfaces". The HEART, by
    contrast, IS identified as of #106: tilt_heart_iff says membership in
    `tilt.heart` is exactly being an extension of a torsion object by a
    shifted torsion-free one -- the textbook extension closure of T and F[1],
