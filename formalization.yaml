    Lattice/NumericalK.lean models K_num(Ku(X)) as the concrete lattice
    Fin 2 -> Z. Every lemma there is a theorem about a rank-2 torsion-free
    lattice, NOT about a Kuznetsov component. The identification is geometry,
    is not expressible in Mathlib today, and is tracked as an unrealized
    assumption -- never discharged in this repo.

    TILTING LANE, HEART INCREMENT: THE AISLES ARE NOT DEFINED THE USUAL WAY,
    AND THE DEVIATION IS FORCED. The Happel-Reiten-Smalo aisles are normally
    written with cohomology functors, D^{<=0}_dagger = {X in D^{<=0} : H^0(X) in
    T}. MATHLIB HAS NO BUNDLED H^n FUNCTOR INTO THE HEART AT THE PIN --
    TStructure/ carries truncLE, truncGE and the truncation triangle. This
    project constructs the functor in
    WeakStabilityCondition/Tilting/Cohomology/Basic.lean and proves it
    homological in WeakStabilityCondition/Tilting/Cohomology/Homological.lean;
    WeakStabilityCondition/StabilityCondition/Metric/Mass/Subadditivity/CohomologyExactness.lean
    transports that result to the stability-condition API. The original aisle
    construction remains defined by
    HOM-ORTHOGONALITY, which needs no cohomology functor: for X in D^{<=0} and
    F in the heart the counit gives Hom(X,F) = Hom(H^0 X, F), and the torsion
    class is the left orthogonal of the torsion-free class, so "H^0(X) in T" is
    equivalent to "Hom(X,F) = 0 for every torsion-free F". The two formulations
    agree wherever the usual one can be stated. But they are not literally the
    same definition, and a reader comparing this file to a textbook must know
    that.

    TILTING LANE: THE HAPPEL-REITEN-SMALO TILT IS FORMALIZED. Every field of
    Triangulated.TStructure is proved and `tilt` assembles them into a genuine
    t-structure. `exists_triangle_zero_one` -- the last and hardest -- is
    `exists_tilt_triangle`, built from two octahedra. NOTHING IS DECLARED WITH
    SORRY.

    The aisle construction itself uses NO COHOMOLOGY FUNCTOR: at the time it
    was introduced Mathlib had no bundled H^n functor into the heart, and the
    later project-level homologicality theorem does not alter the definition.
    tau^{>=0}X plays the role of H^0(X), exists_factor_truncGE plays the role of
    the counit isomorphism, and Hom-orthogonality plays the role of membership
    in the torsion class.

    THE AISLES ARE THEREFORE NOT DEFINED THE TEXTBOOK WAY, and a reader
    comparing this to a source must know it. Textbook HRS writes
    D^{<=0}_dagger = {X in D^{<=0} : H^0(X) in T}; here it is
    {X in D^{<=0} : Hom(X,F) = 0 for every torsion-free F}. The two agree
    wherever the textbook one can be stated, but they are not the same
    definition.

    A CORRECTION THIS RECORD PREVIOUSLY CARRIED, now superseded and kept
    because the wrong turn is instructive. Earlier revisions said the field
    needs the long exact cohomology sequence of H^0 and treated it as blocked.
    That was inferred from the textbook construction, which cuts X as the fibre
    of tau^{<=0}A -> F0 -- and that shape genuinely does need cohomology, since
    IsLE X 0 then depends on H^0(A) -> F0 being epi. The shape actually used
    builds X as an extension of T0 by tau^{<=-1}A, whose two ends are already
    in D^{<=0}. The obstruction was in the chosen construction, not in the
    theorem.

