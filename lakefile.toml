name = "DerivedAlgGeo"
version = "0.1.0"
defaultTargets = ["DerivedAlgGeo"]
keywords = [
  "math", "algebraic-geometry", "derived-categories",
  "coherent-sheaves", "stability-conditions", "riemann-roch",
]

# Lake >= 4.35 warns whenever a non-`module` file imports Mathlib, which is built for the
# module system. This repository has not adopted `module` headers; say so once here
# rather than accept one warning per import.
allowNonModules = true

# Mathlib v4.35's `haveI`/`letI` style linter is new with the toolchain bump. Adopting it
# rewrites several hundred proofs, which is left to a follow-up so the bump stays reviewable.
# It is switched off here rather than in `[leanOptions]`: a style linter does not change what
# elaborates, so it stays out of the build trace.
weakLeanArgs = ["-Dweak.linter.style.haveILetI=false"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

# One direct Mathlib revision for every library in this repository.
[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0"

[[lean_lib]]
name = "DerivedAlgGeo"

# Sweep umbrella for the axiom audit. Separate from the stable umbrella because
# the audit must cover development probes that the public umbrella
# intentionally excludes. See DerivedAlgGeoSweep.lean.
[[lean_lib]]
name = "DerivedAlgGeoSweep"

