name = "DerivedAlgGeo"
version = "0.1.0"
defaultTargets = ["DerivedAlgGeo"]
keywords = [
  "math", "algebraic-geometry", "derived-categories",
  "coherent-sheaves", "stability-conditions", "riemann-roch",
]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

# One direct Mathlib revision for every library in this repository.
[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.32.1"

# Shared provenance/emission leaf. It has no Lake dependencies, so it cannot
# introduce a competing Mathlib revision.
[[require]]
name = "MathFormalContract"
git = "https://github.com/chris-dare-dev/math-formal-contract-lean"
rev = "a5af3b29047a3bbe974529462b26ff353086beea"

[[lean_lib]]
name = "DerivedAlgGeo"

# Sweep umbrella for `lake exe emit`. Separate from the stable umbrella because
# the sorry gate must cover development probes that the public umbrella
# intentionally excludes. See DerivedAlgGeoSweep.lean.
[[lean_lib]]
name = "DerivedAlgGeoSweep"

# Executable-only aliases for names embedded in immutable review payloads.
# This target is deliberately outside the public `DerivedAlgGeo` library and
# is loaded only into the restatement environment.
[[lean_lib]]
name = "RestateHistoricalNames"
srcDir = "exe"

# Subsystem audits remain independent so their historical declaration lists
# and truncation checks stay meaningful.
[[lean_lib]]
name = "AlgebraicGeometryAudit"
srcDir = "scripts"
globs = ["AlgebraicGeometryAudit.+"]

[[lean_lib]]
name = "StabilityConditionAudit"
srcDir = "scripts"
globs = ["StabilityConditionAudit.+"]

[[lean_lib]]
name = "DGCategoryAudit"
srcDir = "scripts"

[[lean_exe]]
name = "emit"
root = "Emit"
srcDir = "exe"
supportInterpreter = true

# The restate producer. `supportInterpreter` for the same reason `emit` needs
# it: `importModules` reaches Init/Std/Lean declarations with no native
# implementation, and omitting the flag FAILS ONLY ON LINUX -- macOS resolves
# the symbol dynamically, so it passes locally and dies in CI.
[[lean_exe]]
name = "restate"
root = "Restate"
srcDir = "exe"
supportInterpreter = true
