schema: spec-driven

context: |
  Tech stack: Lean 4 with mathlib, Python repository gates, GitHub pull requests,
  hosted ubuntu-latest runners for pull requests, and self-hosted Ubuntu runners
  on the owner's workstation for main and manual dispatch. The repository is a
  formalization of derived algebraic geometry and its claims are
  correctness-critical.

  User-named GitHub issues are the default source of scope and acceptance for
  issue-driven work. OpenSpec is optional progress documentation for that flow;
  a batch spanning repositories does not need duplicate OpenSpec roots or a
  generated loop manifest before implementation starts. If an OpenSpec change
  is used, keep mathematical requirements and observable proof obligations in
  specs/*.md; put implementation choices in design.md and tasks.md. Never use
  sorry, admit, axioms that bypass the stated construction, or a postulated
  representability/algebraicity conclusion.

  Loop runs follow .claude/skills/run-loop/SKILL.md. They use neither OpenSpec
  nor the retired loop controller in scripts/loop_engine.py. The user request
  naming issue IDs authorizes work within those issue scopes, and the live issue
  bodies are sufficient acceptance criteria. OpenSpec is for interactive design
  work; when it is useful there, use one shared batch change.

rules:
  proposal:
    - State the mathematical and repository motivation separately from the implementation approach when a proposal is useful.
    - Name the affected GitHub issues and the OpenSpec capability paths when this is a batch plan.
    - Record explicit non-goals, especially unproved existence, preservation, descent, or algebraicity claims.
  specs:
    - Express every normative mathematical or repository behavior with SHALL or MUST and at least one WHEN/THEN scenario.
    - Include at least one negative or counterexample scenario whenever a claim has a known trust boundary.
    - Do not turn a theorem, algebraicity result, preservation property, or descent statement into an interface field.
  design:
    - Record ownership, dependency direction, projection/comparison maps, diamond-instance agreement, and import boundaries.
    - Apply mathematical/source-faithfulness, repository-boundary, and abstraction/adoption review in proportion to the changed work; do not require a fixed review roster to start implementation.
  tasks:
    - Keep tasks checkable and scoped to the named issues.
    - Record relevant verification commands or observable acceptance evidence.
    - Use targeted Lean checks and hosted CI where they apply; do not make OpenSpec validation a prerequisite when no OpenSpec change is needed.

operations:
  apply:
    guidance:
      - Work from the live issue bodies and repository guidance; do not invent scope beyond the user-named issues.
      - Resolve ordinary ambiguity by taking the smallest reading that meets acceptance and recording it; do not pause for confirmation.
      - Keep working independent issues when one has a real blocker.
      - Use an OpenSpec change only when it materially helps the work; do not require one to begin.
      - Respect the actual required checks and branch protection.
  archive:
    guidance:
      - Archive an OpenSpec change only after its requirements are satisfied and applicable repository checks pass.
