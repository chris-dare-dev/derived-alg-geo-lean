    divergences:
      - >-
        GLTilde is NAMED for the universal covering space of GL+(2,R) and that
        property is not proved here. Mathlib has no bundled universal-cover
        predicate at the pinned revision, so the paper's phrase cannot be
        discharged by instantiating an upstream API. The name asserts what the
        repository has not shown. Registry frontier gltilde-universal-cover.
      - >-
        The action is on Slicing C, not on Stab(D) as Lemma 8.2 states.
      - >-
        Covers part of the right-action clause only. The Aut(D) left action and
        the claim that the two actions commute are not in this statement.
    note: >-
      A genuine MulAction is proved, so the formalization is not wrong -- it is
      narrower than its name suggests. relation_confirmed stays no_claim
      deliberately: asserting a correspondence to Lemma 8.2 while the covering
      -space property is unproved would put the paper's phrase behind a name
      rather than behind a theorem.
