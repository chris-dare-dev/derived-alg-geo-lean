# The one check a pull request cannot rewrite for its own run.
#
# THE HOLE THIS CLOSES (2026-08-18 adversarial review, finding P1-1).
# `ci` is the only required status check on `main`, and for `pull_request`
# events GitHub evaluates the workflow file **from the contributor's branch**.
# `ci.yml` relies on that deliberately for runner routing, and the same
# mechanism voids the check itself: a pull request that rewrites its own copy
# of `ci.yml` to a job named `ci` that runs `exit 0` produces a green required
# context having run no gate at all. With zero required reviews and auto-merge
# armed, nothing forces a human to read that diff first. The same hole exists
# one level down: a pull request that edits `scripts/check_*.py` to return 0
# neuters that gate from inside an honestly-green `ci`.
#
# WHY THIS FILE IS DIFFERENT. `pull_request_target` runs the workflow
# definition from the BASE branch. A pull request therefore cannot change what
# this job does to it -- editing this file in the branch changes the copy that
# runs only AFTER the edit is merged, which is exactly the review event this
# job exists to force.
#
# WHAT IT DOES. If a pull request touches the trust surface -- the workflows,
# the gate scripts, the emitter, the pin files, the registry, the licence
# boundary -- it fails until an authorized human review is bound to the exact
# base, head, guarded-file digest, and policy version. The old
# `trust-reviewed` label remains useful as a rerun trigger, but it is no longer
# approval evidence and cannot carry across a new revision.
#
# WHAT IT IS NOT. This does not stop someone holding the owner's credentials:
# that person can approve their own pull request, and no repository-side control
# survives a compromised owner token. It stops the realistic failure -- an
# agent lane silently disabling a gate inside a green build -- by making the
# disabling step visible, revision-bound, and attributable. Read it as "no gate
# turns itself off quietly", not as "the trust surface is adversary-proof".
#
# SAFETY: `pull_request_target` runs with a writable token and repository
# secrets in the context of the BASE repository. Checking out or executing
# pull-request code under it is the well-known privilege-escalation footgun.
# This job does neither. It calls the REST API for the changed-file list and
# reads the label set from the event payload; no `actions/checkout`, no `lake`,
# no script from the branch under review. Keep it that way.
name: Trust guard

on:
  pull_request_target:
    # Labels are retained as a convenient explicit rerun trigger. They are not
    # accepted as authorization by the job below.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  pull_request_review:
    # A review is tied to a commit by GitHub. Re-run on every review state
    # transition so dismissal or a new changes-requested review cannot leave a
    # stale green trust-surface result behind.
    types: [submitted, edited, dismissed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: trust-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  trust-surface:
    name: trust-surface
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require review for trust-surface changes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TRUST_POLICY_VERSION: trust-guard-v2
        run: |
          set -euo pipefail

          # The changed-file list comes from the API, not from a checkout, so
          # nothing in the pull request is fetched or executed here.
          #
          # One record per file: name, deletion count, and the patch base64'd so
          # no diff content can inject a tab or newline into the loop below. The
          # patch is DATA -- decoded and grepped, never executed, and nothing
          # derived from it reaches a command position.
          files="$(gh api --paginate "repos/$REPO/pulls/$PR/files?per_page=100" --jq '.[] | [.filename, (.deletions|tostring), (.patch // "" | @base64)] | @tsv')"
          if [ -z "$files" ]; then
            echo "::error::the API returned no files for PR #$PR. This job must" \
                 "not pass on an empty file list -- that is the vacuous pass it" \
                 "exists to prevent."
            exit 1
          fi
          if ! printf '%s\n' "$files" | awk -F '\t' '$3 == "" {bad=1} END {exit bad}'; then
            echo "::error::the changed-file API omitted a patch; refusing an" \
                 "incomplete trust-surface decision"
            exit 1
          fi

          # The guarded paths. Everything here decides what a green `ci` MEANS:
          # the workflows that define it, the scripts it executes, the emitter
          # and sweep root it measures, the pins that say what it ran against,
          # the registry it validates, and the licence boundary.
          patterns='
          ^\.github/
          ^\.milestone-pipeline/
          ^\.claude/loop-specs/
          ^\.claude/agents/
          ^\.claude/skills/run-loop/
          ^openspec/
          ^scripts/
          ^exe/
          ^registry/
          ^DerivedAlgGeoSweep\.lean$
          ^lakefile\.toml$
          ^lake-manifest\.json$
          ^lean-toolchain$
          ^pins\.json$
          ^LICENSE\.md$
          '

          # The audit RECORD slices are deliberately not trust surface. They are
          # append-only lists of `#print axioms` lines, and CLAUDE.md requires
          # every new public declaration to be added to one -- so guarding them
          # made this job fire on every substantive pull request, which is how a
          # gate stops being read. They are already protected, by two gates that
          # exist for exactly this and by nothing else:
          #
          #   * delete a record while its declaration lives, and
          #     `check_audit_complete.py` sees a newly-unaudited declaration --
          #     it fails on the ceiling AND on the absent-from-baseline identity
          #     check;
          #   * delete a declaration while its record lives, and
          #     `check_audit.py` fails on the record that resolved to nothing.
          #
          # Both of those scripts stay guarded below, so the protection chain is
          # intact: neutering the checks that protect the records is itself a
          # trust-surface change.
          #
          # The audit UMBRELLAS (`scripts/*Audit.lean`) are NOT excluded by path.
          # They carry the contract prose and the import list, so a change there
          # generally changes what the audit means rather than what it records.
          # `DGCategoryAudit.lean` is umbrella and records in one file and stays
          # guarded for the same reason. One shape is carved out below.
          exclusions='
          ^scripts/AlgebraicGeometryAudit/
          ^scripts/StabilityConditionAudit/
          '

          # ADDITIVE UMBRELLA IMPORTS -- the one umbrella edit that cannot lower
          # coverage. A patch that deletes nothing and whose every added line is
          # an `import <X>Audit.<Slice>` line only ever ADDS a record slice to
          # the sweep.
          #
          # Adding a source module needs exactly this edit, so without the
          # carve-out the job fires on work that strictly increases what is
          # audited -- the same "a gate that fires on routine work stops being
          # read" problem that excluded the record slices above.
          #
          # Every dangerous umbrella edit still trips, because each shows up as a
          # deletion or as an added line that is not an import:
          #
          #   * dropping an import, silently removing a whole record slice from
          #     the sweep -- deletions > 0;
          #   * rewriting the contract prose -- a non-import added line, or a
          #     deletion, or both;
          #   * adding anything executable -- a non-import added line.
          #
          # FAILS CLOSED. GitHub omits `patch` for very large diffs; with nothing
          # to inspect the file stays trust surface. A missing or non-zero
          # deletion count does the same.
          umbrella='^scripts/[A-Za-z0-9]+Audit\.lean$'

          touched=""
          while IFS=$'\t' read -r f dels patch64; do
            [ -n "$f" ] || continue
            skip=""
            while IFS= read -r e; do
              e="$(printf '%s' "$e" | tr -d '[:space:]')"
              [ -n "$e" ] || continue
              if printf '%s' "$f" | grep -Eq "$e"; then
                skip="yes"
                break
              fi
            done <<< "$exclusions"
            [ -z "$skip" ] || continue

            # The additive-umbrella-import carve-out. Every condition must hold;
            # any one of them failing keeps the file guarded.
            if printf '%s' "$f" | grep -Eq "$umbrella" \
               && [ "${dels:-1}" = "0" ] && [ -n "${patch64:-}" ]; then
              added="$(printf '%s' "$patch64" | base64 -d \
                       | grep '^+' | grep -v '^+++' || true)"
              if [ -n "$added" ] && ! printf '%s\n' "$added" \
                   | grep -qvE '^\+import [A-Za-z0-9_]+Audit(\.[A-Za-z0-9_]+)+$'; then
                echo "note: $f adds only audit imports and deletes nothing" \
                     "-- not a trust-surface change"
                continue
              fi
            fi

            while IFS= read -r p; do
              p="$(printf '%s' "$p" | tr -d '[:space:]')"
              [ -n "$p" ] || continue
              if printf '%s' "$f" | grep -Eq "$p"; then
                touched="$touched$f"$'\n'
                break
              fi
            done <<< "$patterns"
          done <<< "$files"

          if [ -z "$touched" ]; then
            echo "ok: no trust-surface path in this pull request"
            exit 0
          fi

          echo "This pull request changes the trust surface:"
          printf '%s' "$touched" | sed 's/^/    /'

          # A review body carries the exact digest a human saw. The digest is
          # over the API's filename/deletion/patch records, sorted before
          # hashing; it therefore changes on a guarded patch change and does
          # not depend on the order in which GitHub paginates the response.
          file_digest="$(printf '%s\n' "$files" | LC_ALL=C sort | sha256sum | awk '{print $1}')"
          review_marker="trust-review: v1 base=$BASE_SHA head=$HEAD_SHA files=$file_digest policy=$TRUST_POLICY_VERSION"

          # The review endpoint is base-side API data. No pull-request code is
          # fetched or executed. `--slurp` preserves page boundaries until jq
          # flattens them, and the empty response is a failure rather than an
          # implicit approval.
          reviews="$(gh api --paginate --slurp "repos/$REPO/pulls/$PR/reviews?per_page=100")"
          if [ -z "$reviews" ]; then
            echo "::error::the API returned no review records for PR #$PR"
            exit 1
          fi

          # Keep only the latest decision by each repository-authorized
          # reviewer for this exact head. A later CHANGES_REQUESTED or
          # DISMISSED review therefore invalidates an earlier approval. The
          # marker binds base/head/diff/policy; the association check prevents
          # an arbitrary public commenter from satisfying the gate.
          latest_reviews="$(printf '%s' "$reviews" | jq -c --arg head "$HEAD_SHA" '
            flatten
            | map(select(.commit_id == $head
              and ((.author_association // "") == "OWNER"
                or (.author_association // "") == "MEMBER"
                or (.author_association // "") == "COLLABORATOR")
              and ((.user.login // "") != "")))
            | sort_by([(.user.login // ""), (.submitted_at // ""), (.id // 0)])
            | group_by(.user.login)
            | map(.[-1])')"
          if [ -z "$latest_reviews" ] || [ "$latest_reviews" = "[]" ]; then
            echo "::error::no authorized review is bound to head $HEAD_SHA"
            exit 1
          fi
          if printf '%s' "$latest_reviews" | jq -e 'any(.[]; .state == "CHANGES_REQUESTED")' >/dev/null; then
            echo "::error::an authorized reviewer requested changes for head $HEAD_SHA"
            exit 1
          fi
          if ! printf '%s' "$latest_reviews" | jq -e --arg marker "$review_marker" \
               'any(.[]; .state == "APPROVED" and ((.body // "") | contains($marker)))' >/dev/null; then
            echo "::error::the current head lacks an authorized review with the exact marker"
            echo "required marker: $review_marker"
            exit 1
          fi

          echo
          echo "ok: authorized review is bound to base=$BASE_SHA head=$HEAD_SHA"
          echo "ok: guarded-file digest=$file_digest policy=$TRUST_POLICY_VERSION"
