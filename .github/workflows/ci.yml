name: Ubuntu Lean capability smoke
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: chris-ubuntu-main-runner
            slot: main
          - runner: chris-ubuntu-runner-1
            slot: general-1
          - runner: chris-ubuntu-runner-2
            slot: general-2
          - runner: chris-ubuntu-runner-3
            slot: general-3
    runs-on: [self-hosted, Linux, X64, '${{ matrix.runner }}']
    timeout-minutes: 15
    steps:
      - name: Verify host and isolated runtime
        shell: bash
        env:
          EXPECTED_RUNNER: ${{ matrix.runner }}
          EXPECTED_SLOT: ${{ matrix.slot }}
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = "$EXPECTED_RUNNER"
          test "$RUNNER_OS" = Linux
          root="/home/chris-dare/.local/share/github-runners/$EXPECTED_SLOT"
          test "$HOME" = "$root/home"
          test "$ELAN_HOME" = "$root/home/.elan"
          test "$XDG_CACHE_HOME" = "$root/cache"
          test "$TMPDIR" = "$root/tmp"
          test "$LEAN_NUM_THREADS" = 3
          case "$RUNNER_WORKSPACE" in "$root/_work/"*) ;; *) exit 1 ;; esac
          test ! -e "$HOME/.config/gh/hosts.yml"
          git --version
          python3 --version
          python3 - <<'PY'
          import os,pathlib
          cg=pathlib.Path('/sys/fs/cgroup')/pathlib.Path('/proc/self/cgroup').read_text().strip().split('::',1)[1].lstrip('/')
          assert (cg/'memory.max').read_text().strip()==str(12*1024**3)
          quota,period=map(int,(cg/'cpu.max').read_text().split())
          assert quota==3*period
          parent=cg.parent
          assert (parent/'memory.max').read_text().strip()==str(48*1024**3)
          probe=pathlib.Path(os.environ['TMPDIR'])/'migration-smoke.txt'
          probe.write_text(os.environ['RUNNER_NAME']);assert probe.read_text()==os.environ['RUNNER_NAME'];probe.unlink()
          print('Runner identity, isolated paths, CPU and memory limits verified.')
          PY
      - name: Prepare a small independent Lean project
        id: fixture
        shell: bash
        run: |
          set -euo pipefail
          smoke_dir=$(mktemp -d "$RUNNER_TEMP/lean-capability.XXXXXX")
          echo "directory=$smoke_dir" >> "$GITHUB_OUTPUT"
          printf '%s\n' 'leanprover/lean4:v4.32.1' > "$smoke_dir/lean-toolchain"
          cat > "$smoke_dir/lakefile.toml" <<'TOML'
          name = "runnerSmoke"
          version = "0.1.0"
          [[lean_lib]]
          name = "Smoke"
          [[lean_exe]]
          name = "smoke"
          root = "Main"
          TOML
          cat > "$smoke_dir/Smoke.lean" <<'LEAN'
          import Std
          def answer : Nat := 42
          theorem answer_correct : answer = 42 := by decide
          theorem reverse_twice (xs : List Nat) : xs.reverse.reverse = xs := by simp
          LEAN
          cat > "$smoke_dir/Main.lean" <<'LEAN'
          import Smoke
          def main : IO Unit := IO.println s!"lean-smoke:{answer}"
          LEAN
      - name: Install the pinned Lean toolchain
        shell: bash
        working-directory: ${{ steps.fixture.outputs.directory }}
        run: |
          set -euo pipefail
          # Use exactly the production action's installer, without its
          # repository-manifest prerequisite for this new scratch project.
          curl -fsSL https://raw.githubusercontent.com/leanprover/lean-action/38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9/scripts/install_elan.sh -o "$RUNNER_TEMP/smoke-install-elan.sh"
          bash "$RUNNER_TEMP/smoke-install-elan.sh"
          "$HOME/.elan/bin/lake" update
      - name: Compile, execute, reject an invalid proof, and rebuild
        shell: bash
        env:
          SMOKE_DIR: ${{ steps.fixture.outputs.directory }}
          LEAN_NUM_THREADS: '3'
        run: |
          set -euo pipefail
          python3 - <<'PYTEST'
          import json, os, pathlib, subprocess, time
          d = pathlib.Path(os.environ['SMOKE_DIR'])
          report = {'runner': os.environ['RUNNER_NAME'], 'toolchain': (d/'lean-toolchain').read_text().strip(), 'timings_seconds': {}}
          def run(key, args, expected=0):
              start = time.monotonic()
              result = subprocess.run(args, cwd=d, text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
              report['timings_seconds'][key] = round(time.monotonic()-start, 3)
              print(f'{key}: exit={result.returncode}, seconds={report["timings_seconds"][key]}')
              print(result.stdout[-2000:])
              if expected == 0:
                  assert result.returncode == 0, (key, result.returncode)
              else:
                  assert result.returncode != 0 and 'error:' in result.stdout, key
              return result.stdout
          report['lean_version'] = run('version', ['lake', 'env', 'lean', '--version']).strip()
          run('cold_build', ['lake', 'build', 'Smoke', 'smoke'])
          assert (d/'.lake/build/lib/lean/Smoke.olean').is_file()
          exe = str(d/'.lake/build/bin/smoke')
          assert run('execute', [exe]).strip() == 'lean-smoke:42'
          olean = d/'.lake/build/lib/lean/Smoke.olean'
          before = olean.stat().st_mtime_ns
          run('warm_build', ['lake', 'build', 'Smoke', 'smoke'])
          assert olean.stat().st_mtime_ns == before, 'unchanged module unexpectedly rebuilt'
          (d/'Invalid.lean').write_text('example : (1 : Nat) = 2 := by rfl\n')
          run('invalid_proof_rejected', ['lake', 'env', 'lean', 'Invalid.lean'], expected=1)
          (d/'Smoke.lean').write_text((d/'Smoke.lean').read_text().replace('42', '43'))
          run('dependency_rebuild', ['lake', 'build', 'Smoke', 'smoke'])
          assert run('execute_changed', [exe]).strip() == 'lean-smoke:43'
          report['result'] = 'passed'
          (d/'result.json').write_text(json.dumps(report, indent=2)+'\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('### '+report['runner']+' — passed\n\n')
              summary.write('Theorem elaboration, .olean generation, executable linking/runtime, invalid-proof rejection, warm reuse and dependency invalidation all passed.\n\n')
              summary.write('```json\n'+json.dumps(report, indent=2)+'\n```\n')
          PYTEST
      - uses: actions/upload-artifact@v4
        with:
          name: lean-smoke-${{ matrix.slot }}
          path: ${{ steps.fixture.outputs.directory }}/result.json
          if-no-files-found: error
