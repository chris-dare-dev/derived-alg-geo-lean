name: CI

on:
  # `agent/**` WAS in this list and was removed on 2026-09-19.
  #
  # Every agent branch carries a pull request, so every commit was built TWICE:
  # once here on the self-hosted Windows lane, and once on `ubuntu-latest` for
  # the `pull_request` event. Measured over the 195 commits that both lanes
  # built between 2026-09-14 and 2026-09-19:
  #
  #                          self-hosted push    hosted pull_request
  #       median                   40.2 min             20.8 min
  #       mean                     85.5 min             17.7 min
  #       finished first               28%                  72%
  #       succeeded (week 38)          16%                  53%
  #       dropped at 24h             66 runs                    0
  #
  # That is 278 workstation-hours in a six-day window spent on commits the free
  # hosted lane also verified, and it INVERTS the premise the concurrency block
  # below was written on. "The push run is the fast one" was true in week 34
  # (19.9 min median against 12.1) and has not been true since week 36. Three
  # self-hosted runners now share one workstation the owner also builds on, and
  # in 8 of 14 sampled push-lane failures NO STEP FAILED -- the job itself died,
  # which is contention rather than a verdict.
  #
  # WHAT THIS GIVES UP, stated rather than hidden: a branch pushed with no pull
  # request open now gets no CI at all. That is the price of the change, not an
  # oversight. Open the PR first, or run `lean-gates full` locally.
  #
  # The owner retired Windows on 2026-09-21. Main now has one dedicated
  # Ubuntu runner; three other Ubuntu runners accept manual branch builds.
  push:
    branches: [main]
  pull_request:
  # A merge queue entry is a synthetic branch GitHub builds from `main` plus the
  # queued PR(s), and it reports its own checks. Without this trigger the queue
  # would sit forever waiting for a check that never runs, so this line and the
  # "Require merge queue" setting have to be turned on in that order: this first,
  # the setting second. Removing it later re-creates the same deadlock.
  merge_group:
  workflow_dispatch:

concurrency:
  # Keyed on github.ref, and there is no longer a second lane for it to keep
  # apart: `push` fires on `main` alone as of 2026-09-19, so an agent branch
  # produces exactly one run and that run is the `pull_request` one. The
  # paragraph this replaces argued the two lanes "are not redundant" because
  # "the push run is the fast one"; the table in the `on:` block above is why
  # that no longer holds.
  #
  # BRANCH CANCELLATION STILL WORKS, and it is worth knowing why, because the
  # obvious reading says it should have broken. For a `pull_request` event
  # github.ref is `refs/pull/N/merge`, which is STABLE across pushes to the same
  # pull request -- so re-pushing five times in a minute still leaves one live
  # run, exactly as the branch-push lane used to. (The old warning is kept for
  # whoever tries the obvious collapse key next: github.event.pull_request
  # .head.ref is `agent/x` while github.ref is `refs/heads/agent/x`; it would
  # take github.head_ref || github.ref_name.)
  #
  # `main` and the merge queue are EXEMPT from cancellation, AND `main` is keyed
  # per commit, because cancellation is only half of what evicts a run.
  #
  # The badge renders the newest run of this workflow on `main`, and it draws a
  # `cancelled` run as a failure. `cancel-in-progress: false` protects a run
  # that has already STARTED. It does nothing for a run that is still QUEUED:
  # GitHub keeps at most one PENDING run per concurrency group, so the next
  # merge evicts the waiting one no matter what this flag says.
  #
  # That is not theoretical. On 2026-09-13, with two busy `owner-win` runners
  # and a ~13 minute build, main runs were arriving faster than they could
  # start: runs 34727342451 (a2dae262) and 34728317209 (ffdb7796) were both
  # cancelled with `jobs: 0`, having never been assigned a runner, and the last
  # 30 `main` runs of this workflow were 26 cancelled, 2 failure, 0 success.
  # The badge read `failing` for hours while every gate actually passed.
  #
  # An earlier version of this comment claimed the exemption "keeps the
  # README's CI badge honest" and that it "does NOT queue one run per merge",
  # on the reasoning that "the run that survives is always the newest, which is
  # the one the badge reads". That holds only if no newer merge arrives before
  # the pending run starts. At this repository's cadence one always does, so
  # the surviving run was perpetually the newest QUEUED one and never a
  # completed one.
  #
  # Keying `main` by `github.sha` gives every commit its own group, so main runs
  # never evict each other and each merge is actually verified. This DOES cost
  # one full build per merge on `owner-win` -- the thing the old comment was
  # trying to avoid -- which is the deliberate trade: a badge that reports the
  # build is worth more than runner time spent cancelling the evidence for it.
  # If that cost bites, reduce the merge rate or add a runner; do not restore
  # the shared key and expect the badge to mean anything.
  #
  # Branch lanes keep the old behaviour deliberately -- an agent branch that is
  # pushed five times in a minute has no reason to build the first four. Since
  # 2026-09-19 the lane that behaviour applies to is the `pull_request` one;
  # see the top of this block for why that is the same thing.
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.ref == 'refs/heads/main' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: >-
    ${{ github.ref != 'refs/heads/main' && github.event_name != 'merge_group' }}

jobs:
  build:
    # Trusted push/manual builds use the owner's Ubuntu workstation.
    # Main has an exclusive label so manual branch builds cannot starve it.
    # PR and merge-group jobs stay on hosted Ubuntu. Do not add a fork-based
    # self-hosted route or restore the retired employer-issued Mac lane.
    # Each local service owns its HOME, .elan, cache, temp and _work roots.
    # See docs/ci/ubuntu-runners.md for the host resource and startup policy.
    runs-on: >-
      ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && ((github.ref == 'refs/heads/main' && fromJSON('["self-hosted", "Linux", "X64", "owner-linux-main"]'))
      || fromJSON('["self-hosted", "Linux", "X64", "owner-linux"]'))
      || 'ubuntu-latest' }}
    timeout-minutes: 90

    defaults:
      run:
        shell: bash
    steps:
      # Four services share 16 logical CPUs. Three Lean processes per job
      # reserve nominal CPU headroom for the desktop; systemd also bounds
      # aggregate CPU and memory. Hosted jobs retain their normal defaults.
      - name: Cap Lake's concurrency on the self-hosted lane
        env:
          LANE: ${{ runner.environment }}
        run: |
          set -euo pipefail
          echo "runner.environment=${LANE:-<empty>}"
          if [ "${LANE:-}" = "self-hosted" ]; then
            echo "LEAN_NUM_THREADS=3" >> "$GITHUB_ENV"
            echo "capped Lake at 3 concurrent lean processes for the rest of this job"
          else
            echo "hosted runner: leaving LEAN_NUM_THREADS at its default"
          fi

      - uses: actions/checkout@v4
        id: checkout
        with:
          # A diff base is needed by "What changed" below. On the self-hosted
          # lane the repository is already present, so this costs a fetch, not a
          # clone.
          fetch-depth: 0
          # THE SELF-HOSTED LANE'S WHOLE PURPOSE DEPENDS ON THIS LINE.
          #
          # checkout defaults to clean: true, which runs `git clean -ffdx`. The
          # -x removes IGNORED files, and .lake is ignored, so the default
          # deleted the entire build tree at the start of every run. The log
          # said so plainly and nobody had read it:
          #
          #   [command]git clean -ffdx
          #   Removing .lake/
          #
          # So "self-hosted for SPEED, persistent .lake instead of a cold
          # checkout every run" -- the reason this lane exists, stated at the
          # top of this job -- was not true as configured. Every run re-cloned
          # Mathlib, re-fetched 8639 cache files, and rebuilt from nothing.
          # Measured on run 32673808417: 21m23s in lean-action, of which 6m25s
          # was `lake exe cache get` and ~14m was a full rebuild.
          #
          # Cleaning still happens -- see the next step -- just not to `.lake`.
          #
          # Measured on chris-win-owner-runner-2, same workload either side:
          #
          #            lean-action step     whole build job
          #   before       21m23s               39m50s
          #   after         6m05s               31m57s
          #
          # Note the two do not reconcile -- 15m18s off the step but only 7m53s
          # off the job -- because that pair was not a controlled A/B: the
          # "after" run inherited a tree the "before" run had just rebuilt, so
          # part of it is a first-run effect. The direction is not in doubt; the
          # exact numbers are not steady state. If you are optimising this
          # further, measure two consecutive runs on one runner rather than
          # trusting the pair above.
          #
          # What is left in those 6m05s is mostly `lake exe cache get`
          # re-verifying the Mathlib cache against a `.lake/packages` that did
          # not change. That is the next thing worth attacking, and it is
          # independent of this.
          clean: false

      # Exactly what checkout's clean: true would have done, minus `.lake`.
      #
      # `clean: false` ALONE IS NOT SAFE HERE and this step is not optional
      # tidiness. Two things break without it:
      #
      #   * Untracked leftovers survive between runs, and `mfc build`/`seal`
      #     refuse to attest a dirty worktree -- "the worktree has uncommitted
      #     changes, so these measurements describe bytes that <sha> does not
      #     contain". `mfc-lint-report.txt` is written by the Contract gates
      #     step and is NOT gitignored, so it alone would fail every second run.
      #   * checkout's clean also does `git reset --hard`; skipping it would let
      #     a modified tracked file survive from a previous branch.
      #
      # Keeping `.lake` reintroduces the orphaned-artifact hazard that the
      # "Prune orphaned build artifacts" step below already exists to handle --
      # that step was written for the persistent-.lake case and until now had
      # nothing to prune on this lane.
      - name: Reset the tree, keeping .lake
        run: |
          set -euo pipefail
          git reset --hard
          git clean -ffdx -e .lake
          echo "kept: $(du -sh .lake 2>/dev/null | cut -f1 || echo 'no .lake yet')"

      # Path scoping (2026-08-14). #362 removed the per-file sorry sweep, which
      # was 72.9% of a 54-minute run; what is left is dominated by three axiom
      # audits and four linter passes, each of which used to run whatever the
      # change touched. Each is now gated on its own tree.
      #
      # FAIL-OPEN BY DESIGN: if the diff base cannot be resolved, or if anything
      # structural changed, `scope` is `all` and every gate runs exactly as
      # before. A gate is skipped only when this step has positively established
      # that no file it could possibly judge has changed. Never invert that
      # default -- a gate that silently does not run is worse than a slow one,
      # and this repository has already lost an audit to a subtler version of
      # that (scripts/check_audit.py's 2026-08-07 note).
      - name: What changed
        id: changed
        run: |
          set -euo pipefail
          base=""
          case "${{ github.event_name }}" in
            pull_request) base="${{ github.event.pull_request.base.sha }}" ;;
            push) base="${{ github.event.before }}" ;;
            # merge_group is deliberately absent. `github.event.merge_group.base_sha`
            # exists and would let this step scope a queue entry too -- and it
            # should not. The queue is the last thing that runs before `main`
            # moves, and it is the one place where two independently-green
            # branches meet for the first time; scoping there would reintroduce
            # exactly the hole the queue was added to close. Falling through
            # leaves `base` empty, which the check below turns into `scope=all`.
          esac
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "scope=all" >> "$GITHUB_OUTPUT"
            echo "no usable diff base -- running every gate"
            exit 0
          fi
          # Three-dot: diff from the MERGE BASE, so commits that landed on the
          # base branch after this one forked are not counted as ours.
          files=$(git diff --name-only "$base...HEAD")
          echo "$files" | sed 's/^/  /'
          if printf '%s\n' "$files" | grep -qE '^(lakefile\.toml|lean-toolchain|lake-manifest\.json|pins\.json|\.github/|scripts/|exe/)'; then
            echo "scope=all" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "scope=partial" >> "$GITHUB_OUTPUT"
          if printf '%s\n' "$files" | grep -qE '^DerivedAlgGeo(/|\.lean$)'; then
            echo "library=true" >> "$GITHUB_OUTPUT"
          else
            echo "library=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Foundation import boundary
        run: python3 scripts/check_foundation_import_boundary.py

      # Build-output cache, hosted lane only (2026-08-14, corrected 2026-08-15).
      #
      # Measured on this workflow: `lean-action` takes 9 minutes on the
      # self-hosted runner and 30 on ubuntu-latest. The difference is not the
      # hardware, it is that the self-hosted runner keeps `.lake` between runs --
      # 8.8 GB resident, of which mathlib's build is 7.1 GB and this repository's
      # own output is 1.1 GB. The hosted lane starts cold every time.
      #
      # Only `.lake/build` is cached. mathlib's 7.1 GB must never go in here:
      # GitHub's per-repository cache budget is 10 GB total, so one such entry
      # would evict everything else on write. `lean-action`'s use-mathlib-cache
      # already fetches mathlib's oleans from the Lean community cache, which is
      # the right source for them.
      #
      # THE PLATFORM SEGMENT IS A LITERAL, NOT `runner.os`, AND THAT IS THE WHOLE
      # POINT. It used to be `runner.os`, and the cache consequently never hit
      # once. Saves happened on `push` to main, which routes to the self-hosted
      # Mac, so they were written as `lake-build-macOS-...`; restores happen on
      # `pull_request`, which routes to ubuntu-latest, so they looked up
      # `lake-build-Linux-...`. The two key spaces are disjoint by construction
      # and the restore-key prefix cannot bridge them either -- it carries the
      # same segment. An `.lake/build` produced on macOS-ARM64 is not usable on
      # linux-x86_64 in any case, so the fix is not to make the two lanes agree
      # on a variable: it is to state the platform this cache is FOR, and to have
      # a runner of that platform be the thing that writes it. That is the
      # `Cache warm` workflow, in .github/workflows/cache-warm.yml.
      #
      # Restore is keyed exactly, then falls back by prefix to the newest cache
      # for the same toolchain and manifest -- in practice the one `Cache warm`
      # saved on `main`, found via GitHub's default-branch fallback.
      # A stale restore is safe rather than merely tolerable: lake's build is
      # trace-hash based, so anything out of date is rebuilt. The failure mode is
      # a slower run, never a wrong one.
      #
      # Keyed on `runner.os == 'Linux'` rather than on the event, so the
      # condition tracks the thing it is actually about. The self-hosted Mac
      # skips this step because its own `.lake` is already warm, not because of
      # which event got it here.
      - name: Restore build output
        if: runner.os == 'Linux'
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: lake-build-linux-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-build-linux-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-

      # Orphaned artifacts, and why a stale restore is NOT merely slow.
      #
      # The restore comment above says "a stale restore is safe rather than
      # merely tolerable ... the failure mode is a slower run, never a wrong
      # one." That is true of the BUILD -- lake's traces rebuild anything out of
      # date -- and false of everything downstream that reads `.lake/build` as a
      # description of what exists. lake never deletes the artifacts of a source
      # that is gone, so a `.lake/build` restored from `main` keeps `.ilean`
      # files for modules this branch does not have.
      #
      # `mfc check-ilean-coverage` reads exactly those files, so it reports them
      # as "built by lake, absent from the emission" and fails I-03/I-04 -- a red
      # run caused by the cache rather than by the diff. Observed on #698 and
      # #699, where the reported set tracked whatever `main` had merged most
      # recently (TwistAdd and IntegralBridge, then the CentralCharge pair) and
      # never mentioned anything either branch touched.
      #
      # Deleting `.lake/build` outright would fix it and cost the whole point of
      # the cache: 9 minutes warm against 30 cold, measured above. So prune the
      # orphans instead -- an artifact whose `.lean` no longer exists cannot be
      # wanted by anything, and if this is ever wrong the effect is a rebuild,
      # not a wrong answer.
      #
      # Scoped to `DerivedAlgGeo/`, where the artifact path maps to the source
      # path directly. `Emit.ilean` and the `*Audit.ilean` come from `exe/` and
      # `scripts/` via srcDir, so a root-relative existence test would prune them
      # wrongly; they are left alone.
      #
      # Runs on both lanes. The self-hosted Mac keeps its own `.lake` across
      # runs and accumulates orphans the same way -- measured 42 in one working
      # tree, left by an old layering refactor -- so restricting this to the
      # restoring lane would leave a known latent failure on the other.
      - name: Prune orphaned build artifacts
        run: |
          set -euo pipefail
          root=.lake/build/lib/lean/DerivedAlgGeo
          if [ ! -d "$root" ]; then
            echo "no build output yet; nothing to prune"
            exit 0
          fi
          pruned=0
          while IFS= read -r -d '' art; do
            src="DerivedAlgGeo/${art#"$root"/}"
            src="${src%.ilean}.lean"
            if [ ! -f "$src" ]; then
              rm -f "$art" "${art%.ilean}.olean"
              pruned=$((pruned + 1))
            fi
          done < <(find "$root" -name '*.ilean' -print0)
          echo "pruned $pruned orphaned artifact pair(s)"

      # use-github-cache is OFF (2026-08-15). Left at its default of `true` it
      # writes all of `.lake` -- 2.4 GB per entry -- and every one of those
      # entries was unreadable:
      #
      #   * on the self-hosted lane it writes `lake-macOS-ARM64-...`, which no
      #     hosted job can use, while that runner already keeps its own 8.3 GB
      #     `.lake` between runs and needs none of it;
      #   * on the `pull_request` lane GitHub scopes the entry to
      #     `refs/pull/N/merge`, readable only by re-runs of that same PR, and
      #     this workflow builds a given PR once.
      #
      # Four such entries were holding 9.6 GB of the 10 GB repository budget at
      # a measured hit rate of zero, which meant every write LRU-evicted
      # something that might otherwise have been useful -- including the
      # `.lake/build` entry above. `use-mathlib-cache` stays on: mathlib's
      # oleans come from the Lean community cache, which is the right source and
      # costs no repository budget at all.
      # Pinned to a commit, not to `v1`. `v1` is a MOVING tag -- the maintainers
      # repoint it -- so `@v1` is a pin that does not pin, which is the same
      # failure `CLAUDE.md` names for `lake update` re-resolving a branch
      # `inputRev`. The first symptom would be a build that changes with
      # nothing in the diff to explain it. 38fbc41 is v1 as of 2026-04-22.
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1
        with:
          build: true
          use-mathlib-cache: true
          use-github-cache: false
          # nanoda is off, and NOT because the axis does not matter. Measured
          # while standing up CI for math-formal-contract-lean, recorded here
          # rather than rediscovered: `nanoda: true` cannot run at this
          # toolchain. lean-action's run_nanoda.sh detects the module name with
          # `grep -A5 '^\[package\]' lakefile.toml`, and Lake REJECTS the
          # `[package]` table that grep wants; past that, lean4export master
          # emits NDJSON 3.1.0 while nanoda 0.3.2 expects the older
          # space-separated format.
          nanoda: false
          # ...and this line is load-bearing even though nanoda is off.
          #
          # `nanoda-allow-sorry` DEFAULTS TO "true" (verified in the action's
          # own action.yml). So the day anyone flips `nanoda: true`, the
          # default silently adds a checker that PASSES ON SORRY-BACKED
          # PROOFS -- a green check meaning nothing, in a repository whose
          # CLAUDE.md forbids `sorry` outright. Setting it false now costs a
          # line and removes the trap; leaving it to be remembered later is
          # how the trap gets sprung.
          nanoda-allow-sorry: false

      - name: Pin and coverage records
        id: pin
        continue-on-error: true
        env:
          # For check_pin.py's reachability test: it asks whether each
          # bare-commit pin is on its own repository's default branch, which is
          # the one question this repo cannot answer from its own tree.
          # Read-only repository metadata; the default token's scope is enough.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # `--require-api` because this is the environment guaranteed to have
          # the API. Locally the same check degrades to NOT_RUN so a
          # contributor without `gh` is not blocked; here a check that could
          # not look must not pass. Same contract as check_roadmap.py.
          python3 scripts/check_pin.py --require-api
          # Every coverage record, not a hand-maintained list of two. This PR
          # adds five, and under the old naming they would all have landed
          # unvalidated -- as would every record added after it.
          for f in registry/coverage-*.json; do
            python3 scripts/check_coverage_map.py "$f"
          done

      - name: Algebraic-geometry axiom audit
        id: ag_axiom_audit
        continue-on-error: true
        run: |
          set -euo pipefail
          # Development probes are outside the public umbrella and must be
          # built explicitly for this audit.
          lake build DerivedAlgGeo.Development \
            DerivedAlgGeo.AlgebraicGeometry.Numerical.Specializations.Surface \
            DerivedAlgGeo.AlgebraicGeometry.Numerical.Specializations.Threefold \
            DerivedAlgGeo.AlgebraicGeometry.Numerical.Specializations.Fourfold
          : > algebraic-geometry-audit.txt
          for f in scripts/AlgebraicGeometryAudit/*.lean; do
            lake env lean "$f" >> algebraic-geometry-audit.txt 2>&1
          done
          if grep -q 'sorryAx' algebraic-geometry-audit.txt; then
            echo "::error::sorryAx reached the algebraic-geometry audit"
            exit 1
          fi
          # Allowlist + truncation + parse checks, same standard as the other
          # two audit lanes. Until 2026-08-18 this lane checked only sorryAx,
          # so a custom axiom or a truncated transcript passed it (review
          # finding P2-3).
          python3 scripts/check_audit.py algebraic-geometry-audit.txt \
            scripts/AlgebraicGeometryAudit.lean

      - name: Stability-condition axiom audit
        id: stability_axiom_audit
        continue-on-error: true
        run: |
          set -euo pipefail
          : > stability-condition-audit.txt
          for f in scripts/StabilityConditionAudit/*.lean; do
            lake env lean "$f" >> stability-condition-audit.txt 2>&1 || {
              echo "::error::$f failed to elaborate"
              cat stability-condition-audit.txt
              exit 1
            }
          done
          python3 scripts/check_audit.py stability-condition-audit.txt

      - name: DG axiom audit
        id: dg_axiom_audit
        continue-on-error: true
        run: |
          set -euo pipefail
          lake env lean scripts/DGCategoryAudit.lean > dg-audit.txt 2>&1 || {
            echo "::error::scripts/DGCategoryAudit.lean failed to elaborate"
            cat dg-audit.txt
            exit 1
          }
          python3 scripts/check_audit.py dg-audit.txt scripts/DGCategoryAudit.lean

      - name: Audit completeness
        id: audit_completeness
        continue-on-error: true
        run: |
          set -euo pipefail
          # check_audit.py catches an audit that lists a name the source no
          # longer has. This catches the reverse -- a new public declaration
          # nobody listed -- which is how PR #354 landed IsQuasiEquivalence
          # outside the DG audit entirely. A ratchet, not a hard gate: the
          # algebraic-geometry and stability subsystems carry pre-existing gaps, recorded as
          # ceilings in check_audit_complete.py, and only growth fails.
          lake env lean scripts/EnumDecls.lean > enum-decls.txt 2>&1 || {
            echo "::error::scripts/EnumDecls.lean failed to elaborate"
            cat enum-decls.txt
            exit 1
          }
          python3 scripts/check_audit_complete.py enum-decls.txt

      - name: Single instantiation
        id: single_instantiation
        continue-on-error: true
        run: |
          set -euo pipefail
          # The disease detector: a generic abstraction written for N cases,
          # instantiated once, and never adopted. It reuses the build the step
          # above already did.
          #
          # This ran only in scripts/gates.sh until now, which is precisely why
          # it drifted: between 2026-09-08 and 2026-09-14, 29 names arrived at
          # or below one inhabitant against 80 recorded, and nothing anywhere
          # went red. A gate whose whole purpose is to make invisible drift
          # visible cannot itself be invisible.
          lake env lean scripts/EnumInhabitants.lean > enum-inhabitants.txt 2>&1 || {
            echo "::error::scripts/EnumInhabitants.lean failed to elaborate"
            cat enum-inhabitants.txt
            exit 1
          }
          python3 scripts/check_single_instantiation.py enum-inhabitants.txt

      - name: Environment linters
        id: environment_linters
        continue-on-error: true
        run: |
          set -euo pipefail
          # The pre-existing backlog is enumerated per declaration in
          # scripts/nolints.json, so this gate rejects anything NEW while the
          # 203 known violations stay visible and countable. Never silence a
          # failure with `runLinter --update`: that rewrites the whole file
          # from the current run and would bless the new violation along with
          # everything else. Fix the declaration, or argue for the exception.
          #
          # check_nolints.py is NOT scoped: it reads the checked-in file, it is
          # cheap, and it is the half of this gate that catches a stale entry.
          lake exe runLinter DerivedAlgGeo
          python3 scripts/check_nolints.py
          # Style is per-file and cheap; it always runs.
          lake exe lint-style

      - name: Compiler warning ratchet
        id: warning_ratchet
        continue-on-error: true
        run: |
          set -euo pipefail
          # The warnings Lean emits while elaborating were never gated, so they
          # only grew: 93 by the time this was wired, in which a Mathlib
          # deprecation with a real deadline looked exactly like a `simpa` nag.
          # scripts/check_warnings.py holds deprecations at zero in code we own
          # and lets the rest shrink but never grow, the same ratchet shape as
          # scripts/nolints.json above.
          #
          # The library is already built by now, so this re-invocation compiles
          # nothing: Lake replays the cached modules and reprints their
          # warnings, which is the whole reason the raw count in a full log is
          # several times the real one. If that ever stops being true the
          # capture comes back empty, and the script fails rather than passing
          # vacuously on a silent log.
          lake build DerivedAlgGeo 2>&1 | tee lean-warnings.log
          python3 scripts/check_warnings.py lean-warnings.log

      - name: Gate console encoding
        id: console_encoding
        continue-on-error: true
        # Every gate prints declaration names; on this runner's cp1252 console
        # a gate that cannot print `δ` dies with a `charmap` traceback instead
        # of its finding (#868, #869). Checks that each script routes its
        # console through scripts/_output.py, and reproduces the crash to prove
        # the helper prevents it.
        run: python3 scripts/_output.py

      - name: Mathlib-style known-answer fixtures
        id: style_fixtures
        continue-on-error: true
        # scripts/check_mathlib_style.py itself runs from the edit hook and from
        # scripts/gates.sh, never here -- it judges a branch's own lines, which
        # CI has no use for. Its fixtures are a different question: they are what
        # says the checker still rejects what it is meant to reject, and a check
        # that quietly stops firing is how #1359 reached the Lean parser.
        run: python3 scripts/check_mathlib_style.py --self-test

      - name: Mathlib-style baseline ratchet
        id: style_ratchet
        continue-on-error: true
        # The other half of the same checker. `--self-test` says it still
        # rejects what it is meant to reject; this says the library has not
        # grown a new ERROR outside scripts/style-baseline.json. The edit hook
        # is the primary enforcement and cannot be relied on alone -- it only
        # sees files an agent edits, and a human commit never passes through it.
        run: python3 scripts/check_mathlib_style.py --check-baseline

      - name: Stability source independence
        id: source_independence
        continue-on-error: true
        run: python3 scripts/check_source_independence.py

      - name: Subject ownership layering
        id: subject_layering
        continue-on-error: true
        run: python3 scripts/check_layering.py

      - name: Neutral derived-category Stability import closure
        id: neutral_stability_imports
        continue-on-error: true
        run: python3 scripts/check_neutral_stability_imports.py

      - name: Umbrella coverage
        id: umbrella_coverage
        continue-on-error: true
        run: python3 scripts/check_umbrella_coverage.py

      - name: Root reachability
        id: root_reachability
        continue-on-error: true
        run: python3 scripts/check_root_reachability.py

      - name: Coherent families architecture
        id: coherent_families
        continue-on-error: true
        run: python3 scripts/check_coherent_families.py

      - name: Explicit numerical data architecture
        id: numerical_data
        continue-on-error: true
        run: python3 scripts/check_explicit_numerical_data.py

      - name: No declaration uses sorry
        id: sorry_gate
        continue-on-error: true
        run: |
          set -euo pipefail
          # This step used to be a serial `lake env lean` over every tracked
          # .lean file: 39m23s of a 54m01s run (72.9% of CI wall clock) spent
          # re-elaborating from source what the build step had just built. The
          # emitter below is both cheaper and stronger -- it reads the
          # environment, not the text a `set_option ... in` evasion hides in --
          # so the loop is now one file wide. See #361 and exe/Emit.lean.
          #
          # An `lean_exe` root cannot appear in an emission built from its own
          # imports, so exe/ is exactly what the emitter cannot reach and this
          # is exactly what is left of the loop. Keep the two in agreement:
          # scripts/check_emission_coverage.py excludes exe/ on the strength of
          # this step existing.
          # `lake env lean` does not build; it only sets LEAN_PATH. The exe root
          # imports the sweep umbrella, which is not a default target, so build
          # it here rather than depending on what an earlier step happened to
          # leave behind.
          #
          # The LIBRARY, not the executable. This used to be `lake build emit`,
          # and linking an executable requires every transitively imported module
          # compiled to a native object -- 4173 Mathlib `:c.o` targets, plus ~300
          # more, on every hosted run. Measured on PR #421 that was 337s of a
          # 660s job, and it survived the build cache because those objects live
          # under .lake/packages, which the `.lake/build` cache does not cover.
          # Nothing in this step needs the executable: `lake env lean` reads
          # oleans. See the "Emit combined environment" step for the same change
          # where it matters more.
          # RestateHistoricalNames is a separate executable-only library, not a
          # dependency of the public or sweep umbrella. Build it explicitly so
          # the source loop and the later interpreted restatement both work on
          # a clean runner rather than relying on a cached olean.
          lake build DerivedAlgGeoSweep RestateHistoricalNames
          : > lean-source-check.txt
          for f in exe/*.lean; do
            lake env lean "$f" 2>&1 | tee -a lean-source-check.txt
          done
          if grep -q "declaration uses 'sorry'" lean-source-check.txt; then
            echo "::error::a declaration uses sorry"
            exit 1
          fi

      - name: Emit combined environment
        id: emit
        continue-on-error: true
        run: |
          set -euo pipefail
          # INTERPRETED, not compiled, and this is the single biggest saving left
          # in this workflow. `lake exe emit` needs the executable linked, and
          # linking one compiles every transitively imported module to a native
          # object: 4173 Mathlib `:c.o` targets plus ~300 others, then a 278 MB
          # link. None of it is cached -- those objects live under
          # .lake/packages/*/.lake/build/ir, and the `.lake/build` cache covers
          # only the root package -- so it recurred on every single hosted run.
          #
          # The interpreter needs none of it: it reads the oleans the build cache
          # already restored. Measured on a warm tree, interpreted is also
          # FASTER than compiled end to end (134s vs 158s), because the compiled
          # path pays to load a 278 MB binary that the interpreter never
          # produces.
          #
          # Verified equivalent before switching: both paths emit 11945
          # constants, identical names, identical `counts`, identical `cites`
          # totals; the only differing byte in the whole artifact is
          # `emitted_at`. And exit codes propagate through `--run` (3 -> 3,
          # 0 -> 0, a thrown IO error -> 1), which is load-bearing, because the
          # non-zero exit BELOW IS the repository-wide sorry gate. If that ever
          # stopped propagating, this gate would pass vacuously forever.
          #
          # `lake build emit` still runs in the cache-warm workflow, so the
          # executable is still proved to link on Linux once per merge to main;
          # it is only off the per-pull-request path.
          lake build DerivedAlgGeoSweep
          # Non-zero when any constant's axiom closure contains sorryAx. This is
          # the repository-wide sorry gate; the artifact is written either way.
          lake env lean --run exe/Emit.lean --out attest/lean-emission.json
          # ...and this is what keeps that gate from silently shrinking to a
          # scope where the claim is vacuously true. See the script's docstring.
          python3 scripts/check_emission_coverage.py attest/lean-emission.json
          python3 - <<'PY'
          import json
          d = json.load(open("attest/lean-emission.json", encoding="utf-8"))
          n = len(d["constants"])
          if n == 0:
              raise SystemExit("::error::empty emission -- the vacuous pass")
          print(f"ok: {n} constants, {d['counts']['in_scope']} in scope, "
                f"{sum(1 for c in d['constants'] if c['cites'])} cited")
          PY


      # The save half of this cache is NOT here. It used to be, guarded on
      # `push` to `main` -- but `push` routes to the self-hosted Mac, so this
      # job wrote a macOS entry that the lane needing it could never read. The
      # writer has to be a runner of the platform the cache is for; see the
      # `Cache warm` workflow, in .github/workflows/cache-warm.yml.

      # The mfc gates. #156 specifies seven steps; this lands 3, 4 and 6.
      #
      # Verified before landing, against THIS repo's own CI emission (run
      # 32086611934, 15346 constants) rather than against fixtures:
      # `mfc lint` reports 7 passed, 0 failed, 5 not_run -- every not_run a
      # missing input (no registry yet, no closed-lanes config), none of them a
      # rule that could have fired and did not.
      #
      # Two defects surfaced doing that, both fixed upstream first:
      # `counts.foreign` (8 constants attributed to Mathlib modules) and the
      # repeatable `--lib`, without which coverage scopes to DerivedAlgGeoSweep
      # alone and reports "1 in-scope module of 488 built; 0 built
      # declarations" -- green, having compared nothing.
      - name: Contract gates
        id: contract_gates
        continue-on-error: true
        # Skipped rather than run when the emitter failed: this step reads
        # attest/lean-emission.json, and a missing-input traceback is not a
        # verdict about the repository. `emit` already reports that failure.
        if: steps.emit.outcome == 'success'
        run: |
          set -euo pipefail
          # Its own venv, in the workspace. The self-hosted lane is the owner's
          # daily-driver Mac and this must not touch its system python.
          #
          # The interpreter is CHOSEN, not inherited. `python3` on that Mac is
          # 3.9.6, and `mfc` needs 3.11+ because `mfc env` reads lakefile.toml
          # with `tomllib`. Inheriting it cost a full 20-minute build followed
          # by ModuleNotFoundError -- and the same commit was simultaneously
          # green on the hosted lane, whose `python3` is newer, which is the
          # worst shape a CI failure can take.
          PY311=""
          for c in python3.13 python3.12 python3.11 python3; do
            if command -v "$c" >/dev/null 2>&1 && \
               "$c" -c 'import sys; raise SystemExit(0 if sys.version_info >= (3,11) else 1)'; then
              PY311="$c"; break
            fi
          done
          if [ -z "$PY311" ]; then
            echo "::error::no python >= 3.11 on this runner. mfc needs tomllib," \
                 "which is stdlib from 3.11; python3 here is $(python3 -V 2>&1)."
            exit 1
          fi
          echo "using $PY311 ($("$PY311" -V 2>&1))"
          # Delete it first. On the self-hosted lane the workspace persists, and
          # `python -m venv` over an existing directory does NOT reinstall what
          # is already there. `pip install "mfc @ git+...@<sha>"` then compares
          # by name and version, not by URL, so a pin bump that leaves the
          # version string alone is treated as already satisfied and the OLD mfc
          # survives the bump -- silently, and for as long as the runner lives.
          rm -rf .mfc-venv
          "$PY311" -m venv .mfc-venv

          # A venv puts its executables in `bin` on Unix and in `Scripts` on
          # Windows. Hardcoding `bin` made every Windows runner fail here with
          # "No such file or directory" on the pip line, one step after paying
          # for a full Lean build.
          #
          # Every consumer of the venv is INSIDE THIS STEP -- the two later
          # `python` invocations further down are the same `run:` block, not
          # separate steps. So these stay plain shell variables. An earlier cut
          # of this fix wrote them to $GITHUB_ENV and read them back as
          # $MFC_VENV_*, which cannot work: $GITHUB_ENV publishes to SUBSEQUENT
          # steps, never to the step doing the writing, so under `set -u` the
          # first read died with `MFC_VENV_PY: unbound variable` -- on Linux and
          # macOS, after a full build, having passed every Windows check it was
          # written for.
          VENV_BIN=".mfc-venv/bin"
          [ -d "$VENV_BIN" ] || VENV_BIN=".mfc-venv/Scripts"
          [ -d "$VENV_BIN" ] || { echo "::error::venv has neither bin/ nor Scripts/"; exit 1; }

          # The interpreter inside the venv is NOT reliably called `python`.
          # A venv names it after the base executable, and on Windows the base
          # here is `python3.exe` -- Windows CPython installs `python.exe` only,
          # so a `python3` on PATH is necessarily something else, and the venv
          # inherits that name, leaving `.mfc-venv/Scripts/python` absent.
          # Resolve it explicitly and fail loudly if no spelling exists. On Unix
          # `bin/python` is present and wins first, so this changes nothing for
          # the Mac and hosted lanes.
          VENV_PY=""
          for cand in "$VENV_BIN/python" "$VENV_BIN/python3" \
                      "$VENV_BIN/python.exe" "$VENV_BIN/python3.exe"; do
            if [ -x "$cand" ]; then VENV_PY="$cand"; break; fi
          done
          [ -n "$VENV_PY" ] || { echo "::error::no interpreter in $VENV_BIN"; exit 1; }
          echo "using venv interpreter $VENV_PY"

          "$VENV_BIN/pip" install --quiet \
            "mfc[yaml] @ git+https://github.com/chris-dare-dev/math-formal-contract-lean@bda0e6130add381098f251b83f8bedfeec8d6a8b#subdirectory=contract"
          MFC="$VENV_BIN/mfc"

          # Assert the installed schema is the one the emitter writes against.
          #
          # When these disagree the symptom is 21167 near-identical lines, one
          # per constant, none of which names the cause -- as happened on
          # 2026-09-04, when a stale `contract/build/lib` shipped a schema whose
          # `constant` had no `discharges`, `doc` or `scope` and whose `counts`
          # had no `external` or `foreign`, all under `additionalProperties:
          # false`. Upstream b5a63cbab0cc removed that directory, so this should
          # now always pass; it is cheap, and it is the difference between one
          # line that names the five fields and 21167 that name every constant
          # in the library.
          "$VENV_PY" -c 'import json,os,sys,mfc; p=os.path.join(os.path.dirname(mfc.__file__),"schema","emission-1.0.schema.json"); d=json.load(open(p,encoding="utf-8")); missing=({"discharges","doc","scope"}-set(d["$defs"]["constant"]["properties"]))|({"external","foreign"}-set(d["properties"]["counts"]["properties"])); sys.exit(0) if not missing else (print("::error::installed mfc emission schema is stale: it rejects "+", ".join(sorted(missing))+", which the emitter emits."), sys.exit(1))'
          echo "emission schema accepts the emitter field set"

          "$MFC" validate attest/lean-emission.json

          "$MFC" env --repo . --out attest/environment.json \
            --axiom-allowlist propext,Quot.sound,Classical.choice \
            --emitter-version mfc-emit/1.1.0
          "$MFC" validate attest/environment.json

          "$MFC" bundle --emission attest/lean-emission.json \
                        --environment attest/environment.json \
                        --out attest/declarations.json

          # --registry runs E-04, E-05 and E-12 against the minted registry;
          # until 2026-08-18 the step comment claimed no registry existed while
          # `mfc seal` consumed one three commands later, and running E-12
          # exposed a real unanchored discharge edge (adversarial review,
          # finding P2-4). E-09 and E-11 still need a closed-lanes config this
          # repo has not minted, so the EXACT expected not_run set is asserted
          # below: any silent widening of it -- a malformed registry, a schema
          # drift demoting more rules -- fails the step instead of printing a
          # smaller green table.
          "$MFC" lint --emission attest/lean-emission.json \
                      --environment attest/environment.json \
                      --registry registry/bridgeland2007.json \
            | tee mfc-lint-report.txt
          actual_not_run=$(grep -oE '^not_run  E-[0-9]+' mfc-lint-report.txt \
            | awk '{print $2}' | sort | paste -sd, -)
          if [ "$actual_not_run" != "E-09,E-11" ]; then
            echo "::error::mfc lint not_run set is '$actual_not_run', expected" \
                 "'E-09,E-11'. A rule stopped running (or started); update this" \
                 "assertion only with the config change that explains it."
            exit 1
          fi

          # BOTH roots. The emitter sweeps DerivedAlgGeoSweep plus DerivedAlgGeo
          # (exe/Emit.lean), and a single root makes this check vacuous rather
          # than wrong -- see the note above.
          "$MFC" check-ilean-coverage --emission attest/lean-emission.json \
            --lib DerivedAlgGeoSweep --lib DerivedAlgGeo

          # Step 5 of #156. It runs when there is something to run it on, and
          # says so when there is not -- arXMCP produces resolution.json and
          # that is M2/e7 (#134), so today this prints the notice.
          if [ -f attest/resolution.json ]; then
            "$MFC" check-resolution attest/resolution.json
          else
            echo "::notice::check-resolution did NOT run: no attest/resolution.json yet (arXMCP-side, #134)"
          fi

          # The roadmap-vs-tracker check (#620) NO LONGER RUNS HERE. It is the
          # `roadmap` job further down this file, and it is in `ci`'s `needs`,
          # so it still blocks the merge -- this is a move, not a demotion.
          #
          # It moved because it was the LAST thing in the last gate step of a
          # 14-minute build, and it is the one gate here that can fail on a
          # pull request that compiles perfectly. #1392 built clean -- 1770
          # jobs, zero sorries, every other gate green -- and failed at
          # 14m04s on RM-08, because its body said `Closes #854` while the
          # entry read `status: blocked`. Nothing that check reads comes out
          # of the build: it reads `.claude/roadmap/*.yaml` and the GitHub
          # API, so the wait bought nothing and cost a full cycle per typo.
          #
          # It lived here for a real reason, now gone: it needs PyYAML, and
          # `.mfc-venv` was the only interpreter in this workflow guaranteed
          # to have it (the self-hosted lane's `python3` is 3.9.6 system
          # Python). The new job is hosted-only and builds its own venv, so
          # it does not inherit that constraint. Do not move it back to save
          # a job: the PR_NUM logic must exist exactly once, and a second
          # copy is the thing that drifts.

          # ------------------------------------------------------------------
          # build.json, and the honest size of what it measured.
          #
          # There is no cheap route to project-wide NDJSON, and the obvious
          # wirings are worse than nothing because THEY LOOK CLEAN. Measured on
          # v4.32.1 before writing this:
          #
          #   - `lake env lean --json` on a root import file prints NOTHING.
          #     Imports are served from oleans and never re-reported, so this
          #     step would have emitted error_count 0, warning_count 0,
          #     sorry_diagnostic_count 0 having elaborated no library module --
          #     and `mfc seal` would have accepted it as the build/v1 predicate
          #     C-12 requires. A vacuous pass wearing a passing bundle.
          #   - `moreLeanArgs = ["--json"]` is consumed by lake, which
          #     re-renders every message in its own text format.
          #   - lake persists no structured log: .hash, .trace, .olean, .ilean.
          #   - per-module invocation pays a full Mathlib import load each time;
          #     494 own modules is hours, not a per-commit step.
          #
          # So this covers the two ROOT modules and says so. `--covers` is what
          # puts `measured: {modules, in_scope_modules}` in the artifact, and
          # `mfc build` prints "PARTIAL diagnostics cover 2 of N" on stderr
          # every run. The number is meant to look small. It is small.
          #
          # THE REPOSITORY-WIDE SORRY GATE IS NOT THIS. It is the emission step
          # above: `lake env lean --run exe/Emit.lean` exits non-zero when any
          # constant's axiom closure contains sorryAx, over every constant in
          # the environment, and it is strictly stronger than any build-log
          # count because it cannot be defeated by declaration syntax.
          #
          # `set +e` around the sweep for the same reason as the exit capture
          # below: a root module that will not elaborate is exactly when the
          # diagnostics are worth having, and dying here would discard them
          # before build.json is written. Only stdout is captured -- lean writes
          # its JSON messages there, and anything lake says on stderr would not
          # parse as NDJSON.
          : > attest/lake-build.ndjson
          set +e
          for m in DerivedAlgGeo DerivedAlgGeoSweep; do
            lake env lean --json "$m.lean" >> attest/lake-build.ndjson
          done
          set -e

          # RECORDED, NEVER THE GATE -- on this toolchain a build whose only
          # defect is a sorry exits 0. Captured rather than assumed, so the
          # field says what happened.
          #
          # `set +e` and not `|| true`: with `|| true` the pipeline succeeds and
          # $? is 0 no matter what lake returned, which would record a clean
          # exit for a failed build -- the field lying in the one direction that
          # matters. The step must not die here either; the artifact has to
          # exist and be honest especially when the answer is bad.
          set +e
          lake build DerivedAlgGeoSweep > attest/lake-build.log 2>&1
          LAKE_EXIT=$?
          set -e
          # 0 when lake printed no job line, which is what a fully cached
          # no-op build looks like. `minimum: 0` in the schema permits it.
          LAKE_JOBS=$(sed -n 's/.*Build completed successfully (\([0-9]*\) jobs).*/\1/p' \
                        attest/lake-build.log | tail -1)
          LAKE_JOBS=${LAKE_JOBS:-0}

          "$MFC" build --ndjson attest/lake-build.ndjson \
                       --environment attest/environment.json \
                       --emission attest/lean-emission.json \
                       --covers DerivedAlgGeo --covers DerivedAlgGeoSweep \
                       --lake-exit "$LAKE_EXIT" --lake-jobs "$LAKE_JOBS" \
                       --out attest/build.json

          # The in-toto Statement, and then the twelve rules over it. Until
          # this step existed nothing in either repository produced the file
          # `conformance` reads, so C-01..C-12 ran only inside mfc's own pytest
          # against a tree the tests assembled.
          #
          # `seal` REFUSES to omit a required predicate and refuses a dirty
          # worktree; both are why the .gitignore block landed in this commit.
          # attest/review.yaml is the one file here that is committed rather
          # than regenerated -- see the .gitignore negation. When it exists the
          # bundle carries a human-review predicate and C-10 stops reporting
          # not_run; when it does not, seal is called without it and C-10 says
          # so out loud. `--review-produced-by` is read FROM the file rather
          # than hardcoded here, so the bundle names whoever actually signed the
          # review instead of whoever wrote this workflow.
          SEAL_REVIEW=()
          if [ -f attest/review.yaml ]; then
            REVIEWER=$("$VENV_PY" -c "import yaml,sys; \
              print(yaml.safe_load(open('attest/review.yaml'))['reviews'][0]['reviewer']['name'])")
            SEAL_REVIEW=(--review attest/review.yaml
                         --review-produced-by "human:$REVIEWER")
            echo "::notice::sealing with human review by $REVIEWER"
          else
            echo "::notice::no attest/review.yaml; C-10 will report not_run (#178)"
          fi

          "$MFC" seal --root . \
                      --environment attest/environment.json \
                      --registry registry/bridgeland2007.json \
                      --declarations attest/declarations.json \
                      --build attest/build.json \
                      "${SEAL_REVIEW[@]}" \
                      --out attest/bundle.json

          # ------------------------------------------------------------------
          # restate: does the human review survive the environment it is in?
          #
          # env_digest hashes every package revision, so ONE dependency bump
          # rotates it while the mathematics sits still, and C-10 then reports
          # every review as belonging to another environment. This repository
          # learned that the hard way on 2026-08-19: mfc moved d3df3818 ->
          # 21e3b442, env_digest went 45d9e8ca -> 5b2b3d86, and the first review
          # ever recorded failed C-10 hours after it was written -- with its
          # statement digest byte-identical on both sides.
          #
          # The recovery without this is a re-read per review per bump, costed
          # at ~2h/entry. With it, `restated` carries the review forward on
          # evidence and NOTHING ELSE does: `changed` means the statement moved,
          # and `not_checkable` means nobody knows, which is not a pass either.
          #
          # The plan step exists because Lean cannot read YAML and this package
          # is forbidden dependencies -- so the reviews cross the boundary as
          # JSON. Elaboration is Lean's; reading the verdict is mfc's.
          if [ -f attest/review.yaml ]; then
            # RV-01 first, before anything reads the review. A review whose
            # reviewed_statement_pp is null passes `mfc validate`, has a
            # reviewer, a date, a verdict and three digests, and is SILENTLY
            # un-carryable: restate returns not_checkable, so C-10 fails at the
            # next dependency bump and #136's ~2h/entry comes due. Nothing about
            # it looks wrong until then.
            #
            # It runs ahead of restate-plan deliberately. Downstream the same
            # defect appears as `not_checkable`, which is also what a genuine
            # tooling failure looks like; here it appears as what it is, with
            # the entry named and the remedy in the message.
            "$MFC" check-review attest/review.yaml

            "$MFC" restate-plan --review attest/review.yaml \
                                --out attest/restate-plan.json
            # Interpreted, like the emitter: linking the executable compiles
            # every transitively imported module and none of it is cached.
            lake env lean --run exe/Restate.lean \
              --plan attest/restate-plan.json --out attest/restate.json
            "$MFC" validate attest/restate.json
            # T-01/T-02 need the review; without it they print not_run and this
            # step would assert nothing about the entries it just checked.
            "$MFC" restate-check attest/restate.json --review attest/review.yaml
            RESTATE_ARG="--restate attest/restate.json"
          else
            RESTATE_ARG=""
            echo "::notice::restate did NOT run: no attest/review.yaml"
          fi

          # C-08 alone prints not_run: no resolution.json (#134). That is NOT
          # a pass, and the summary line says so on every run. As with lint
          # above, the exact expected not_run set is asserted so it cannot
          # widen silently (2026-08-18 adversarial review, finding P2-4).
          #
          # WAS 'C-08,C-10' until 2026-08-19. C-10 now RUNS, because
          # attest/review.yaml exists (#178) and the bundle carries a
          # human-review predicate. This assertion fired on that change, which
          # is the assertion working -- it is narrowed here with the config
          # change that explains it, per its own error message, and not to make
          # a red build green.
          #
          # It must not widen back. C-10 returning to not_run would mean the
          # review stopped being sealed into the bundle -- most likely
          # review.yaml going missing, which the .gitignore negation exists to
          # prevent.
          # $RESTATE_ARG unquoted on purpose: it is empty when there is no
          # review, and "" would pass conformance an empty argument.
          # shellcheck disable=SC2086
          "$MFC" conformance --bundle attest/bundle.json \
                             --emission attest/lean-emission.json \
                             $RESTATE_ARG \
            | tee mfc-conformance-report.txt
          actual_not_run=$(grep -oE '^not_run  C-[0-9]+' mfc-conformance-report.txt \
            | awk '{print $2}' | sort | paste -sd, -)
          if [ "$actual_not_run" != "C-08" ]; then
            echo "::error::mfc conformance not_run set is '$actual_not_run'," \
                 "expected 'C-08'. A rule stopped running (or started);" \
                 "update this assertion only with the config change that" \
                 "explains it."
            exit 1
          fi

      # Step 6 of #156: the determinism assertion. Two runs over an unchanged
      # environment must be byte-identical except for `emitted_at`.
      #
      # This is the gate that makes `builds_clean` mean something a second
      # machine could reproduce, and it costs a second interpreted sweep --
      # which is why it is here, after the artifact everything else needs has
      # already been produced.
      #
      # IT NO LONGER RUNS ON EVERY EVENT, as of 2026-09-19.
      #
      # The second sweep averaged 3.84 min across six sampled `build` jobs whose
      # whole job averaged 20.7 min -- 18.6% of every run, over 3238 CI runs in
      # the month to 2026-09-19. What it tests is a property of the EMITTER, of
      # the toolchain, and of the pinned contract revision. It is not a property
      # of the topic commit under test, so re-proving it on a branch that
      # touched only DerivedAlgGeo/ re-proves it about inputs that did not move.
      #
      # The three conditions below are the three ways that property can change,
      # and between them they cover every path by which a commit reaches `main`:
      #
      #   * `refs/heads/main` -- every merge is checked, so the determinism
      #     claim attached to a main-branch attestation is always freshly
      #     measured rather than inherited from a branch run.
      #   * `merge_group` -- the last gate before `main` moves, and the one
      #     place two independently-green branches first meet.
      #   * `scope == 'all'` -- the "What changed" step sets this when the diff
      #     touches lakefile.toml, lean-toolchain, lake-manifest.json,
      #     pins.json, .github/, scripts/ or exe/. That set is a SUPERSET of
      #     this gate's determinism inputs, so any pull request that could move
      #     the needle still runs it. (This is that output's first consumer; it
      #     was computed and unread before.)
      #
      # THE RESIDUAL HOLE, named rather than papered over: a library-only pull
      # request that introduces a declaration whose own pretty-printing is
      # unstable is not caught here. It is caught in the merge queue, which is
      # the correct placement -- the queue runs before `main` moves -- but it
      # does mean the author learns about it one step later than before.
      #
      # `attest/lean-emission-2.json` is written and read by this step alone, so
      # skipping it leaves nothing downstream short of an input.
      - name: Emitter reproducibility
        id: emitter_reproducibility
        continue-on-error: true
        # The `steps.emit` clause is new and is not part of the gating rule
        # above it: it reads the same artifact `Contract gates` does.
        if: >-
          steps.emit.outcome == 'success'
          && (github.ref == 'refs/heads/main'
          || github.event_name == 'merge_group'
          || steps.changed.outputs.scope == 'all')
        run: |
          set -euo pipefail
          lake env lean --run exe/Emit.lean --out attest/lean-emission-2.json
          python3 - <<'PY'
          import json
          a = json.load(open("attest/lean-emission.json", encoding="utf-8"))
          b = json.load(open("attest/lean-emission-2.json", encoding="utf-8"))
          # `emitted_at` is the ONLY field permitted to differ, and it is named
          # rather than filtered by pattern: a second volatile field appearing
          # later must fail here, loudly, instead of being absorbed.
          a.pop("emitted_at"); b.pop("emitted_at")
          if a != b:
              differing = sorted(k for k in set(a) | set(b) if a.get(k) != b.get(k))
              raise SystemExit(f"::error::emitter is not deterministic; fields differ: {differing}")
          print("ok: two sweeps byte-identical modulo emitted_at")
          PY

      # ---------------------------------------------------------------------
      # EVERY GATE REPORTS. This step is what makes the job fail, not the gates.
      #
      # `set -e` inside a 30-step job means the FIRST red gate ends the run and
      # every gate behind it reports `skipped`. That is not a smaller signal, it
      # is a misleading one: a pull request can look like it has one problem and
      # have four. Measured on this repository the night of 2026-09-19:
      # `Audit completeness` went red at #1416 and stayed red, and behind it
      # `Environment linters` accumulated ten violations from #1421 that nobody
      # could see until the audit was repaired. Two regressions merged under the
      # shadow of one, on a tree where every branch inherits `main`.
      #
      # So the gates now carry `continue-on-error: true`, which does NOT mean
      # they stopped mattering: it means their verdict is recorded rather than
      # thrown, and this step turns the whole set into one exit code. A gate's
      # own annotation still appears on its own step in the UI.
      #
      # `outcome`, not `conclusion`. `continue-on-error` rewrites `conclusion`
      # to `success` for exactly these steps -- reading it here would make this
      # check pass on every failure, which is the trap this pattern comes with.
      #
      # SKIPPED IS REPORTED, NOT FAILED, and the distinction is narrow on
      # purpose. Only `Contract gates` and `Emitter reproducibility` can skip,
      # and only when `emit` failed or when the reproducibility rule excludes
      # this event -- in the first case `emit` itself is already `failure` and
      # this step fails on it, in the second the gate was never owed. A gate
      # that skips for any other reason would be a hole, so the list below
      # prints the skips rather than passing over them.
      #
      # The build step ITSELF stays fail-fast. A library that did not compile
      # makes every gate after it meaningless, and running twenty checks to say
      # so twenty times is noise, not coverage.
      - name: Every gate passed
        if: always() && steps.checkout.outcome == 'success'
        env:
          RESULTS: |
            pin=${{ steps.pin.outcome }}
            ag_axiom_audit=${{ steps.ag_axiom_audit.outcome }}
            stability_axiom_audit=${{ steps.stability_axiom_audit.outcome }}
            dg_axiom_audit=${{ steps.dg_axiom_audit.outcome }}
            audit_completeness=${{ steps.audit_completeness.outcome }}
            single_instantiation=${{ steps.single_instantiation.outcome }}
            environment_linters=${{ steps.environment_linters.outcome }}
            warning_ratchet=${{ steps.warning_ratchet.outcome }}
            console_encoding=${{ steps.console_encoding.outcome }}
            style_fixtures=${{ steps.style_fixtures.outcome }}
            style_ratchet=${{ steps.style_ratchet.outcome }}
            source_independence=${{ steps.source_independence.outcome }}
            subject_layering=${{ steps.subject_layering.outcome }}
            neutral_stability_imports=${{ steps.neutral_stability_imports.outcome }}
            umbrella_coverage=${{ steps.umbrella_coverage.outcome }}
            root_reachability=${{ steps.root_reachability.outcome }}
            coherent_families=${{ steps.coherent_families.outcome }}
            numerical_data=${{ steps.numerical_data.outcome }}
            sorry_gate=${{ steps.sorry_gate.outcome }}
            emit=${{ steps.emit.outcome }}
            contract_gates=${{ steps.contract_gates.outcome }}
            emitter_reproducibility=${{ steps.emitter_reproducibility.outcome }}
        run: |
          set -euo pipefail
          failed=""
          skipped=""
          while IFS= read -r line; do
            [ -n "$line" ] || continue
            name="${line%%=*}"
            outcome="${line#*=}"
            case "$outcome" in
              success) ;;
              skipped) skipped="$skipped $name" ;;
              "")      failed="$failed $name(no-outcome)" ;;
              *)       failed="$failed $name($outcome)" ;;
            esac
          done <<< "$RESULTS"
          if [ -n "$skipped" ]; then
            echo "::notice::gates skipped:$skipped"
          fi
          if [ -n "$failed" ]; then
            echo "::error::gate(s) failed:$failed"
            echo
            echo "Each failure is annotated on its own step above. They ran"
            echo "independently, so this list is the whole picture rather than"
            echo "the first problem encountered."
            exit 1
          fi
          echo "all gates passed"

      - name: Upload trust artifacts
        # `always()` alone attached a PREVIOUS run's attest/ from the
        # persistent self-hosted workspace whenever checkout itself failed
        # before cleaning -- the observed HTTP-429-before-checkout mode -- and
        # the fixed artifact name let that stale bundle masquerade as this
        # run's (2026-08-18 adversarial review, P2-6). Gating on checkout and
        # naming the artifact by commit closes both halves; the two audit
        # filenames below were also stale since the #614 renames (P3-3).
        if: always() && steps.checkout.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: trust-artifacts-${{ github.sha }}
          path: |
            attest/lean-emission.json
            attest/environment.json
            attest/declarations.json
            attest/build.json
            attest/bundle.json
            attest/restate.json
            algebraic-geometry-audit.txt
            stability-condition-audit.txt
            dg-audit.txt
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # The roadmap-vs-tracker gate (#620), in its own job since #1392.
  #
  # ubuntu-latest UNCONDITIONALLY, unlike `build`. That job's routing invariant
  # permits self-hosted only on `push`/`workflow_dispatch`; this one has no
  # reason to want a warm `.lake`, so it never goes near the question.
  roadmap:
    runs-on: ubuntu-latest
    # Seconds of work. The cap is here so a hung `gh` call cannot hold the
    # merge open for the default six hours.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # `--scope-to-diff=origin/main` resolves a merge base, so the
          # default single-commit checkout will not do.
          fetch-depth: 0

      - name: Roadmap and tracker agree
        env:
          # For scripts/check_roadmap.py's `gh` calls. Read-only issue
          # metadata; the default token's scope is sufficient.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The interpreter is CHOSEN, not inherited -- the rule `build`
          # learned the expensive way. The roadmap checker and loop controller
          # have declared dependencies, so this isolated venv installs their
          # requirements rather than borrowing whatever the image ships.
          #
          # Do not "simplify" this to a bare `python3 scripts/...` on the
          # strength of the hosted image having PyYAML today. That is the
          # inherited interpreter again, and it fails on the image bump
          # rather than on the change that made the assumption.
          python3 -m venv .roadmap-venv
          VENV_PY=.roadmap-venv/bin/python
          "$VENV_PY" -m pip install --quiet --disable-pip-version-check -r scripts/requirements-loop.txt
          "$VENV_PY" -c 'import sys, yaml; from importlib.metadata import version; print("repository Python tools: python", sys.version.split()[0], "/ PyYAML", yaml.__version__, "/ markdown-it-py", version("markdown-it-py"))'
          "$VENV_PY" -m unittest discover -s scripts/tests -p "test_*.py"

          # `--require-api` is deliberate. Without `gh` the script prints
          # NOT_RUN and exits 0, so a contributor with no `gh` is not blocked
          # from running the offline gates -- but CI is the one environment
          # guaranteed to have the API, and a check that silently skips there
          # is the vacuous pass this repository keeps finding in new places.
          # RM-07 is the one rule here that judges a file in the branch
          # against LIVE tracker state, so any merge that closes an issue and
          # advances its entry on `main` turns every branch that forked earlier
          # red -- on an entry that branch never touched. On 2026-09-12 that
          # was 15 of 18 open pull requests at once.
          #
          # On a pull request, scope RM-07 to the entries the branch actually
          # changed since it forked. Inherited disagreements still PRINT, as
          # notes; they are `main`'s to fix and the line below judges them in
          # full on every push to `main` and every merge queue entry. This
          # moves where a finding is reported, not whether it is.
          #
          # The flag is passed ONLY for `pull_request`. Do not "simplify" this
          # to pass it unconditionally: on `main` and in the merge queue the
          # merge base is the thing being judged, so scoping there would judge
          # nothing and pass vacuously.
          #
          # `--pr` is passed for the opposite reason. Scoping stops OTHER
          # people's staleness reddening this branch; RM-08 stops THIS branch
          # creating staleness for everyone else, by refusing a pull request
          # that closes an issue without advancing its entry. RM-07 cannot do
          # that job: while the pull request is open the issue it closes is
          # still open, so RM-07 agrees with the tracker right up until the
          # merge makes it disagree.
          #
          # BOTH flags key on "is there an open pull request for this ref",
          # which is NOT the same question as "is this the pull_request
          # event". `push` fired on `main` AND on `agent/**` when this was
          # written, and those two were different cases:
          #
          #   * on `main` and in the merge queue there really is no pull
          #     request to ask about, the merge base is the thing being
          #     judged, and RM-07 unscoped is the backstop it has always been;
          #   * on a push to an agent branch there usually IS one, and leaving
          #     the flags off there is a RACE rather than a stricter check.
          #     RM-08 requires the closing pull request to advance its entry,
          #     so the entry reads `done` while the issue it closes is still
          #     open, and the push-lane run then fails for exactly as long as
          #     the pull request stays open. Whether it is red or green
          #     depends only on whether this step happens to run before or
          #     after the merge. #1338 went green on that lane purely because
          #     its build took long enough for the merge to land first, and
          #     #1341 went red on the same commit that passed as a pull
          #     request. A check whose verdict is decided by a stopwatch is
          #     not checking anything.
          #
          # Since 2026-09-19 the second case can no longer arise from a push:
          # `push` fires on `main` alone, so the stopwatch race described above
          # is structurally gone rather than merely handled. The lookup below is
          # KEPT anyway. It is what makes the `pull_request` lane -- now the only
          # lane an agent branch has -- scope correctly, and a `workflow_dispatch`
          # on a branch still reaches the `push`-shaped path with no event
          # payload to infer from.
          #
          # So ASK for the number instead of inferring it from the event. If
          # the lookup finds nothing -- no pull request, or no `gh` -- PR_NUM
          # stays empty and the unscoped invocation runs, which is the strict
          # direction and the pre-existing behaviour.
          PR_NUM=""
          case "${GITHUB_EVENT_NAME}" in
            pull_request)
              PR_NUM="${{ github.event.pull_request.number }}"
              ;;
            push)
              if [ "${GITHUB_REF_NAME}" != "main" ]; then
                PR_NUM="$(gh pr list --head "${GITHUB_REF_NAME}" \
                  --state open --json number --jq '.[].number' \
                  2>/dev/null | head -1 || true)"
              fi
              ;;
          esac
          if [ -n "$PR_NUM" ]; then
            # merge-base needs the base branch present. The checkout above is
            # fetch-depth: 0, which fetches all history, but not necessarily a
            # remote-tracking ref for `main` -- fetch it by name. If this
            # fails, the script resolves no base and judges everything, which
            # is the safe direction.
            git fetch --no-tags --depth=0 origin main >/dev/null 2>&1 || true
            echo "roadmap: scoping RM-07 to pull request #${PR_NUM}"
            "$VENV_PY" scripts/check_roadmap.py --require-api \
              --scope-to-diff=origin/main \
              --pr="${PR_NUM}"
          else
            echo "roadmap: no open pull request for this ref; judging every entry"
            "$VENV_PY" scripts/check_roadmap.py --require-api
          fi

  # ---------------------------------------------------------------------------
  # The single required status check (2026-08-15).
  #
  # Branch protection can only require a check by NAME, and a rule that names a
  # check nothing produces does not fail -- it waits, or is bypassed. So the
  # moment `build` is split into several jobs, a rule requiring `build` silently
  # stops protecting anything. This job exists so the required check is a name
  # that survives every future change to the job graph: split `build` in two,
  # add a job, rename one, and the only edit needed is the `needs` list here.
  #
  # It must therefore be the ONLY required context, and `build` must be removed
  # from the required list when this lands -- otherwise the split it was added
  # to survive still breaks protection.
  #
  # Only jobs that must pass belong in `needs`. Cache warming is a separate
  # workflow (.github/workflows/cache-warm.yml) precisely so it cannot appear
  # here: it is skipped on every event except a push to `main`, a skip has to
  # read as a failure below, and it gates nothing by design -- `build` on the
  # same commit makes the correctness claim.
  ci:
    needs: [build, roadmap]
    # This job must still run when `build` FAILED -- without that, a failed
    # build would leave `ci` skipped, and a skipped required check does not
    # block a merge. That is the whole mechanism, and it is why the obvious
    # default (no `if:` at all, which skips on any upstream failure) is wrong.
    #
    # But it must NOT run when the whole RUN was cancelled, which is what
    # `always()` did here until 2026-09-12. The concurrency block above sets
    # `cancel-in-progress` on branch lanes, so pushing twice in a minute --
    # the normal agent-lane cadence -- cancels the first run. Under `always()`
    # that dead run still executed this job, saw `RESULTS: cancelled`, and
    # posted a FAILING `ci` check: a green build sat behind a red `ci`
    # belonging to a run that had been killed on purpose. PRs #1242 and #1243
    # were both stuck this way.
    #
    # THIS PARAGRAPH USED TO EXPLAIN THAT WITH "branch protection reads the
    # newest" check of a given name, and that is WRONG. Measured on #1409,
    # 2026-09-19, on one commit carrying two `ci` check runs:
    #
    #     ci  FAILURE  22:46:52   push lane, died in 24s installing elan
    #     ci  SUCCESS  22:58:34   pull_request lane, 14m44s, every gate
    #     statusCheckRollup.state = FAILURE, mergeStateStatus = BLOCKED
    #
    # The rollup aggregates EVERY check run on the commit. One red blocks
    # however old it is and however green a newer run of the same name is, and
    # the branch was up to date with zero required reviews, so nothing else
    # explains it. The pull request had to be merged with an admin bypass.
    #
    # The correction makes the `!cancelled()` reasoning STRONGER, not weaker: a
    # cancelled run's red `ci` does not merely win a race against a later
    # green, it blocks unconditionally until something overwrites that specific
    # check run. Ordering never mattered.
    #
    # It also means a red check from ANY lane is a hard block, which is half
    # the argument for `push` firing on `main` alone -- see the `on:` block.
    # A 24-second infrastructure fault on a self-hosted runner could otherwise
    # hold a pull request whose real verification had already passed, and the
    # only ways out are a 40-minute rebuild or an admin merge.
    #
    # `!cancelled()` keeps the mechanism and drops the artifact: a FAILED
    # upstream is not a cancelled run, so this still runs and still fails on
    # it; an individually cancelled `build` inside a live run also still
    # reaches the enumeration below and fails there.
    #
    # THE TRADE-OFF, stated rather than hidden: when a run is cancelled this
    # job is SKIPPED, and a skipped required check does not block. That is
    # correct for the concurrency case, because a superseding run is by
    # definition already posting its own `ci`. It is a real if small loss for
    # a run cancelled BY HAND with nothing following it -- that leaves `ci`
    # skipped rather than red. Do not "fix" that by letting this job run and
    # PASS on a cancelled run: a green `ci` over a build that never finished
    # is the vacuous pass this repository keeps finding in new places, and it
    # is strictly worse than a skip.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Every required job succeeded
        # Through `env`, not interpolated into the script. Two reasons, and the
        # second one is why the first attempt at this file was rejected outright:
        # workflow expressions may only quote strings with SINGLE quotes, so the
        # obvious `join(needs.*.result, " ")` is a syntax error -- and GitHub
        # answers an invalid workflow by failing a run named after the file with
        # no annotation and no checks at all, which reads exactly like CI never
        # triggered. Keeping expressions out of the script body sidesteps the
        # nested-quoting that caused it, and is the standard way to avoid script
        # injection from expression output besides.
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          # Enumerate rather than pattern-match. `contains(needs.*.result,
          # 'failure')` is the common form and it is wrong by omission: it
          # passes a cancelled job, and it passes a SKIPPED one. A job that
          # never ran has not proved anything, so anything other than `success`
          # fails here.
          echo "upstream results: ${RESULTS}"
          rc=0
          for r in ${RESULTS}; do
            if [ "$r" != "success" ]; then
              echo "::error::a required job did not succeed (result: ${r})"
              rc=1
            fi
          done
          exit "$rc"
