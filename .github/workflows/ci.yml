name: Ubuntu runner migration smoke
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: chris-ubuntu-main-runner
            slot: main
          - runner: chris-ubuntu-runner-1
            slot: general-1
          - runner: chris-ubuntu-runner-2
            slot: general-2
          - runner: chris-ubuntu-runner-3
            slot: general-3
    runs-on: [self-hosted, Linux, X64, '${{ matrix.runner }}']
    timeout-minutes: 5
    steps:
      - name: Verify host and isolated runtime
        shell: bash
        env:
          EXPECTED_RUNNER: ${{ matrix.runner }}
          EXPECTED_SLOT: ${{ matrix.slot }}
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = "$EXPECTED_RUNNER"
          test "$RUNNER_OS" = Linux
          root="/home/chris-dare/.local/share/github-runners/$EXPECTED_SLOT"
          test "$HOME" = "$root/home"
          test "$ELAN_HOME" = "$root/home/.elan"
          test "$XDG_CACHE_HOME" = "$root/cache"
          test "$TMPDIR" = "$root/tmp"
          test "$LEAN_NUM_THREADS" = 3
          case "$RUNNER_WORKSPACE" in "$root/_work/"*) ;; *) exit 1 ;; esac
          test ! -e "$HOME/.config/gh/hosts.yml"
          git --version
          python3 --version
          python3 - <<'PY'
          import os,pathlib
          cg=pathlib.Path('/sys/fs/cgroup')/pathlib.Path('/proc/self/cgroup').read_text().strip().split('::',1)[1].lstrip('/')
          assert (cg/'memory.max').read_text().strip()==str(12*1024**3)
          quota,period=map(int,(cg/'cpu.max').read_text().split())
          assert quota==3*period
          parent=cg.parent
          assert (parent/'memory.max').read_text().strip()==str(48*1024**3)
          probe=pathlib.Path(os.environ['TMPDIR'])/'migration-smoke.txt'
          probe.write_text(os.environ['RUNNER_NAME']);assert probe.read_text()==os.environ['RUNNER_NAME'];probe.unlink()
          print('Runner identity, isolated paths, CPU and memory limits verified.')
          PY
