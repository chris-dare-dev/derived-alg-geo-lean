name: CI

on:
  # `push` runs on `main` alone. Every branch change arrives as a pull request,
  # and the `pull_request` lane already builds it on hosted Ubuntu, so a branch
  # push would build the same commit twice. A branch pushed with no pull request
  # open gets no CI: open the pull request, or dispatch this workflow by hand.
  push:
    branches: [main]
  pull_request:
  # A merge queue entry is a synthetic branch GitHub builds from `main` plus the
  # queued PR(s), and it reports its own checks. Without this trigger the queue
  # would sit forever waiting for a check that never runs, so this line and the
  # "Require merge queue" setting have to be turned on in that order: this first,
  # the setting second. Removing it later re-creates the same deadlock.
  merge_group:
  workflow_dispatch:

concurrency:
  # Keyed on github.ref. For a `pull_request` event that is `refs/pull/N/merge`,
  # which is stable across pushes to the same pull request, so a new push
  # cancels the run it supersedes. (Collapsing branch and pull-request runs into
  # one key would take github.head_ref || github.ref_name, not
  # github.event.pull_request .head.ref, which lacks the `refs/heads/` prefix.)
  #
  # `main` and the merge queue are EXEMPT from cancellation, AND `main` is keyed
  # per commit, because cancellation is only half of what evicts a run.
  # `cancel-in-progress: false` protects a run that has already STARTED. It does
  # nothing for a run that is still QUEUED: GitHub keeps at most one PENDING run
  # per concurrency group, so with a shared key the next merge evicts the
  # waiting one no matter what this flag says. At any real merge rate the
  # surviving `main` run is then always a queued one, never a finished one, and
  # the README badge, which draws `cancelled` as a failure, reads failing while
  # every gate passes.
  #
  # Keying `main` by `github.sha` gives every commit its own group, so main runs
  # never evict each other and each merge is actually verified, at the cost of
  # one full build per merge. If that cost bites, reduce the merge rate or add a
  # runner; do not restore the shared key and expect the badge to mean anything.
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.ref == 'refs/heads/main' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: >-
    ${{ github.ref != 'refs/heads/main' && github.event_name != 'merge_group' }}

jobs:
  # Decides whether a change needs the Lean build, and judges it here when it
  # does not. Also judges, on every change, that each file lies in an area
  # CREDO.md lists.
  #
  # FAIL-OPEN, like "What changed" in `build`: `build=false` is written only
  # once this job has positively established that every changed path is prose.
  # No usable diff base, an empty diff, a merge-queue entry, a manual dispatch
  # or one path outside the list all leave `build=true`.
  #
  # The prose list is the set of paths that no step in `build` reads.
  # `scripts/`, `.github/`,
  # `registry/`, `attest/` and every Lean file stay out of it on purpose.
  # cache-warm.yml ignores the same paths; change the two together.
  changes:
    runs-on: ${{ vars.OWNER_CI_RUNS_ON && fromJSON(vars.OWNER_CI_RUNS_ON) || 'ubuntu-latest' }}
    timeout-minutes: 10
    outputs:
      build: ${{ steps.classify.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The classifier diffs from a merge base.
          fetch-depth: 0
          # Keeps `.lake` on the self-hosted lane; see checkout in `build`.
          clean: false

      - name: Does this change need the Lean build
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          prose='^(docs/.*|([^/]+|\.claude/.*)\.md)$'
          base=""
          case "$EVENT_NAME" in
            pull_request) base="$PR_BASE" ;;
            push) base="$PUSH_BEFORE" ;;
          esac
          build=true
          if [ -n "$base" ] && [ "$base" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "$base^{commit}" 2>/dev/null; then
            # --no-renames: a Lean file renamed to a prose path must still
            # show its old name.
            files=$(git diff --no-renames --name-only "$base...HEAD") || files=""
            printf '%s\n' "$files" | sed 's/^/  /'
            # grep -v exits 1 only when it selected nothing, that is, when no
            # path fell outside the list. Read its status, not its output: an
            # error (2) must not look like "all prose". No pipe into grep -q
            # either, since under pipefail an early exit there reads as a miss.
            rc=0
            grep -vE "$prose" <<<"$files" >/dev/null || rc=$?
            if [ -n "$files" ] && [ "$rc" -eq 1 ]; then
              build=false
            fi
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "build=$build"

      - name: Every file lies in a CREDO area
        env:
          AREAS_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: python3 scripts/check_tree_areas.py "$AREAS_BASE"

  build:
    needs: changes
    # Skipped only on the classifier's positive `false`. An empty output runs
    # the build.
    if: ${{ needs.changes.outputs.build != 'false' }}
    # Every event in this public repository uses hosted Ubuntu. The owner's
    # self-hosted runners are registered ONLY to the private mirror
    # chris-dare-dev/derived-alg-geo-lean-ci, which sets the repository variable
    # OWNER_CI_RUNS_ON to a JSON label list such as ["self-hosted","owner-ci"].
    # This repository leaves it unset, and so does every fork, so the expression
    # falls back to ubuntu-latest. A fork pull request reads the BASE
    # repository's variables, so it falls back too.
    #
    # The expression is NOT the trust boundary: a pull request can edit its own
    # copy of this file, `runs-on` included. The boundary is that no runner is
    # registered here, so a pull request that asks for `self-hosted` gets no
    # runner and stays queued. Keep the registration count at zero.
    runs-on: ${{ vars.OWNER_CI_RUNS_ON && fromJSON(vars.OWNER_CI_RUNS_ON) || 'ubuntu-latest' }}
    # Keyed on the same variable, with the same fallback: 90 minutes here and in
    # every fork, 180 on the owner's runners in the mirror, where a cold build
    # (after a Mathlib bump, say) does not fit in 90.
    timeout-minutes: ${{ vars.OWNER_CI_RUNS_ON && 180 || 90 }}

    defaults:
      run:
        shell: bash
    steps:
      # Four services share 16 logical CPUs. Three Lean processes per job
      # reserve nominal CPU headroom for the desktop; systemd also bounds
      # aggregate CPU and memory. Hosted jobs retain their normal defaults.
      - name: Cap Lake's concurrency on the self-hosted lane
        env:
          LANE: ${{ runner.environment }}
        run: |
          set -euo pipefail
          echo "runner.environment=${LANE:-<empty>}"
          if [ "${LANE:-}" = "self-hosted" ]; then
            echo "LEAN_NUM_THREADS=3" >> "$GITHUB_ENV"
            echo "capped Lake at 3 concurrent lean processes for the rest of this job"
          else
            echo "hosted runner: leaving LEAN_NUM_THREADS at its default"
          fi

      - uses: actions/checkout@v4
        id: checkout
        with:
          # A diff base is needed by "What changed" below. On the self-hosted
          # lane the repository is already present, so this costs a fetch, not a
          # clone.
          fetch-depth: 0
          # `clean: false` keeps `.lake` on the self-hosted lane, which is that
          # lane's reason to exist. checkout defaults to clean: true, which runs
          # `git clean -ffdx`; the -x removes ignored files, `.lake` among them,
          # so every run would re-clone Mathlib, re-fetch its cache and rebuild
          # from nothing. The next step does the rest of what clean would have
          # done.
          clean: false

      # Exactly what checkout's clean: true would have done, minus `.lake`.
      #
      # `clean: false` ALONE IS NOT SAFE HERE and this step is not optional
      # tidiness. Two things break without it:
      #
      #   * Untracked leftovers survive between runs, and `mfc build`/`seal`
      #     refuse to attest a dirty worktree -- "the worktree has uncommitted
      #     changes, so these measurements describe bytes that <sha> does not
      #     contain". `mfc-lint-report.txt` is written by the Contract gates
      #     step and is NOT gitignored, so it alone would fail every second run.
      #   * checkout's clean also does `git reset --hard`; skipping it would let
      #     a modified tracked file survive from a previous branch.
      #
      # Keeping `.lake` also keeps orphaned artifacts; the "Prune orphaned build
      # artifacts" step below removes them.
      - name: Reset the tree, keeping .lake
        run: |
          set -euo pipefail
          git reset --hard
          git clean -ffdx -e .lake
          echo "kept: $(du -sh .lake 2>/dev/null | cut -f1 || echo 'no .lake yet')"

      # Path scoping: each linter pass is gated on the tree it judges.
      #
      # FAIL-OPEN BY DESIGN: if the diff base cannot be resolved, or if anything
      # structural changed, `scope` is `all` and every gate runs. A gate is
      # skipped only when this step has positively established that no file it
      # could possibly judge has changed. Never invert that default -- a gate
      # that silently does not run is worse than a slow one.
      - name: What changed
        id: changed
        run: |
          set -euo pipefail
          base=""
          case "${{ github.event_name }}" in
            pull_request) base="${{ github.event.pull_request.base.sha }}" ;;
            push) base="${{ github.event.before }}" ;;
            # merge_group is deliberately absent. `github.event.merge_group.base_sha`
            # exists and would let this step scope a queue entry too -- and it
            # should not. The queue is the last thing that runs before `main`
            # moves, and it is the one place where two independently-green
            # branches meet for the first time; scoping there would reintroduce
            # exactly the hole the queue was added to close. Falling through
            # leaves `base` empty, which the check below turns into `scope=all`.
          esac
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "scope=all" >> "$GITHUB_OUTPUT"
            echo "no usable diff base -- running every gate"
            exit 0
          fi
          # Three-dot: diff from the MERGE BASE, so commits that landed on the
          # base branch after this one forked are not counted as ours.
          files=$(git diff --name-only "$base...HEAD")
          echo "$files" | sed 's/^/  /'
          if printf '%s\n' "$files" | grep -qE '^(lakefile\.toml|lean-toolchain|lake-manifest\.json|\.github/|scripts/|exe/)'; then
            echo "scope=all" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "scope=partial" >> "$GITHUB_OUTPUT"
          if printf '%s\n' "$files" | grep -qE '^DerivedAlgGeo(/|\.lean$)'; then
            echo "library=true" >> "$GITHUB_OUTPUT"
          else
            echo "library=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Foundation import boundary
        run: python3 scripts/check_foundation_import_boundary.py

      # Build-output cache. The self-hosted runners keep `.lake` between runs; a
      # hosted job starts cold, and `.lake/build` is the part worth restoring.
      #
      # Only `.lake/build` is cached. Mathlib's build, several GB, must never go
      # in here: GitHub's per-repository cache budget is 10 GB total, so one
      # such entry would evict everything else on write. `lean-action`'s
      # use-mathlib-cache already fetches Mathlib's oleans from the Lean
      # community cache, which is the right source for them.
      #
      # THE PLATFORM SEGMENT IS A LITERAL, NOT `runner.os`. The writer and every
      # reader must agree on the key, and an `.lake/build` from another platform
      # is unusable here anyway, so the key states the platform the cache is FOR
      # and a runner of that platform writes it: the `Cache warm` workflow, in
      # .github/workflows/cache-warm.yml.
      #
      # Restore is keyed exactly, then falls back by prefix to the newest cache
      # for the same toolchain and manifest -- in practice the one `Cache warm`
      # saved on `main`, found via GitHub's default-branch fallback. A stale
      # restore is safe for the build: lake's build is trace-hash based, so
      # anything out of date is rebuilt. The next step covers what it is not
      # safe for.
      - name: Restore build output
        if: runner.os == 'Linux'
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: lake-build-linux-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-build-linux-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-

      # Orphaned artifacts, and why a stale restore is NOT merely slow.
      #
      # lake's traces rebuild anything out of date, but lake never deletes the
      # artifacts of a source that is gone, so a `.lake/build` restored from
      # `main`, or kept on a self-hosted runner, holds `.ilean` files for
      # modules this branch does not have. `mfc check-ilean-coverage` reads
      # exactly those files, so it reports them as "built by lake, absent from
      # the emission" and fails I-03/I-04 -- a red run caused by the cache
      # rather than by the diff.
      #
      # Deleting `.lake/build` outright would fix it and throw away the cache.
      # So prune the orphans instead -- an artifact whose `.lean` no longer
      # exists cannot be wanted by anything, and if this is ever wrong the
      # effect is a rebuild, not a wrong answer.
      #
      # Scoped to `DerivedAlgGeo/`, where the artifact path maps to the source
      # path directly. The `exe/` libraries' `.ilean` files come from their own
      # srcDir, so a root-relative existence test would prune them wrongly; they
      # are left alone. Runs on both lanes: a persistent `.lake` accumulates
      # orphans the same way a restored one does.
      - name: Prune orphaned build artifacts
        run: |
          set -euo pipefail
          root=.lake/build/lib/lean/DerivedAlgGeo
          if [ ! -d "$root" ]; then
            echo "no build output yet; nothing to prune"
            exit 0
          fi
          pruned=0
          while IFS= read -r -d '' art; do
            src="DerivedAlgGeo/${art#"$root"/}"
            src="${src%.ilean}.lean"
            if [ ! -f "$src" ]; then
              rm -f "$art" "${art%.ilean}.olean"
              pruned=$((pruned + 1))
            fi
          done < <(find "$root" -name '*.ilean' -print0)
          echo "pruned $pruned orphaned artifact pair(s)"

      # use-github-cache is OFF. Left at its default it writes all of `.lake`,
      # several GB per entry, under keys no later job reads: a self-hosted
      # runner already keeps its own `.lake`, and a `pull_request` entry is
      # scoped to `refs/pull/N/merge`, readable only by re-runs of that same
      # pull request. Each such write LRU-evicts something useful from the 10 GB
      # budget, the `.lake/build` entry above included. `use-mathlib-cache`
      # stays on: Mathlib's oleans come from the Lean community cache at no
      # repository cost.
      #
      # Pinned to a commit, not to `v1`. `v1` is a MOVING tag -- the maintainers
      # repoint it -- so `@v1` would let the build change with nothing in the
      # diff to explain it.
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1
        with:
          build: true
          use-mathlib-cache: true
          use-github-cache: false
          # nanoda is off because it cannot run at this toolchain. lean-action's
          # run_nanoda.sh detects the module name with `grep -A5 '^\[package\]'
          # lakefile.toml`, and Lake REJECTS the `[package]` table that grep
          # wants; past that, lean4export master emits NDJSON 3.1.0 while nanoda
          # 0.3.2 expects the older space-separated format.
          nanoda: false
          # ...and this line is load-bearing even though nanoda is off.
          #
          # `nanoda-allow-sorry` DEFAULTS TO "true" (see the action's
          # action.yml). So turning `nanoda: true` on without this line would
          # add a checker that PASSES ON SORRY-BACKED PROOFS, in a repository
          # that forbids `sorry` outright.
          nanoda-allow-sorry: false

      - name: Pin and coverage records
        id: pin
        continue-on-error: true
        env:
          # For check_pin.py's reachability test: it asks whether each
          # bare-commit pin is on its own repository's default branch, which is
          # the one question this repo cannot answer from its own tree.
          # Read-only repository metadata; the default token's scope is enough.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # `--require-api` because this is the environment guaranteed to have
          # the API. Locally the same check degrades to NOT_RUN so a contributor
          # without `gh` is not blocked; here a check that could not look must
          # not pass.
          python3 scripts/check_pin.py --require-api
          # Every coverage record, by glob rather than a hand-kept list, so a
          # new record cannot land unvalidated.
          for f in registry/coverage-*.json; do
            python3 scripts/check_coverage_map.py "$f"
          done

      - name: Single instantiation
        id: single_instantiation
        continue-on-error: true
        run: |
          set -euo pipefail
          # The single-instantiation check: a generic abstraction written for N
          # cases, instantiated once, and never adopted. It reuses the build the
          # step above already did, and it runs here because a check that runs
          # only locally drifts unseen.
          lake env lean scripts/EnumInhabitants.lean > enum-inhabitants.txt 2>&1 || {
            echo "::error::scripts/EnumInhabitants.lean failed to elaborate"
            cat enum-inhabitants.txt
            exit 1
          }
          python3 scripts/check_single_instantiation.py enum-inhabitants.txt

      - name: Environment linters
        id: environment_linters
        continue-on-error: true
        run: |
          set -euo pipefail
          # The pre-existing backlog is enumerated per declaration in
          # scripts/nolints.json, so this gate rejects anything NEW while the
          # known violations stay visible and countable. Never silence a failure
          # with `runLinter --update`: that rewrites the whole file from the
          # current run and would bless the new violation along with everything
          # else. Fix the declaration, or argue for the exception.
          #
          # check_nolints.py is NOT scoped: it reads the checked-in file, it is
          # cheap, and it is the half of this gate that catches a stale entry.
          lake exe runLinter DerivedAlgGeo
          python3 scripts/check_nolints.py
          # Style is per-file and cheap; it always runs.
          lake exe lint-style

      - name: Compiler warning ratchet
        id: warning_ratchet
        continue-on-error: true
        run: |
          set -euo pipefail
          # scripts/check_warnings.py holds deprecations at zero in code we own
          # and lets the other warnings Lean emits shrink but never grow, the
          # same ratchet shape as scripts/nolints.json above. Ungated, a Mathlib
          # deprecation with a real deadline looks exactly like a `simpa` nag.
          #
          # The library is already built by now, so this re-invocation compiles
          # nothing: Lake replays the cached modules and reprints their
          # warnings, which is why the raw count in a full log is several times
          # the real one. If that ever stops being true the capture comes back
          # empty, and the script fails rather than passing vacuously on a
          # silent log.
          lake build DerivedAlgGeo 2>&1 | tee lean-warnings.log
          python3 scripts/check_warnings.py lean-warnings.log

      - name: Gate console encoding
        id: console_encoding
        continue-on-error: true
        # Every gate prints declaration names, and on a console that cannot
        # encode `δ` a gate dies with a `charmap` traceback instead of its
        # finding. Checks that each script routes its console through
        # scripts/_output.py, and reproduces the crash to prove the helper
        # prevents it.
        run: python3 scripts/_output.py

      - name: Mathlib-style known-answer fixtures
        id: style_fixtures
        continue-on-error: true
        # scripts/check_mathlib_style.py itself runs from the edit hook and from
        # scripts/gates.sh, never here -- it judges a branch's own lines, which
        # CI has no use for. Its fixtures are a different question: they are
        # what says the checker still rejects what it is meant to reject.
        run: python3 scripts/check_mathlib_style.py --self-test

      - name: Emitter source reachability and eligibility
        id: emission_sources
        continue-on-error: true
        run: python3 scripts/check_emission_coverage.py --source-only

      - name: Mathlib-style baseline ratchet
        id: style_ratchet
        continue-on-error: true
        # The other half of the same checker. `--self-test` says it still
        # rejects what it is meant to reject; this says the library has not
        # grown a new ERROR outside scripts/style-baseline.json. The edit hook
        # is the primary enforcement and cannot be relied on alone -- it only
        # sees files an agent edits, and a human commit never passes through it.
        run: python3 scripts/check_mathlib_style.py --check-baseline

      - name: Stability source independence
        id: source_independence
        continue-on-error: true
        run: python3 scripts/check_source_independence.py

      - name: Subject ownership layering
        id: subject_layering
        continue-on-error: true
        run: python3 scripts/check_layering.py

      - name: Neutral derived-category Stability import closure
        id: neutral_stability_imports
        continue-on-error: true
        run: python3 scripts/check_neutral_stability_imports.py

      - name: Umbrella coverage
        id: umbrella_coverage
        continue-on-error: true
        run: python3 scripts/check_umbrella_coverage.py

      - name: Root reachability
        id: root_reachability
        continue-on-error: true
        run: python3 scripts/check_root_reachability.py

      - name: Coherent families architecture
        id: coherent_families
        continue-on-error: true
        run: python3 scripts/check_coherent_families.py

      - name: Explicit numerical data architecture
        id: numerical_data
        continue-on-error: true
        run: python3 scripts/check_explicit_numerical_data.py

      - name: No declaration uses sorry
        id: sorry_gate
        continue-on-error: true
        run: |
          set -euo pipefail
          # The emitter below is the repository-wide sorry gate, and it reads
          # the environment, not the text a `set_option ... in` evasion hides
          # in. An `lean_exe` root cannot appear in an emission built from its
          # own imports, so exe/ is exactly what the emitter cannot reach and
          # exactly what this loop covers. Keep the two in agreement:
          # scripts/check_emission_coverage.py excludes exe/ on the strength of
          # this step existing.
          #
          # `lake env lean` does not build; it only sets LEAN_PATH, so build
          # what the exe roots import here rather than depending on what an
          # earlier step happened to leave behind: the sweep umbrella, which is
          # not a default target.
          #
          # The LIBRARY, not the executable. Linking an executable compiles
          # every transitively imported module to a native object -- thousands
          # of Mathlib `:c.o` targets, under .lake/packages where the
          # `.lake/build` cache does not reach -- and nothing here needs one:
          # `lake env lean` reads oleans.
          lake build DerivedAlgGeoSweep
          : > lean-source-check.txt
          for f in exe/*.lean; do
            lake env lean "$f" 2>&1 | tee -a lean-source-check.txt
          done
          if grep -q "declaration uses 'sorry'" lean-source-check.txt; then
            echo "::error::a declaration uses sorry"
            exit 1
          fi

      - name: Emit combined environment
        id: emit
        continue-on-error: true
        run: |
          set -euo pipefail
          # INTERPRETED, not compiled. `lake exe emit` needs the executable
          # linked, and linking one compiles every transitively imported module
          # to a native object and then links a binary of a few hundred MB. None
          # of it is cached -- those objects live under
          # .lake/packages/*/.lake/build/ir, and the `.lake/build` cache covers
          # only the root package. The interpreter reads the oleans the build
          # already restored, and is faster end to end because it never loads
          # that binary.
          #
          # Both paths emit the same artifact apart from `emitted_at`, and exit
          # codes propagate through `--run`, which is load-bearing: the non-zero
          # exit BELOW IS the repository-wide sorry gate. If it stopped
          # propagating, this gate would pass vacuously forever.
          #
          # `lake build emit` still runs in the cache-warm workflow, so the
          # executable is still proved to link on Linux once per merge to main;
          # it is only off the per-pull-request path.
          lake build DerivedAlgGeoSweep
          # Non-zero when any constant's axiom closure contains sorryAx. This is
          # the repository-wide sorry gate; the artifact is written either way.
          lake env lean --run exe/Emit.lean --out attest/lean-emission.json
          # ...and this is what keeps that gate from silently shrinking to a
          # scope where the claim is vacuously true. See the script's docstring.
          python3 scripts/check_emission_coverage.py attest/lean-emission.json
          python3 - <<'PY'
          import json
          d = json.load(open("attest/lean-emission.json", encoding="utf-8"))
          n = len(d["constants"])
          if n == 0:
              raise SystemExit("::error::empty emission -- the vacuous pass")
          print(f"ok: {n} constants, {d['counts']['in_scope']} in scope, "
                f"{sum(1 for c in d['constants'] if c['cites'])} cited")
          PY


      # The save half of this cache is the `Cache warm` workflow, in
      # .github/workflows/cache-warm.yml: the writer has to be a runner of the
      # platform the cache is for.

      # The mfc contract gates, run against this repository's own emission
      # rather than against fixtures.
      - name: Contract gates
        id: contract_gates
        continue-on-error: true
        # Skipped rather than run when the emitter failed: this step reads
        # attest/lean-emission.json, and a missing-input traceback is not a
        # verdict about the repository. `emit` already reports that failure.
        if: steps.emit.outcome == 'success'
        run: |
          set -euo pipefail
          # Its own venv, in the workspace, so this step never touches a
          # self-hosted runner's system Python.
          #
          # The interpreter is CHOSEN, not inherited. `mfc` needs 3.11+ because
          # `mfc env` reads lakefile.toml with `tomllib`, and an older inherited
          # `python3` fails only on the runner that has it, after a full build,
          # while the same commit is green elsewhere.
          PY311=""
          for c in python3.13 python3.12 python3.11 python3; do
            if command -v "$c" >/dev/null 2>&1 && \
               "$c" -c 'import sys; raise SystemExit(0 if sys.version_info >= (3,11) else 1)'; then
              PY311="$c"; break
            fi
          done
          if [ -z "$PY311" ]; then
            echo "::error::no python >= 3.11 on this runner. mfc needs tomllib," \
                 "which is stdlib from 3.11; python3 here is $(python3 -V 2>&1)."
            exit 1
          fi
          echo "using $PY311 ($("$PY311" -V 2>&1))"
          # Delete it first. On a self-hosted runner the workspace persists, and
          # `python -m venv` over an existing directory does NOT reinstall what
          # is already there. `pip install "mfc @ git+...@<sha>"` then compares
          # by name and version, not by URL, so a pin bump that leaves the
          # version string alone is treated as already satisfied and the OLD mfc
          # survives the bump -- silently, and for as long as the runner lives.
          rm -rf .mfc-venv
          "$PY311" -m venv .mfc-venv

          # A venv puts its executables in `bin` on Unix and in `Scripts` on
          # Windows.
          #
          # Every consumer of the venv is INSIDE THIS STEP -- the later `python`
          # invocations are the same `run:` block -- so these stay plain shell
          # variables. $GITHUB_ENV publishes only to SUBSEQUENT steps, never to
          # the step doing the writing.
          VENV_BIN=".mfc-venv/bin"
          [ -d "$VENV_BIN" ] || VENV_BIN=".mfc-venv/Scripts"
          [ -d "$VENV_BIN" ] || { echo "::error::venv has neither bin/ nor Scripts/"; exit 1; }

          # The interpreter inside the venv is NOT reliably called `python`. A
          # venv names it after the base executable, and on Windows that can
          # leave `.mfc-venv/Scripts/python` absent. Resolve it explicitly and
          # fail loudly if no spelling exists. On Unix `bin/python` is present
          # and wins first.
          VENV_PY=""
          for cand in "$VENV_BIN/python" "$VENV_BIN/python3" \
                      "$VENV_BIN/python.exe" "$VENV_BIN/python3.exe"; do
            if [ -x "$cand" ]; then VENV_PY="$cand"; break; fi
          done
          [ -n "$VENV_PY" ] || { echo "::error::no interpreter in $VENV_BIN"; exit 1; }
          echo "using venv interpreter $VENV_PY"

          "$VENV_BIN/pip" install --quiet \
            "mfc[yaml] @ git+https://github.com/chris-dare-dev/math-formal-contract-lean@5ddf2536e5e57097e568b63b9de06ec00fc8930d#subdirectory=contract"
          MFC="$VENV_BIN/mfc"

          # Assert the installed schema is the one the emitter writes against.
          #
          # When these disagree under `additionalProperties: false`, the symptom
          # is one near-identical error per constant, none of which names the
          # cause. This check is cheap, and it is the difference between one
          # line that names the missing fields and thousands that name every
          # constant in the library.
          "$VENV_PY" -c 'import json,os,sys,mfc; p=os.path.join(os.path.dirname(mfc.__file__),"schema","emission-1.0.schema.json"); d=json.load(open(p,encoding="utf-8")); missing=({"discharges","doc","scope"}-set(d["$defs"]["constant"]["properties"]))|({"external","foreign"}-set(d["properties"]["counts"]["properties"])); sys.exit(0) if not missing else (print("::error::installed mfc emission schema is stale: it rejects "+", ".join(sorted(missing))+", which the emitter emits."), sys.exit(1))'
          echo "emission schema accepts the emitter field set"

          "$MFC" validate attest/lean-emission.json

          "$MFC" env --repo . --out attest/environment.json \
            --axiom-allowlist propext,Quot.sound,Classical.choice \
            --emitter-version mfc-emit/1.1.0
          "$MFC" validate attest/environment.json

          "$MFC" bundle --emission attest/lean-emission.json \
                        --environment attest/environment.json \
                        --out attest/declarations.json

          # --registry runs E-04, E-05 and E-12 against the minted registry.
          # E-09 and E-11 still need a closed-lanes config this repo has not
          # minted, so the EXACT expected not_run set is asserted below: any
          # silent widening of it -- a malformed registry, a schema drift
          # demoting more rules -- fails the step instead of printing a smaller
          # green table.
          "$MFC" lint --emission attest/lean-emission.json \
                      --environment attest/environment.json \
                      --registry registry/bridgeland2007.json \
            | tee mfc-lint-report.txt
          actual_not_run=$(grep -oE '^not_run  E-[0-9]+' mfc-lint-report.txt \
            | awk '{print $2}' | sort | paste -sd, -)
          if [ "$actual_not_run" != "E-09,E-11" ]; then
            echo "::error::mfc lint not_run set is '$actual_not_run', expected" \
                 "'E-09,E-11'. A rule stopped running (or started); update this" \
                 "assertion only with the config change that explains it."
            exit 1
          fi

          # BOTH roots. The emitter sweeps DerivedAlgGeoSweep plus DerivedAlgGeo
          # (exe/Emit.lean). With one `--lib`, coverage scopes to that root
          # alone and the check passes having compared nothing.
          "$MFC" check-ilean-coverage --emission attest/lean-emission.json \
            --lib DerivedAlgGeoSweep --lib DerivedAlgGeo

          # Runs when there is a resolution.json to run it on, and says so when
          # there is not.
          if [ -f attest/resolution.json ]; then
            "$MFC" check-resolution attest/resolution.json
          else
            echo "::notice::check-resolution did NOT run: no attest/resolution.json yet"
          fi

          # ------------------------------------------------------------------
          # build.json, and the honest size of what it measured.
          #
          # There is no cheap route to project-wide NDJSON, and the obvious
          # wirings are worse than nothing because THEY LOOK CLEAN:
          #
          #   - `lake env lean --json` on a root import file prints NOTHING.
          #     Imports are served from oleans and never re-reported, so this
          #     step would emit error_count 0, warning_count 0,
          #     sorry_diagnostic_count 0 having elaborated no library module --
          #     and `mfc seal` would accept it as the build/v1 predicate C-12
          #     requires. A vacuous pass wearing a passing bundle.
          #   - `moreLeanArgs = ["--json"]` is consumed by lake, which
          #     re-renders every message in its own text format.
          #   - lake persists no structured log: .hash, .trace, .olean, .ilean.
          #   - per-module invocation pays a full Mathlib import load each time,
          #     which over the whole library is hours, not a per-commit step.
          #
          # So this covers the two ROOT modules and says so. `--covers` is what
          # puts `measured: {modules, in_scope_modules}` in the artifact, and
          # `mfc build` prints "PARTIAL diagnostics cover 2 of N" on stderr
          # every run. The number is meant to look small. It is small.
          #
          # THE REPOSITORY-WIDE SORRY GATE IS NOT THIS. It is the emission step
          # above: `lake env lean --run exe/Emit.lean` exits non-zero when any
          # constant's axiom closure contains sorryAx, over every constant in
          # the environment, and it is strictly stronger than any build-log
          # count because it cannot be defeated by declaration syntax.
          #
          # `set +e` around the sweep for the same reason as the exit capture
          # below: a root module that will not elaborate is exactly when the
          # diagnostics are worth having, and dying here would discard them
          # before build.json is written. Only stdout is captured -- lean writes
          # its JSON messages there, and anything lake says on stderr would not
          # parse as NDJSON.
          : > attest/lake-build.ndjson
          set +e
          for m in DerivedAlgGeo DerivedAlgGeoSweep; do
            lake env lean --json "$m.lean" >> attest/lake-build.ndjson
          done
          set -e

          # RECORDED, NEVER THE GATE -- on this toolchain a build whose only
          # defect is a sorry exits 0. Captured rather than assumed, so the
          # field says what happened.
          #
          # `set +e` and not `|| true`: with `|| true` the pipeline succeeds and
          # $? is 0 no matter what lake returned, which would record a clean
          # exit for a failed build -- the field lying in the one direction that
          # matters. The step must not die here either; the artifact has to
          # exist and be honest especially when the answer is bad.
          set +e
          lake build DerivedAlgGeoSweep > attest/lake-build.log 2>&1
          LAKE_EXIT=$?
          set -e
          # 0 when lake printed no job line, which is what a fully cached
          # no-op build looks like. `minimum: 0` in the schema permits it.
          LAKE_JOBS=$(sed -n 's/.*Build completed successfully (\([0-9]*\) jobs).*/\1/p' \
                        attest/lake-build.log | tail -1)
          LAKE_JOBS=${LAKE_JOBS:-0}

          "$MFC" build --ndjson attest/lake-build.ndjson \
                       --environment attest/environment.json \
                       --emission attest/lean-emission.json \
                       --covers DerivedAlgGeo --covers DerivedAlgGeoSweep \
                       --lake-exit "$LAKE_EXIT" --lake-jobs "$LAKE_JOBS" \
                       --out attest/build.json

          # The in-toto Statement, and then the twelve conformance rules over
          # it.
          #
          # `seal` REFUSES to omit a required predicate and refuses a dirty
          # worktree. attest/review.yaml is the one file here that is committed
          # rather than regenerated -- see the .gitignore negation. When it
          # exists the bundle carries a human-review predicate and C-10 runs;
          # when it does not, seal is called without it and C-10 says so out
          # loud. `--review-produced-by` is read FROM the file rather than
          # hardcoded here, so the bundle names whoever actually signed the
          # review instead of whoever wrote this workflow.
          SEAL_REVIEW=()
          if [ -f attest/review.yaml ]; then
            REVIEWER=$("$VENV_PY" -c "import yaml,sys; \
              print(yaml.safe_load(open('attest/review.yaml'))['reviews'][0]['reviewer']['name'])")
            SEAL_REVIEW=(--review attest/review.yaml
                         --review-produced-by "human:$REVIEWER")
            echo "::notice::sealing with human review by $REVIEWER"
          else
            echo "::notice::no attest/review.yaml; C-10 will report not_run"
          fi

          "$MFC" seal --root . \
                      --environment attest/environment.json \
                      --registry registry/bridgeland2007.json \
                      --declarations attest/declarations.json \
                      --build attest/build.json \
                      "${SEAL_REVIEW[@]}" \
                      --out attest/bundle.json

          # ------------------------------------------------------------------
          # restate: does the human review survive the environment it is in?
          #
          # env_digest hashes every package revision, so ONE dependency bump
          # rotates it while the mathematics sits still, and C-10 then reports
          # every review as belonging to another environment, with its statement
          # digest byte-identical on both sides.
          #
          # Without this, every review needs a re-read on every bump. With it,
          # `restated` carries the review forward on evidence and NOTHING ELSE
          # does: `changed` means the statement moved, and `not_checkable` means
          # nobody knows, which is not a pass either.
          #
          # The plan step exists because Lean cannot read YAML and this package
          # is forbidden dependencies -- so the reviews cross the boundary as
          # JSON. Elaboration is Lean's; reading the verdict is mfc's.
          if [ -f attest/review.yaml ]; then
            # RV-01 first, before anything reads the review. A review whose
            # reviewed_statement_pp is null passes `mfc validate`, has a
            # reviewer, a date, a verdict and three digests, and is SILENTLY
            # un-carryable: restate returns not_checkable, so C-10 fails at the
            # next dependency bump. Nothing about it looks wrong until then.
            #
            # It runs ahead of restate-plan deliberately. Downstream the same
            # defect appears as `not_checkable`, which is also what a genuine
            # tooling failure looks like; here it appears as what it is, with
            # the entry named and the remedy in the message.
            "$MFC" check-review attest/review.yaml

            "$MFC" restate-plan --review attest/review.yaml \
                                --out attest/restate-plan.json
            # Interpreted, like the emitter: linking the executable compiles
            # every transitively imported module and none of it is cached.
            lake env lean --run exe/Restate.lean \
              --plan attest/restate-plan.json --out attest/restate.json
            "$MFC" validate attest/restate.json
            # T-01/T-02 need the review; without it they print not_run and this
            # step would assert nothing about the entries it just checked.
            "$MFC" restate-check attest/restate.json --review attest/review.yaml
            RESTATE_ARG="--restate attest/restate.json"
          else
            RESTATE_ARG=""
            echo "::notice::restate did NOT run: no attest/review.yaml"
          fi

          # C-08 alone prints not_run: there is no resolution.json. That is NOT
          # a pass, and the summary line says so on every run. As with lint
          # above, the exact expected not_run set is asserted so it cannot widen
          # silently.
          #
          # C-10 runs because attest/review.yaml exists and the bundle carries a
          # human-review predicate. It must not return to not_run: that would
          # mean the review stopped being sealed into the bundle -- most likely
          # review.yaml going missing, which the .gitignore negation exists to
          # prevent.
          # $RESTATE_ARG unquoted on purpose: it is empty when there is no
          # review, and "" would pass conformance an empty argument.
          # shellcheck disable=SC2086
          "$MFC" conformance --bundle attest/bundle.json \
                             --emission attest/lean-emission.json \
                             $RESTATE_ARG \
            | tee mfc-conformance-report.txt
          actual_not_run=$(grep -oE '^not_run  C-[0-9]+' mfc-conformance-report.txt \
            | awk '{print $2}' | sort | paste -sd, -)
          if [ "$actual_not_run" != "C-08" ]; then
            echo "::error::mfc conformance not_run set is '$actual_not_run'," \
                 "expected 'C-08'. A rule stopped running (or started);" \
                 "update this assertion only with the config change that" \
                 "explains it."
            exit 1
          fi

      # The determinism assertion: two runs over an unchanged environment must
      # be byte-identical except for `emitted_at`. It is what makes
      # `builds_clean` mean something a second machine could reproduce, and it
      # costs a second interpreted sweep -- which is why it is here, after the
      # artifact everything else needs has already been produced.
      #
      # It does not run on every event. Determinism is a property of the
      # EMITTER, of the toolchain, and of the pinned contract revision, not of
      # the topic commit under test, so re-proving it on a branch that touched
      # only DerivedAlgGeo/ re-proves it about inputs that did not move. The
      # three conditions below are the three ways that property can change, and
      # between them they cover every path by which a commit reaches `main`:
      #
      #   * `refs/heads/main` -- every merge is checked, so the determinism
      #     claim attached to a main-branch attestation is always freshly
      #     measured rather than inherited from a branch run.
      #   * `merge_group` -- the last gate before `main` moves, and the one
      #     place two independently-green branches first meet.
      #   * `scope == 'all'` -- the "What changed" step sets this when the diff
      #     touches lakefile.toml, lean-toolchain, lake-manifest.json,
      #     .github/, scripts/ or exe/. That set is a SUPERSET of
      #     this gate's determinism inputs, so any pull request that could move
      #     the needle still runs it.
      #
      # The residual hole: a library-only pull request that introduces a
      # declaration whose own pretty-printing is unstable is caught in the merge
      # queue, before `main` moves, rather than on the pull request.
      #
      # `attest/lean-emission-2.json` is written and read by this step alone, so
      # skipping it leaves nothing downstream short of an input.
      - name: Emitter reproducibility
        id: emitter_reproducibility
        continue-on-error: true
        # The `steps.emit` clause is not part of the gating rule above: it reads
        # the same artifact `Contract gates` does.
        if: >-
          steps.emit.outcome == 'success'
          && (github.ref == 'refs/heads/main'
          || github.event_name == 'merge_group'
          || steps.changed.outputs.scope == 'all')
        run: |
          set -euo pipefail
          lake env lean --run exe/Emit.lean --out attest/lean-emission-2.json
          python3 - <<'PY'
          import json
          a = json.load(open("attest/lean-emission.json", encoding="utf-8"))
          b = json.load(open("attest/lean-emission-2.json", encoding="utf-8"))
          # `emitted_at` is the ONLY field permitted to differ, and it is named
          # rather than filtered by pattern: a second volatile field appearing
          # later must fail here, loudly, instead of being absorbed.
          a.pop("emitted_at"); b.pop("emitted_at")
          if a != b:
              differing = sorted(k for k in set(a) | set(b) if a.get(k) != b.get(k))
              raise SystemExit(f"::error::emitter is not deterministic; fields differ: {differing}")
          print("ok: two sweeps byte-identical modulo emitted_at")
          PY

      # ---------------------------------------------------------------------
      # EVERY GATE REPORTS. This step is what makes the job fail, not the gates.
      #
      # `set -e` inside a 30-step job means the FIRST red gate ends the run and
      # every gate behind it reports `skipped`. That is not a smaller signal, it
      # is a misleading one: a pull request can look like it has one problem and
      # have four, and the regressions behind the first red gate merge unseen.
      #
      # So the gates carry `continue-on-error: true`, which does NOT mean they
      # stopped mattering: it means their verdict is recorded rather than
      # thrown, and this step turns the whole set into one exit code. A gate's
      # own annotation still appears on its own step in the UI.
      #
      # `outcome`, not `conclusion`. `continue-on-error` rewrites `conclusion`
      # to `success` for exactly these steps -- reading it here would make this
      # check pass on every failure, which is the trap this pattern comes with.
      #
      # SKIPPED IS REPORTED, NOT FAILED, and the distinction is narrow on
      # purpose. Only `Contract gates` and `Emitter reproducibility` can skip,
      # and only when `emit` failed or when the reproducibility rule excludes
      # this event -- in the first case `emit` itself is already `failure` and
      # this step fails on it, in the second the gate was never owed. A gate
      # that skips for any other reason would be a hole, so the list below
      # prints the skips rather than passing over them.
      #
      # The build step ITSELF stays fail-fast. A library that did not compile
      # makes every gate after it meaningless, and running twenty checks to say
      # so twenty times is noise, not coverage.
      - name: Every gate passed
        if: always() && steps.checkout.outcome == 'success'
        env:
          RESULTS: |
            pin=${{ steps.pin.outcome }}
            single_instantiation=${{ steps.single_instantiation.outcome }}
            environment_linters=${{ steps.environment_linters.outcome }}
            warning_ratchet=${{ steps.warning_ratchet.outcome }}
            console_encoding=${{ steps.console_encoding.outcome }}
            style_fixtures=${{ steps.style_fixtures.outcome }}
            style_ratchet=${{ steps.style_ratchet.outcome }}
            emission_sources=${{ steps.emission_sources.outcome }}
            source_independence=${{ steps.source_independence.outcome }}
            subject_layering=${{ steps.subject_layering.outcome }}
            neutral_stability_imports=${{ steps.neutral_stability_imports.outcome }}
            umbrella_coverage=${{ steps.umbrella_coverage.outcome }}
            root_reachability=${{ steps.root_reachability.outcome }}
            coherent_families=${{ steps.coherent_families.outcome }}
            numerical_data=${{ steps.numerical_data.outcome }}
            sorry_gate=${{ steps.sorry_gate.outcome }}
            emit=${{ steps.emit.outcome }}
            contract_gates=${{ steps.contract_gates.outcome }}
            emitter_reproducibility=${{ steps.emitter_reproducibility.outcome }}
        run: |
          set -euo pipefail
          failed=""
          skipped=""
          while IFS= read -r line; do
            [ -n "$line" ] || continue
            name="${line%%=*}"
            outcome="${line#*=}"
            case "$outcome" in
              success) ;;
              skipped) skipped="$skipped $name" ;;
              "")      failed="$failed $name(no-outcome)" ;;
              *)       failed="$failed $name($outcome)" ;;
            esac
          done <<< "$RESULTS"
          if [ -n "$skipped" ]; then
            echo "::notice::gates skipped:$skipped"
          fi
          if [ -n "$failed" ]; then
            echo "::error::gate(s) failed:$failed"
            echo
            echo "Each failure is annotated on its own step above. They ran"
            echo "independently, so this list is the whole picture rather than"
            echo "the first problem encountered."
            exit 1
          fi
          echo "all gates passed"

      - name: Upload trust artifacts
        # Gated on checkout, and named by commit, so a persistent self-hosted
        # workspace can never upload a previous run's attest/ as this run's:
        # `always()` alone would attach it whenever checkout failed before
        # cleaning.
        if: always() && steps.checkout.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: trust-artifacts-${{ github.sha }}
          path: |
            attest/lean-emission.json
            attest/environment.json
            attest/declarations.json
            attest/build.json
            attest/bundle.json
            attest/restate.json
          if-no-files-found: warn

  ci:
    needs: [changes, build]
    # This job must still run when `build` FAILED -- without that, a failed
    # build would leave `ci` skipped, and a skipped required check does not
    # block a merge. That is the whole mechanism, and it is why the obvious
    # default (no `if:` at all, which skips on any upstream failure) is wrong.
    #
    # But it must NOT run when the whole RUN was cancelled, which is what
    # `always()` would do. The concurrency block above cancels a superseded
    # branch run, and under `always()` that dead run would still execute this
    # job, see `cancelled`, and post a FAILING `ci` check. The commit's status
    # rollup aggregates EVERY check run on it: one red `ci` blocks the merge
    # however green a newer run of the same name is, until something overwrites
    # that specific check run.
    #
    # `!cancelled()` keeps the mechanism and drops the artifact: a FAILED
    # upstream is not a cancelled run, so this still runs and still fails on it;
    # an individually cancelled `build` inside a live run also still reaches the
    # enumeration below and fails there.
    #
    # THE TRADE-OFF: when a run is cancelled this job is SKIPPED, and a skipped
    # required check does not block. That is correct for the concurrency case,
    # because a superseding run is by definition already posting its own `ci`.
    # It is a real if small loss for a run cancelled BY HAND with nothing
    # following it. Do not "fix" that by letting this job run and PASS on a
    # cancelled run: a green `ci` over a build that never finished is strictly
    # worse than a skip.
    if: ${{ !cancelled() }}
    # Routed like `build`, for the same private-minutes reason.
    runs-on: ${{ vars.OWNER_CI_RUNS_ON && fromJSON(vars.OWNER_CI_RUNS_ON) || 'ubuntu-latest' }}
    steps:
      - name: Every required job succeeded
        # Through `env`, not interpolated into the script. Workflow expressions
        # may only quote strings with SINGLE quotes, so the obvious
        # `join(needs.*.result, " ")` is a syntax error -- and GitHub answers an
        # invalid workflow by failing a run named after the file with no
        # annotation and no checks at all, which reads exactly like CI never
        # triggered. Keeping expressions out of the script body sidesteps that
        # nested quoting, and is the standard way to avoid script injection from
        # expression output besides.
        env:
          CHANGES: ${{ needs.changes.result }}
          BUILD_NEEDED: ${{ needs.changes.outputs.build }}
          BUILD: ${{ needs.build.result }}
        run: |
          set -euo pipefail
          # Enumerate rather than pattern-match. `contains(needs.*.result,
          # 'failure')` is the common form and it is wrong by omission: it
          # passes a cancelled job, and it passes a SKIPPED one. A job that
          # never ran has not proved anything, so anything other than `success`
          # fails here.
          #
          # One exception, and it is narrow: a skipped `build` is accepted when
          # `changes` succeeded AND wrote `build=false`. The skip is then a
          # verdict that nothing in the change is the build's to check, not a
          # job that never ran.
          echo "changes=${CHANGES} build_needed=${BUILD_NEEDED} build=${BUILD}"
          rc=0
          if [ "$CHANGES" != "success" ]; then
            echo "::error::changes did not succeed (result: ${CHANGES})"
            rc=1
          fi
          if [ "$BUILD" = "success" ]; then
            :
          elif [ "$BUILD" = "skipped" ] && [ "$CHANGES" = "success" ] \
               && [ "$BUILD_NEEDED" = "false" ]; then
            echo "build skipped: every changed path is prose"
          else
            echo "::error::build did not succeed (result: ${BUILD})"
            rc=1
          fi
          exit "$rc"
