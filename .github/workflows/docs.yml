name: Docs

# Nightly rather than per-push. The build takes ~40 minutes because doc-gen4 documents
# everything reachable from DerivedAlgGeo, which is a large part of Mathlib; on a repo where
# several sessions push to main in a day that is most of a runner-day for output that is
# usually identical. Docs are at most a day behind main, and `workflow_dispatch` is there
# when that is not good enough.
#
# Two GitHub behaviours to know about: scheduled workflows only ever run on the default
# branch, and GitHub disables them after 60 days with no repository activity. The minute is
# deliberately not :00 -- schedules queue behind the top-of-hour crowd.
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

# Unlike CI, do *not* cancel a run in progress. Pages allows one deployment at a time, and a
# cancelled deploy can leave the published site on an older commit than the one that won the
# race. Queue instead.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # A nightly build on a day when nobody pushed regenerates the same site for forty minutes.
  # Skip it. A manual run always proceeds -- that is what it is for.
  #
  # The site is published from the public repository only. The private owner mirror sets
  # OWNER_CI_RUNS_ON (see `build` in ci.yml), and there this job is skipped, which skips
  # `build` and `deploy` behind it -- otherwise the nightly cron would bill forty minutes
  # of private-repository time a day for a site that is never published.
  check:
    if: ${{ !vars.OWNER_CI_RUNS_ON }}
    runs-on: ubuntu-latest
    outputs:
      should-build: ${{ steps.check.outputs.should-build }}
    steps:
      - uses: actions/checkout@v4

      - id: check
        run: |
          if [ "${{ github.event_name }}" != schedule ]; then
            echo "should-build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # `cron` is 24h, so anything older than that was covered by the previous run.
          age=$(( $(date +%s) - $(git log -1 --format=%ct) ))
          if [ "$age" -lt 86400 ]; then
            echo "should-build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should-build=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No commits in the last 24h -- the published docs are current."
          fi

  build:
    needs: check
    if: needs.check.outputs.should-build == 'true'
    runs-on: ubuntu-latest
    # doc-gen4 documents every file reachable from the target, which here means a large part
    # of Mathlib as well as DerivedAlgGeo. Expect this to be slow. The cap is a runaway guard, not
    # an expectation.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      # Installs the toolchain from lean-toolchain, fetches the Mathlib olean cache and runs
      # `lake build`. Two reasons this comes first: doc-gen4 can only document a library that
      # already builds, and the docs package shares this package directory, so the oleans
      # fetched here are the ones it reuses.
      - name: Build DerivedAlgGeo
        # Pinned to the same commit as ci.yml; `v1` is a moving tag
        # (2026-08-18 adversarial review, P2-5).
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1
        with:
          # The third and last call site, set for the same reason as the other
          # two even though this job gates nothing: `nanoda` defaults to off,
          # so nothing runs today -- but a reader who greps
          # `nanoda-allow-sorry` and finds it at two of three call sites will
          # reasonably conclude the third was considered and exempted. It was
          # not. One rule, every call site.
          nanoda: false
          nanoda-allow-sorry: false

      # doc-gen4 is required from `docbuild/`, a nested package, so that neither `lake build`
      # here nor any downstream package that requires DerivedAlgGeo has to fetch it. See
      # docbuild/lakefile.toml.
      - name: Build documentation
        working-directory: docbuild
        run: lake build DerivedAlgGeo:docs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docbuild/.lake/build/doc

  # Split from the build so that the Pages deployment -- the only step with write
  # permissions on anything -- runs on an artifact that is already final.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
