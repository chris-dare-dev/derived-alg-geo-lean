title: "The numerical lane — one Grothendieck group, and dimension as a parameter"
status: active
phase: sequenced          # init -> refined -> decomposed -> sequenced -> complete
brief: |
  This track exists because the lane it covers had no track.

  As of 2026-08-27 four roadmaps are active — contract-v1, dg-enhancements,
  stability-families, theorem22-2-dependencies — and none owns K-theory,
  Riemann--Roch, or numerical geometry. That is 261 files under
  `AlgebraicGeometry/` with no epic, no milestone, and no review pressure.

  It is also, precisely, where the duplication is. An adversarial architecture
  audit run on 2026-08-26 found a second complete hand-rolled Grothendieck
  group, two surviving copies of the axiom triple that #760 announced it had
  eliminated, an eleven-declaration verbatim fork between a Surface file and a
  HigherDimension file, a documented-and-kept fork of the real Mukai extension,
  and three parallel directories in which dimension is encoded as tuple arity.
  Every one of those is in this lane. None is in the stability or dg lanes,
  which are tracked.

  The claim this track rests on is that the correlation is causal: untracked
  work accretes duplicates because nothing is watching the shape. The
  deletions below are the repair; the track itself is the fix.

  What this is NOT: a rewrite of the numerical mathematics. Every epic here
  either deletes a copy in favour of an existing definition or replaces an
  enumeration with a parameter. No new mathematical content is claimed, and the
  Riemann--Roch and intersection-theory statements are untouched except where
  they name a type that moves.
goal:
  hmw: "How might we make the numerical lane carry the same abstraction tower the stability and dg lanes already do — one Grothendieck group, invariants as bundled homs, dimension as an index — without restating a single theorem of its mathematics?"
  objective: "Collapse every hand-rolled Grothendieck-group construction and axiom-triple carrier in AlgebraicGeometry onto GrothendieckPresentation and K₀Ab, and replace the three dimension-indexed directories with one parameterised statement, lowering the AlgebraicGeometry unaudited ceiling in the process."
  key_results:
    - "Exactly one Grothendieck group construction exists in the repository; grep for a second returns nothing. `CoherentGrothendieckGroup` and its bespoke universal property are gone, replaced by `K₀Ab (Coh X)`."
    - "No structure in AlgebraicGeometry carries a function together with `_iso` and `_shortExact` (or `_zero`) fields. Every additive invariant is an `AddMonoidHom` out of `K₀Ab`, and the isomorphism and additivity laws are theorems obtained from it rather than hypotheses supplied to it."
    - "`ReconstructionSystem` exists once. The Surface case is obtained from the higher-dimensional one at n = 2 rather than by a second copy of eleven declarations."
    - "`RealMukai` and `RealExtension` are one type with one bundled pairing; the cross-reference that names one in the other's docstring is replaced by an import."
    - "Dimension is a parameter. `SurfaceNum`, `ThreefoldNum` and `FourfoldNum` are replaced by a single indexed type, and the hard-coded dimension names in CI move with it."
    - "The AlgebraicGeometry ceiling in `scripts/check_audit_complete.py` is strictly lower at the end of this track than the 1059 it starts at, and every drop is recorded in the PR that causes it."
  assumptions:
    - tier: must
      text: "`Coh X` is abelian for every `Variety k`, so `K₀Ab (Coh X)` is defined and is the same object `CoherentGrothendieckGroup` hand-rolls."
      validation: "CONFIRMED 2026-08-26 against the tree: the `Abelian (Coh X)` instance is in `CoherentSheaf/Abelian/Basic.lean` and applies to every `Variety k`."
    - tier: must
      text: "The `iso` generator in `CoherentGrothendieckRelation` is redundant, so dropping it loses nothing."
      validation: "CONFIRMED: `K₀Ab.of_iso` is a theorem in `CategoryTheory/GrothendieckGroup/Abelian.lean`, derived from the short exact sequence `X ≅ Y ⟶ 0`. The hand-rolled relation carries it as a constructor instead."
    - tier: must
      text: "The positivity fields of an invariant — `rank_nonneg`, `degree_pos_of_rank_zero` and their analogues — do NOT descend to K₀ and must survive as fields."
      validation: "CONFIRMED by inspection: they are statements about objects, and a difference of classes can have negative rank. They are rephrased through the hom, never deleted. This is the single most likely way to get these epics wrong."
    - tier: should
      text: "The fourfold numerical formulas admit the same uniform shape as the surface and threefold ones, so one indexed type covers all three."
      validation: "UNVALIDATED. If the fourfold case resists, NK2-e5 ships the surface/threefold unification and parks the fourfold with the obstruction written down. That is a permitted outcome, not a failure."
  wont:
    - "No new numerical mathematics. Every epic deletes a copy or parameterises an enumeration; none proves a new theorem about a variety."
    - "No merge of the Mukai lattice theory above the real quadratic extension. Mukai lattice structure is special to K3 and abelian surfaces and does not generalise to arbitrary dimension; only `ℝ × V × ℝ` with its pairing unifies."
    - "No isomorphism `K₀Ab 𝒜 ≅ K₀ C`. That needs a bounded t-structure and is not available at the pin. The comparison stays the one-way `K₀Ab.toAmbient` that #760 shipped."
    - "No `sorry`, including as a refactoring convenience while a copy is being removed."
    - "No stability-lane or dg-lane work. `ClassDatum`, `heartDatum` and the enhancement tower belong to stability-families and dg-enhancements respectively."
  evidence:
    - "The 2026-08-26 architecture audit: four adversarial critics over the tree at 3079d8a, each required to run a mathematical soundness gate and drop unifications that would force a `sorry`. Findings 02, 03, 05, 06 and 08 are this track's epics."
    - "AlgebraicGeometry/Cohomology/EulerCharacteristic/Additivity.lean:360-378 — `CoherentGrothendieckGroup` rebuilds `FreeAbelianGroup ⧸ AddSubgroup.closure {relations}`, its own class map and its own lift, and imports nothing from `GrothendieckGroup/`."
    - "AlgebraicGeometry/RiemannRoch/Grothendieck.lean:31 and AlgebraicGeometry/Variety/Numerical.lean:63 — the two axiom triples that survived #760, which claimed in `GrothendieckGroup/Abelian.lean` that those fields had stopped being data. #766 collapsed `SlopeData`; these two were not in it."
    - "AlgebraicGeometry/RiemannRoch/Surface/NumericalVariety.lean:102-206 vs AlgebraicGeometry/RiemannRoch/HigherDimension/Hirzebruch.lean:124-222 — eleven declarations, ~80 code lines, differing only in line wrapping and two docstring phrasings. Diffed with comments stripped."
    - "LinearAlgebra/Lattice/Mukai/RealForm.lean:76 — names `Walls/Spherical/Basic.lean`'s `RealMukai` in prose as 'the same underlying type carrying a bare pairing', rather than importing it. The fork was seen and kept."
    - "AlgebraicGeometry/Numerical/Examples/{Surface/RankOne.lean:192, Threefold/LinearSection.lean:61, Fourfold/LinearSection.lean:50} — `ℤ×ℤ×ℤ`, `ℤ×ℤ×ℤ×ℤ`, `ℤ×ℤ×ℤ×ℤ×ℤ`. Dimension is the arity and the arity is typed out."
    - ".claude/roadmap/{contract-v1,dg-enhancements,stability-families,theorem22-2-dependencies}.yaml — searched 2026-08-27 for K-theory, Grothendieck, Riemann--Roch and numerical ownership. Four incidental mentions, zero epics. This lane was unowned."
