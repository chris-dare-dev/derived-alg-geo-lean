title: "Enriques derived Torelli — foundations for arXiv:1912.04332 and 2104.13610"
status: active
phase: sequenced
brief: |
  This track builds the foundations for the refined derived Torelli theorem of
  Li--Nuer--Stellari--Zhao: an Enriques surface is determined by its Kuznetsov
  component. The mathematical chain is: the geometric definition (2-torsion
  canonical class), the isotropic 10-sequence and its Fano-class arithmetic,
  the ten associated line bundles as exceptional objects in `Dᵇ(Coh Y)`, the
  semiorthogonal sequence they span, and its residual component.

  The lane deliberately splits by ownership. Exceptionality, exceptional
  collections, admissibility, and the generic residual component are
  categorical and live under the semiorthogonal root that projective-families
  epic #852 created and left deliberately inhabitant-free ("exceptionality
  and mutation remain deferred until a theorem consumes them" — this lane is
  the consuming theorem's arrival, tracked as #932--#936). The surface
  definition, the collection data, the cohomological witnesses, and the
  residual component of a concrete surface are geometric. The lattice
  arithmetic of isotropic sequences is pure linear algebra and mentions no
  geometry at all.

  Foundations (milestone #43) landed 2026-08-31/09-01: the definition, the
  line-bundle derived-object adapter, the numerical model, and the isotropic
  sequence root. The categorical orientation, exceptional-object, and
  exceptional-collection roots have also landed. PR #1027 adds generic
  admissibility (#934) and the geometric isotropic collection (#988). PR
  #1028 completes exceptionality (#989), the semiorthogonal sequence, and its
  residual component (#990), closing the foundations milestone.

  The second milestone starts the paper-content layer. PR #1030, tracked by
  #1029, combines the categorical Serre core (#894/#895) with half-integral
  Enriques categories, the spherical and pseudoprojective object profiles,
  and exact supplied classification interfaces for both papers. Mutation,
  projection, candidate Ext computations, and equivalence transport remain
  visible future seams rather than being asserted by this statement layer.

  The third milestone landed in PR #1032, tracked by #1031. It replaces the
  arbitrary candidate families in those interfaces by the actual
  right-adjoint projections of the first objects of positive-length
  orthogonal exceptional blocks, and records the ten-bundle enumeration and
  Paper II decomposition type. The projection functor and the papers'
  Ext/classification arguments remain explicit supplied data; no mutation
  cone or geometric existence theorem is claimed.

  The fourth milestone, tracked by #1035, supplies the next honest boundary:
  admissibility chooses the residual projection; its counit gives an
  objectwise mutation triangle; orthogonal-cone triangles prove the same
  projection for every member of a longer block; and Ext profiles transport
  through Serre-compatible equivalences. The papers' one-step and finite
  Fourier--Mukai extension conclusions are stated over the existing kernel
  and adjunction roots. Constructing the divisor triangles and functorial
  cones of kernels remains explicit data pending the dg chain #855, #853, and
  #854.

  The fifth milestone, tracked by #1041, performs the formal closing steps
  after those interfaces. Residual classification now determines the block
  reindexing; bidirectional prefix extension proves exact matched lengths;
  adjacent Ext rigidity proves one common shift per block; and dependent
  finite kernel extension plus right-admissible generation produces the
  ambient Fourier--Mukai equivalence. The construction of each new kernel is
  still the named dg seam, rather than a fabricated cone in a bare
  triangulated category.
goal:
  hmw: "How might we state and eventually prove the refined derived Torelli theorem for Enriques surfaces on top of the repository's single derived-category construction, without a second exceptionality hierarchy, a premature Kuznetsov-component equivalence, or geometry leaking into the categorical root?"
  objective: "Define Enriques surfaces and their semi-canonical ten-bundle configurations, assemble their residual category, and build the honest categorical interfaces needed to state the papers' Serre, spherical, and pseudoprojective classification results without fabricating their geometric proofs."
  key_results:
    - "IsEnriquesSurface is Prop-valued over supplied canonical-sheaf data, with both torsion clauses consumed by sheaf-level theorems and the char-2 exclusion documented rather than encoded."
    - "Every line bundle has a canonical perfect, bounded degree-zero avatar in D(Coh X) through one adapter, not per-consumer plumbing."
    - "The isotropic-sequence lattice root proves linear independence and the sum-vector identities behind Δ·F_i = 3 and Δ² = 10, with no symmetry hypothesis."
    - "Exceptionality of the ten bundles is a reduction to named cohomological inputs in the fields-not-theorems idiom, never a silent axiom."
    - "The residual component is stated through the generic semiorthogonal root and carries a neutral name until the identification with the papers' Ku(Y) is a theorem."
    - "The papers' 3-spherical and 3-pseudoprojective classifications are represented by generic supplied-data roots whose Enriques specialization reuses the constructed residual full subcategory."
architecture_contract:
  policy: "docs/architecture/abstraction-tree.md"
  canonical_roots:
    surface_definition: "SmoothProperVariety + CanonicalSheafData, following the K3 pattern in AlgebraicGeometry/Surface/K3.lean"
    derived_category: "AlgebraicGeometry/DerivedCategory/Coherent.lean; the generic construction is Mathlib's DerivedCategory"
    semiorthogonal: "CategoryTheory/Triangulated/SemiorthogonalDecomposition/: exceptional collections, orthogonal blocks, residual right orthogonals, and chosen right projections"
    serre: "CategoryTheory/Triangulated/SerreFunctor/: SerreFunctorData, SerreCategoryData, EnriquesCategoryData, generic object-classification roots, and their residual-projection constructors"
    lattice: "LinearAlgebra/Lattice/, IntegralLattice namespace, bilinear maps into ℤ"
    line_bundles: "Scheme.Modules.LineBundleData; Pic X for torsion statements"
  prohibited:
    - "a second exceptionality or semiorthogonal carrier below algebraic geometry"
    - "a declaration named for the papers' Kuznetsov component before the identification is a theorem (ADR-0005 vocabulary discipline)"
    - "characteristic hypotheses as structure fields rather than per-theorem assumptions"
    - "ampleness or polarization claims: no such API exists, and clauses needing it enter as supplied data with the gap recorded"
