brief: |
  This track builds the foundations for the refined derived Torelli theorem of
  Li--Nuer--Stellari--Zhao: an Enriques surface is determined by its Kuznetsov
  component. The mathematical chain is: the geometric definition (2-torsion
  canonical class), the isotropic 10-sequence and its Fano-class arithmetic,
  the ten associated line bundles as exceptional objects in `Dᵇ(Coh Y)`, the
  semiorthogonal sequence they span, and its residual component.

  The lane deliberately splits by ownership. Exceptionality, exceptional
  collections, admissibility, and the generic residual component are
  categorical and live under the semiorthogonal root that projective-families
  epic #852 created and left deliberately inhabitant-free ("exceptionality
  and mutation remain deferred until a theorem consumes them" — this lane is
  the consuming theorem's arrival, tracked as #932--#936). The surface
  definition, the collection data, the cohomological witnesses, and the
  residual component of a concrete surface are geometric. The lattice
  arithmetic of isotropic sequences is pure linear algebra and mentions no
  geometry at all.

  Foundations (milestone #43) landed 2026-08-31/09-01: the definition, the
  line-bundle derived-object adapter, the numerical model, and the isotropic
  sequence root. The remaining three epics are blocked on the categorical
  exceptionality lane and on each other, in the order collection →
  exceptionality → semiorthogonal sequence and residual component.
goal:
  hmw: "How might we state and eventually prove the refined derived Torelli theorem for Enriques surfaces on top of the repository's single derived-category construction, without a second exceptionality hierarchy, a premature Kuznetsov-component equivalence, or geometry leaking into the categorical root?"
  objective: "Define Enriques surfaces and their semi-canonical ten-bundle configurations, bind the bundles to the generic exceptional-object interface through explicit cohomological witnesses, and assemble the semiorthogonal sequence whose residual component the source papers call Ku(Y)."
  key_results:
    - "IsEnriquesSurface is Prop-valued over supplied canonical-sheaf data, with both torsion clauses consumed by sheaf-level theorems and the char-2 exclusion documented rather than encoded."
    - "Every line bundle has a canonical perfect, bounded degree-zero avatar in D(Coh X) through one adapter, not per-consumer plumbing."
    - "The isotropic-sequence lattice root proves linear independence and the sum-vector identities behind Δ·F_i = 3 and Δ² = 10, with no symmetry hypothesis."
    - "Exceptionality of the ten bundles is a reduction to named cohomological inputs in the fields-not-theorems idiom, never a silent axiom."
    - "The residual component is stated through the generic semiorthogonal root and carries a neutral name until the identification with the papers' Ku(Y) is a theorem."
architecture_contract:
  policy: "docs/architecture/abstraction-tree.md"
  canonical_roots:
    surface_definition: "SmoothProperVariety + CanonicalSheafData, following the K3 pattern in AlgebraicGeometry/Surface/K3.lean"
    derived_category: "AlgebraicGeometry/DerivedCategory/Coherent.lean; the generic construction is Mathlib's DerivedCategory"
    semiorthogonal: "CategoryTheory/Triangulated/SemiorthogonalDecomposition/, the #852 root; exceptionality lands there via #932--#936"
    lattice: "LinearAlgebra/Lattice/, IntegralLattice namespace, bilinear maps into ℤ"
    line_bundles: "Scheme.Modules.LineBundleData; Pic X for torsion statements"
  prohibited:
    - "a second exceptionality or semiorthogonal carrier below algebraic geometry"
    - "a declaration named for the papers' Kuznetsov component before the identification is a theorem (ADR-0005 vocabulary discipline)"
    - "characteristic hypotheses as structure fields rather than per-theorem assumptions"
    - "ampleness or polarization claims: no such API exists, and clauses needing it enter as supplied data with the gap recorded"
