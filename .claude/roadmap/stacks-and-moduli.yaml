    status: planned
    priority: should
    size: L
    summary: "Castelnuovo–Mumford regularity on projective space over a field, with Castelnuovo's lemma. A coherent sheaf F on ℙⁿ_k is m-regular if Hⁱ(ℙⁿ, F(m−i)) = 0 for all i ≥ 1. If F is m-regular, then for every r ≥ m: (a) H⁰(𝒪(1)) ⊗ H⁰(F(r)) → H⁰(F(r+1)) is surjective; (b) F is r-regular; (c) F(r) is generated by finitely many global sections, and Hⁱ(F(r)) = 0 for i ≥ 1."
