  - id: stacks-and-moduli-stk1-5
    gh_issue: 1634
    kind: task
    parent: stacks-and-moduli-stk1
    title: "STK1.5: A local, pullback-stable object property of a stack cuts out a substack"
    status: planned
    priority: must
    size: M
    summary: "Let F : LocallyDiscrete Cᵒᵖ ⥤ᵖ Cat be a stack of categories for J, and let P : F.ObjectProperty be closed under isomorphisms and local for J. Local means stable under pullback, and such that an object whose pullbacks along a covering sieve satisfy P satisfies P. Then: P.fullsubcategory is a stack. This is the Mathlib TODO at Mathlib/CategoryTheory/Bicategory/Functor/Cat/ObjectProperty.lean:19. The core (maximal sub-groupoid) of a stack of categories is a stack in groupoids."
    labels: [area:moduli, type:feature, arch:data-model, upstream-candidate]
    blocked_by: [1624, 1630]
  - id: stacks-and-moduli-stk1-4
    gh_issue: 1636
    kind: task
    parent: stacks-and-moduli-stk1
    title: "STK1.4: Representable morphisms of stacks, natural in the test object"
    status: planned
    priority: must
    size: M
    summary: "A morphism f : F ⟶ G of stacks in groupoids is representable when two things hold: every fibre functor f.app T is faithful; for every S and y ∈ G(S), the presheaf on Over S of isomorphism classes of the fibre of f over y is representable. The fibre is that of the 2-fibre product (C/S) ×_{y, G, f} F, so the sections of the presheaf over T are the classes of pairs (x, φ : y|_T ≅ f(x))."
    labels: [area:moduli, type:feature, arch:data-model, arch:api-hygiene, upstream-candidate]
    blocked_by: [1626, 1633, 1635]
  - id: stacks-and-moduli-stk1-7
