  - id: stacks-and-moduli-stk1-8
    gh_issue: 1639
    kind: task
    parent: stacks-and-moduli-stk1
    title: "STK1.8: Representable morphisms of stacks are stable under base change and composition"
    status: planned
    priority: must
    size: M
    summary: "Representable morphisms of stacks in groupoids, in the natural sense of #1636, are stable under base change and composition: If f : X ⟶ Y is representable and g : Y' ⟶ Y is arbitrary, the second projection X ×_Y Y' ⟶ Y' is representable. It has the same representing objects, so it keeps every property P of the representing morphisms. If f : X ⟶ Y and g : Y ⟶ Z are representable, so is f ≫ g. It keeps P when P is stable under composition and respects isomorphisms."
    labels: [area:moduli, type:feature, upstream-candidate]
    blocked_by: [1633, 1636]
  - id: stacks-and-moduli-stk1-9
    gh_issue: 1640
    kind: task
    parent: stacks-and-moduli-stk1
    title: "STK1.9: The diagonal of a stack is representable exactly when its Isom sheaves are"
    status: planned
    priority: must
    size: S
    summary: "For a stack in groupoids X, the fibre of the diagonal X ⟶ X × X over a pair (x, y) of objects over S is the Isom sheaf of x and y (Stacks 04SI). Consequently: the diagonal is representable in the natural sense of #1636 exactly when every Isom sheaf is representable (Stacks 045G, (1)⇔(2)); #1636's HasRepresentableDiagonal, stated through Isom sheaves, is equivalent to representability of the diagonal morphism of #1633."
    labels: [area:moduli, type:feature, upstream-candidate]
    blocked_by: [1633, 1636]

