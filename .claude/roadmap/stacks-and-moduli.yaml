    priority: must
    size: M
    summary: "Flatness of a quasi-coherent module sheaf over a base is stable under base change, and it can be checked on affine opens. Precisely, for q : Y ⟶ T, h : T' ⟶ T and the base-change projection h' : Y ×_T T' ⟶ Y: if a quasi-coherent M : Y.Modules is flat over T in the sense of Scheme.Modules.IsFlatOver q, then (Scheme.Modules.pullback h').obj M is flat over T'. For quasi-coherent M, IsFlatOver q M holds iff Γ(U, M) is a flat Γ(V, 𝒪_T)-module for all affine opens U ⊆ Y, V ⊆ T with q(U) ⊆ V."
    labels: [area:algebraic-geometry, type:feature, prerequisite, ready]
