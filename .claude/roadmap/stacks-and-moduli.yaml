    summary: "Cohomology of the twisting sheaves on projective space over any ring, with its base-ring-linear structure. For a commutative ring R and a finite nonempty type n of homogeneous coordinates, N := |n| − 1: - H^0(ℙ(n; Spec R), 𝒪(d)) is the degree-d part of R[n] (zero for d < 0); - H^q(ℙ(n; Spec R), 𝒪(d)) = 0 for 0 < q < N and for q > N; - H^N(ℙ(n; Spec R), 𝒪(d)) is a finite free R-module, zero for d > −|n|."
