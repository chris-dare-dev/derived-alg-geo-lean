  # ------------ GM1 tasks ------------
  - id: stacks-and-moduli-gm1-1a
    gh_issue: 1698
    kind: task
    parent: stacks-and-moduli-gm1
    title: "GM1.1a: Quasi-coherent sheaves on a stack are cartesian sections of the quasi-coherent stack"
    status: planned
    priority: must
    size: M
    summary: "A quasi-coherent sheaf on a stack 𝒳 over a base scheme S is a *cartesian section* of the stack of quasi-coherent modules over 𝒳. It assigns to every S-scheme T and object x ∈ 𝒳(T) a quasi-coherent 𝒪_T-module F_x, with coherent isomorphisms f^* F_x ≅ F_{f^* x}. In the repository's carrier this is exactly a strong transformation 𝒳 ⟶ 𝒬_S into the quasi-coherent pseudofunctor on Over S, and a morphism is a modification."
    labels: [area:algebraic-geometry, area:moduli, arch:data-model, type:feature, prerequisite]
    blocked_by: [1647, 1631, 1637, 1638, 1632]
  - id: stacks-and-moduli-gm1-1b
