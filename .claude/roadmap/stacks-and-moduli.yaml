    status: planned
    priority: must
    size: M
    summary: "Cohomologically affine stacks and morphisms are the non-representable analogue of affineness, and half of the definition of a good moduli space. For stacks over a base scheme S: A quasi-compact algebraic stack 𝒳 is *cohomologically affine* if Γ(𝒳, -) is exact on QCoh 𝒳. This is Alper Def 3.6 in the form of Remark 3.7. A morphism f : 𝒳 → 𝒴 is *cohomologically affine* if 𝒳 ×_𝒴 h_V is a cohomologically affine stack for every affine S-scheme V and every V → 𝒴. This is the form of Alper's Corollary 3.12."
