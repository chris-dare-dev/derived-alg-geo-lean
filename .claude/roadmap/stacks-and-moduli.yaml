# The stacks-and-moduli plan (ADR-0014, drafted in MO2.1). gh_milestone and gh_issue are the
# live GitHub numbers assigned when the plan was filed on 2026-09-27.
schema: roadmap/1
slug: stacks-and-moduli
project: derived-alg-geo-lean
title: "Stacks and moduli — a stability-free substrate for the moduli theorems"
status: active
phase: sequenced
brief: |
  The owner-approved stacks-and-moduli plan of 2026-09-27, filed as milestones MO2, STK1-STK4, ASP1,
  DQ1, PJ1, GM1, GM2, MOD1-MOD3, ART1, SF13 and SF14 (SF9, milestone #30, is re-scoped and stays in
  stability-families.yaml). ADR-0014 (MO2.1) fixes owners and conventions: the carrier is
  StackInGroupoids over Mathlib's Pseudofunctor.IsStack, fibres live in independent universes,
  relative stacks are over Over S, representability is natural, and every moduli-of-objects stack is
  one construction. Hard theorems (0DLN algebraicity, AHLH existence, Quot representability) enter
  consumers as typed hypotheses over genuine definitions, never as fields, instances or roadmap statuses.
goal:
  objective: "Build stacks, descent, algebraic spaces and stacks, derived pushforward, projective morphisms, good moduli spaces and the moduli of sheaves and complexes as stability-free roots, then state and prove the BLMNPS/LLLMPSZ moduli consequences on them."
  key_results:
    - "Generic stacks and moduli never import the stability tree (MO2.2, MO2.3)."
    - "Representability, algebraicity and boundedness are natural notions with proved projections to the renamed pointwise records (MO2.4, STK1.4, STK3.1, STK3.4)."
    - "Coh_{X/S} and M_pug(X/S) are genuine stacks with representable diagonals, and M_pug's algebraicity is a typed proposition (MOD1, MOD2)."
    - "Good moduli spaces, the AHLH existence theorem and Theorem 22.2 are stated on genuine definitions (GM1, GM2, SF14)."
  wont:
    - "No algebraicity, descent, boundedness or properness result as a structure field, instance or roadmap status."
    - "No second stack carrier, fibred-category root or moduli-problem hierarchy."
    - "No derived moduli (Toën-Vaquié) construction."
generated_by: { agent: claude, at: "2026-09-27" }
generations:
  - { rev: 1, at: "2026-09-27", note: "Created with the filing of the stacks-and-moduli plan: one milestone entry per new milestone and one milestone-direct task per filed issue; blocked_by mirrors the native blocked-by links set at filing." }
