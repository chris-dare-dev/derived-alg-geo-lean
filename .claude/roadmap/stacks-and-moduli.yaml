    title: "STK1.6: Stacks in groupoids are categories fibred in groupoids; the 2-Yoneda lemma"
    status: planned
    priority: should
    size: M
    summary: "This issue connects stacks in groupoids to Mathlib's fibred categories and proves the 2-Yoneda lemma."
    labels: [area:moduli, type:feature, arch:coherence, upstream-candidate]
