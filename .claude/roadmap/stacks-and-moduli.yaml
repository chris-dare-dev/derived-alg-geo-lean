  # ------------ STK1 tasks ------------
  - id: stacks-and-moduli-stk1-2
    gh_issue: 1630
    kind: task
    parent: stacks-and-moduli-stk1
    title: "STK1.2: Being a stack is invariant under pseudonatural equivalence"
    status: planned
    priority: must
    size: M
    summary: "Let F G : LocallyDiscrete Cᵒᵖ ⥤ᵖ Cat.{v', u'} and let α : F ⟶ G be a strong transformation all of whose components (α.app X).toFunctor are equivalences of categories. Then: descent data map functorially along α; restriction to descent data commutes with α up to a natural isomorphism; F is a prestack (a stack) for J if and only if G is."
    labels: [area:moduli, type:feature, arch:coherence, prerequisite, upstream-candidate, ready]
    blocked_by: []
