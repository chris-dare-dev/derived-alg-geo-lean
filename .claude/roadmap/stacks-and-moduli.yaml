    size: M
    summary: "Given strong transformations α : F ⟶ H and β : G ⟶ H between pseudofunctors LocallyDiscrete B₀ ⥤ᵖ Cat, this issue builds their 2-fibre product Pseudofunctor.fiberProduct α β. Its fibre over X is Mathlib's categorical pullback (α.app X).toFunctor ⊡ (β.app X).toFunctor. It comes with: the two projections and the 2-commutativity isomorphism; the lift of any 2-commutative square; the relative diagonal F ⟶ fiberProduct α α;"
