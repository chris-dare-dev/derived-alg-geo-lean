    kind: task
    parent: stacks-and-moduli-gm1
    title: "GM1.1b: Morphisms descend along covering morphisms; global sections are an equalizer on an atlas"
    status: planned
    priority: must
    size: M
    summary: "Morphisms out of a stack can be computed on a cover. Let 𝒬 be a J-prestack of categories, and let u : 𝒰 ⟶ 𝒳 be a morphism of pseudofunctors that is *locally essentially surjective*: every object of 𝒳(T) becomes isomorphic to an image of u after pulling back along the arrows of some J-covering sieve. Then: restriction along u, Bicategory.precomp 𝒬 u : (𝒳 ⟶ 𝒬) ⥤ (𝒰 ⟶ 𝒬), is faithful; its image on morphisms is exactly the morphisms whose two pullbacks to the 2-fibre product 𝒰 ×_𝒳 𝒰 of #1632 agree."
    labels: [area:algebraic-geometry, type:feature, prerequisite, upstream-candidate]
    blocked_by: [1698, 1632, 1633, 1684, 1648, 1645, 1691, 1686]
