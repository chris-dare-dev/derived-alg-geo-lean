    status: planned
    priority: must
    size: S
    summary: "Hilbert polynomials are locally constant in flat projective families. Let S be locally Noetherian and i : X → ℙ(n; S) a closed immersion, with f := i ≫ (ℙ(n; S) → S), and let F be coherent on X and flat over S. For s ∈ S the fibre X_s is a closed subscheme of ℙ(n; κ(s)) through the base change i_s of i. Write P_s ∈ ℚ[X] for the Hilbert polynomial of F_s with respect to i_s^*𝒪(1) (#1682). Then s ↦ P_s is locally constant on S, and constant on a connected S (Hartshorne III.9.9, the direction \"flat ⇒ constant\")."
