    status: planned
    priority: should
    size: S
    summary: "A written verdict on how to prove, for schemes, that discrete valuation rings suffice in the valuative criteria over a locally Noetherian base. This is Stacks Section 32.15, four lemmas: - Stacks 0CM2 (Limits, Lemma 32.15.1): for f of finite type over a locally Noetherian Y, a point in the closure of the image of f is reached by a DVR, with the generic point mapping to a generic point of an irreducible component of X."
    labels: [area:algebraic-geometry, area:algebra, research, type:spike, ready]
    blocked_by: []
  - id: stacks-and-moduli-asp1-4
    gh_issue: 1656
    kind: task
    parent: stacks-and-moduli-asp1
    title: "ASP1.4: Valuative criteria for morphisms of algebraic spaces, and DVRs over a locally Noetherian base"
    status: planned
    priority: must
    size: L
    summary: "Valuative criteria for morphisms of algebraic spaces, and their Noetherian refinement with discrete valuation rings. For a morphism f : X ⟶ Y of algebraic spaces over S: - Definitions (67.41.1). The existence and uniqueness parts of the valuative criterion. As in Stacks, the existence part may pass to an extension K'/K with a valuation ring A' ⊆ K' dominating A. - They are stable under base change (03IY) and composition (03IZ)."
    labels: [area:algebraic-geometry, type:feature]
    blocked_by: [1653, 1655]
  - id: stacks-and-moduli-asp1-8
    gh_issue: 1657
    kind: task
    parent: stacks-and-moduli-asp1
    title: "ASP1.8: Global functions of an algebraic space, and maps to affine schemes (05Z1)"
    status: planned
    priority: must
    size: M
    summary: "The ring of global functions of an algebraic space, and the fact that morphisms into an affine scheme are ring maps into it (Stacks 05Z1). For an algebraic space X over S: - Global functions. Γ(X, 𝒪_X) is a commutative ring in CommRingCat.{u}, computed from any étale atlas U → X as the equalizer of Γ(U) ⇉ Γ(U ×_X U). It is contravariantly functorial, and on a scheme it is Γ(T, ⊤). - Maps to affine schemes."
    labels: [area:algebraic-geometry, type:feature]
    blocked_by: [1651]
  - id: stacks-and-moduli-asp1-5
    gh_issue: 1685
    kind: task
    parent: stacks-and-moduli-asp1
    title: "ASP1.5: Algebraic spaces are the algebraic stacks in setoids with an étale atlas (0432, 04SZ)"
    status: planned
    priority: must
    size: M
    summary: "Algebraic spaces are exactly the algebraic stacks in setoids that admit an étale atlas. This is the part of Stacks 04SZ that needs no slicing theorem. Precisely: Stacks in setoids are sheaves (Stacks 0432). A stack in groupoids whose fibres are setoids (thin groupoids) is equivalent to the discrete stack of its sheaf of isomorphism classes. This is site-generic. Spaces are algebraic stacks."
    labels: [area:algebraic-geometry, area:moduli, type:feature]
    blocked_by: [1651, 1684, 1636, 1630, 1635]

