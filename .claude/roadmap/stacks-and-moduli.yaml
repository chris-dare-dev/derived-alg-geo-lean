    status: planned
    priority: must
    size: L
    summary: "Morphisms representable by algebraic spaces, and their properties, at two levels."
    labels: [area:algebraic-geometry, type:feature]
    blocked_by: [1651, 1636]
  - id: stacks-and-moduli-asp1-3
    gh_issue: 1653
    kind: task
