    title: "ASP1.3: Points, open subspaces, and quasi-compact, separated, finite-type and proper morphisms of algebraic spaces"
    status: planned
    priority: must
    size: L
    summary: "The topological space of an algebraic space, its open subspaces, and the first properties of morphisms of algebraic spaces over S: - Points. |X| is the set of field-valued points Spec K → X up to common field extension (Stacks 03BU). Its topology is the quotient topology of any étale surjective atlas |U| → |X| (03BX, 03BY). For a scheme, |X| is the underlying space (03BV). A morphism from a scheme is surjective iff it is surjective on points (03H5). - Open subspaces."
    labels: [area:algebraic-geometry, type:feature]
    blocked_by: [1651, 1652]
  - id: stacks-and-moduli-asp1-6
    gh_issue: 1654
    kind: task
    parent: stacks-and-moduli-asp1
    title: "ASP1.6: Research: an étale atlas from a smooth one, for stacks in setoids (04SZ)"
    status: planned
    priority: should
    size: M
    summary: "A written verdict on how this repository will prove the remaining half of Stacks 04SZ. The statement is: a stack in setoids on (Over S, fppf.over S) whose diagonal is representable by schemes, and which has a smooth surjective atlas from a scheme, has an étale surjective atlas, hence is an algebraic space."
    labels: [area:algebraic-geometry, research, type:spike, ready]
    blocked_by: []
  - id: stacks-and-moduli-asp1-7
    gh_issue: 1655
    kind: task
    parent: stacks-and-moduli-asp1
