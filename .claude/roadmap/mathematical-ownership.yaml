schema: roadmap/1
slug: mathematical-ownership
project: derived-alg-geo-lean
title: Mathematical ownership and abstraction boundaries
status: active
phase: sequenced
brief: 'Structural companion to charge-abstraction CA1–CA3 (milestones 49–51), based on the 2026-09-13
  repository-wide ownership review at 9edfb9d6. It preserves the existing single charge kernel, separates
  foundations from comparisons/applications, and repairs the non-charge owners without duplicating SRF1,
  DG3, DT1 or SF8 theorem work. Source review: docs/reviews/2026-09-13-mathematical-ownership-review.md.
  Execution plan: docs/reviews/2026-09-13-mathematical-ownership-plan.md.'
goal:
  objective: Place independently reusable mathematics at its proper owner, retain canonical roots and
    explicit specialization/realization maps, and prevent foundations importing their applications.
  key_results:
  - All fifteen review findings have an implemented or explicitly reasoned disposition, linked to source
    and implementing PRs.
  - Charge construction precedes walls; neutral quadratic/lattice algebra and geometric Mukai interpretation
    have distinct owners.
  - Linear Serre/Yoneda, abelian stability, dg H0, derived operations, perfectness, GL cover and planar
    geometry have independently importable foundations.
  - CA1–CA3 retain their mathematical ownership and conditional root decisions; no formula, pairing or
    carrier is duplicated by moving a file.
  - Tracker, roadmap, imports, umbrellas, audits, source-owner checks and prescribed runner CI agree.
  wont:
  - No source refactor is implemented by the planning PR; proposed destinations are settled in MO1.01
    before cutover.
  - No global rank ordering of Mathlib subjects, no repository/library split, and no empty speculative
    abstraction carriers.
  - No automatic equivalence of numerical models with geometric realizations, kernel negativity with full
    support, ordinary H0 presentation with exact enhancement, or arbitrary loci with codimension-one manifolds.
  - No hidden strengthening of finite-Tor, Noetherian, HN, integrality, signature or exactness hypotheses.
  - No completion claim for unrelated mathematics in CA, SRF1, DG3, DT1 or SF8.
