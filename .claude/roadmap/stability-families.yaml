slug: stability-families
project: derived-alg-geo-lean
title: "Stability conditions in families — from absolute foundations to relative moduli"
status: active
phase: sequenced
brief: |
  Treat Bayer–Lahoz–Macrì–Nuer–Perry–Stellari, Stability conditions in
  families, arXiv:1902.08184v4, as a program-level north star rather than a
  single theorem milestone. The current repository has strong absolute and
  numerical foundations: group actions, the stability distance, an
  independently reviewed HRS t-structure, an abstract support-property lane,
  and numerical wall nesting away from the charge-zero locus. The repository
  now also owns the coherent-sheaf and derived-category substrate that had been
  tracked separately when this roadmap was first written.

  The repository still does not have all relative derived-category,
  boundedness, Quot, stack, or moduli infrastructure required by the paper.
  This roadmap lands the recovered absolute layer while advancing the paper's
  weak-stability/tilting spine, and keeps every remaining geometric dependency
  visible with an explicit in-repository or external owner.

goal:
  hmw: "How might we advance from an honest absolute Bridgeland foundation to stability conditions in families while making every geometric and moduli dependency explicit?"
  objective: "Formalize the reusable abstract spine of arXiv:1902.08184v4, recover the unfinished absolute proof chain, and establish typed cross-repository boundaries for the geometric and moduli program."
  key_results:
    - "The absolute stability topology no longer accepts HN-mass subadditivity as an external premise, and the recovered proof has current CI plus independent mathematical review."
    - "The HRS t-structure is reviewed, its heart is related to the textbook extension closure under explicit hypotheses, and §14 weak-stability tilting is formalized without geometric assumptions."
    - "Support is expressed by a genuine bundled quadratic form on semistable classes and has an explicitly separate uniform-in-families layer."
    - "The five conditions in Definitions 20.5 and 21.15 are represented separately; stable declarations bind useful categorical or geometric data, while vacuous-probe inhabitance checks (constant-true, full-locus, arbitrary-Prop) remain development-only scaffolding; genuine-input constant-family reindexings remain stable API."
    - "Every result mapped to this program is pinned to 1902.08184v4 and defaults to target/no-claim until its statement and proof have been reviewed."
    - "Coherent-sheaf and derived work is integrated through the monorepo's explicit package boundaries; Quot, boundedness, stack, and good-moduli work remains assigned to a named owner and is never hidden behind an axiom."
  assumptions:
    - tier: must
      text: "The dormant HN mass-triangle branch contains reusable correct mathematics after it is ported onto current main."
      validation: "The source history is preserved under archive branches. Destination migration PRs #218 and #219 carry the remaining reviewed mass/topology and H⁰-cokernel slices on v4.32.1."
    - tier: must
      text: "The Hom-orthogonal HRS aisles agree with the textbook cohomological formulation under hypotheses expressible at the pinned anchor."
      validation: "Validated in the source repository by PRs #76/#93/#97 and transferred with their history. The destination tracker records the tilted-heart extension work as closed issue #204."
    - tier: should
      text: "Useful relative-HN interfaces can be stated abstractly before the full geometric substrate exists."
      validation: "Require explicit type-level premises and concrete categorical or geometric realization for stable results. Logical inhabitance checks may live under Development but do not count as mathematical progress."
    - tier: should
      text: "Quot, algebraic stacks, and good-moduli foundations should be reusable beyond this paper."
      validation: "The parked cross-repo epic must select an upstream or separate-package owner before implementation begins."
  wont:
    - "No wholesale merge of origin/agent/hn-mass-triangle-chain; only reviewed current-main slices."
    - "No implementation may bypass the monorepo's subject boundaries under DerivedAlgGeo or introduce a hidden trust assumption."
    - "No placeholder axiom, sorry-backed instance, or vacuous structure to make a paper definition typecheck."
    - "No claim that ingestion in arXMCP establishes paper coverage or source-version identity."
    - "No claim of Theorems 22.2, 24.1, or 29.2 until their geometric, boundedness, and moduli prerequisites are formalized."
  evidence:
    - "arXiv:1902.08184v4 — authoritative paper version, 146 pages, Parts I–VI."
    - "PR #93 — independent declaration-by-declaration review of PR #76's HRS t-structure; owner dispositions recorded in issue #86."
    - "PR #97 — both Hom-orthogonal aisles connected to the textbook truncation formulation; issue #94 closed."
    - "Destination PRs #218–#223 — v4.32.1 ports of the remaining source PR stacks, with source PR/head provenance and fresh validation recorded in each PR."
    - "PR #101 — 1902.08184v4 source pin and zero-claim coverage map; all theorem promotions remain review-gated."
    - "The AlgebraicGeometry subject and destination B1–B5 milestones — geometric substrate and explicit HRR trust boundary."
    - "arXMCP bridgeland-stability notebook — paper present with 548 chunks; ingestion alone is not a source-binding claim."

