      - "The relative numerical K-group is a quotient of the existing K-theory/numerical spine, with connected-family and one-fiber tests."
      - "Semiorthogonal decomposition and exceptional-collection vocabulary has a generic categorical root with two inhabitants before the projective-family leaf consumes it."
      - "Appendix B's almost-disconnected morphism and filtration property are geometric roots independent of the stability leaf."
      - "DG3 proceeds on its own milestone; PF1 records the seam but does not block on it."
      - "Zero sorries; relevant gates and runner verification are green."

