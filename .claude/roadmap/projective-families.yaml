  - { rev: 26, at: "2026-09-03", note: "Nineteenth slice of #1033, the categorical Theorem 2.8(3): semistability is detected by base change. The coaisle of a compactly generated t-structure is closed under coproducts (TStructure.IsCompactlyGeneratedBy.isGE_one_coproduct, CompactlyGenerated/Coaisle.lean: a map from a compact generator into a coproduct is a finite sum of maps into the summands, and right orthogonality passes to the coproduct-and-extension closure), an object is semistable of phase φ exactly when its HN phases are at least φ and below every ψ > φ (Slicing.semistable_iff_geProp_ltProp, Slicing/CoreConsequences.lean, the first file downstream of all of phiPlus/phiMinus, geProp_of_semistable and semistable_of_phiPlus_eq_phiMinus), so with the Ind-extensions, whose aisles are closed under coproducts by Lemma A.14(i), E is semistable of phase φ iff a nonempty coproduct of copies of it lies in the aisle of τ̂'_φ and the coaisles of τ̂'_ψ for ψ > φ (Slicing.IndExtensions.semistable_iff_isLE_zero_and_isGE_one_of_iso_coproduct, Phase/Transfer/BaseChange.lean, forward by closure under coproducts and backward by closure under retracts), which constrains the coproduct only as an object of D, and when the coproduct itself lies in Q the two conditions reassemble into semistability there (semistable_iff_semistable_of_iso_coproduct), hence for the preimage slicing along F on F⁻¹ Q, E is semistable iff L E is when F L E is a nonempty coproduct of copies of E (semistable_iff_preimage_of_coproduct; no adjunction is used, only the isomorphism, and semistability on the right is that of F L E by definition of the preimage slicing): the categorical Theorem 2.8(3) with F = π_*, L = π^*, π_* π^* E = E ⊗_k ℓ, for a FINITE extension. For an infinite one E ⊗_k ℓ is not coherent, so hQL cannot hold at E and both Q-level statements are vacuous; what the still-open large-target statement of rev 25 will consume is the D-level reduction together with isLE_zero_coproduct and isGE_one_coproduct, none of which mention Q. Coproducts are indexed by Type, as IsCompactObject.exists_finite_sum is. Next in §3.3: Lemma 3.10(1.a), the equivalence of (3.3) and (3.4) under base change, which combines this with Theorem 2.8(1) at Ind-extension level." }
  - { rev: 27, at: "2026-09-03", note: "Twentieth slice of #1033, the last purely categorical piece of Theorem 2.8(1) at the level of the phase-indexed t-structures: Corollary A.23 with recognition against the large target. Slicing.IndExtensions.largePhase (Phase/Transfer/IndExtensions.lean) is the phase collection of the Ind-slicing in the ambient category, the aisle of tau_phi cut against the coaisles of tau_psi for psi > phi; largePhase_iff_semistable identifies it with s.P on Q (both halves Lemma A.14(iii), reassembled by semistable_iff_geProp_ltProp of rev 26). Note the primed/unprimed distinction: Theorem 2.8(1) states its recognition on the cuts of the unprimed tau_phi, while IndExtensions carries the primed family that Corollary A.23 uses, and largePhase is the intersection of the primed cuts. Slicing.IndExtensions.InducedTStructuresLarge (Phase/Transfer/Inducing.lean) is the large-target twin of Slicing.InducedTStructures: formulas (A.8) against tau_phi with no target subcategory, so it is statable where s.geProp and s.ltProp are not, which for an arbitrary field extension is everywhere outside Q. Unlike the bounded twin it also carries Step 4 boundedness, which the bounded twin can drop because it never truncates on the source. Its hom_vanishing, stated on the pulled-back collection largePreimagePhase, is shorter than the bounded twin's because largePhase already carries coaisle membership at every psi > phi, so no target HN filtration is needed; ofIso transports it along a natural isomorphism, and toInducedTStructures / ofInducedTStructures make it interderivable with the bounded shape whenever the detecting functor factors through Q (the converse direction must be handed boundedness), so it extends rather than competes. nonempty_inducedTStructuresLarge is Corollary A.23 in that shape, on Polishchuk.induceLarge of rev 25 at every phase. Its hbdd (F sends P into the tau_phi-bounded objects) is the one hypothesis this shape adds over nonempty_inducedTStructures_of_le, which bought it from hle; for F = pi_* it is the descent to a finite subextension of Remark A.12(3), and it JOINS rather than replaces hzero, hG/htC and htrunc on the list of geometric inputs still open for pi. Assembling the output into a Slicing is the accounting of Slicing.PreimageData with one entry moved: closure under isomorphisms and zero membership are still formal, hom_vanishing is now supplied, and two are open -- the shift law, since there is no slicing on D to borrow it from and IndExtensions relates two phases only by the aisle inclusion le_zero_anti (never by the shift), so Phat(phi) shifted by one equals Phat(phi+1) needs a coprodClosure shift equality the repository does not have; and HN existence for largePreimagePhase, which cannot be got the bounded twin's way (Slicing.InducedTStructures.hn_exists lifts a TARGET HN filtration and the ambient category carries no slicing) and needs the finite phase-truncation argument run on the source. Also in this slice: rev 26's semistable_iff_isLE_zero_and_isGE_one_of_iso_coproduct is renamed semistable_iff_largePhase_of_iso_coproduct and restated through largePhase, the normal form, which did not exist when rev 26 landed; there is one name for that statement, not two. Next: the shift law and the HN half, after which Theorem 2.8(1) closes categorically; then Lemma 3.10(1.a)." }
