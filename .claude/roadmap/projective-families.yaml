brief: |
  This track maps arXiv:2607.28411v1 onto the mathematics already present in
  DerivedAlgGeo and starts only the missing, non-overlapping roots. The paper
  is not a blank-slate moduli project: Appendix A, relative HN interfaces,
  relative-perfect objects, a groupoid-valued moduli problem, Big-Zariski
  stack data, boundedness witnesses, Quot presentations, and much of the
  absolute stability foundation already exist.

  The track has two trunks. The paper-critical trunk is classical:
  relative-perfect and universally-gluable complexes lead to a groupoid-valued
  moduli problem, open bounded semistable substacks, semistable reduction, and
  good moduli. The dg-enhancement trunk is parallel, not a logical gate on the
  paper. It meets the classical trunk at perfect complexes and negative Ext:
  the future derived moduli object is expected to have a universally-gluable
  one-truncated locus whose classical truncation is the existing moduli stack.

  Every milestone follows `docs/architecture/abstraction-tree.md`. Shared
  capabilities move upward before paper-specific leaves are added. No item
  may introduce `KLinearCategory`, a sibling Grothendieck presentation, a
  stability-owned generic stack, or a conclusion carried as a structure field.
goal:
  hmw: "How might we complete the prerequisites of arXiv:2607.28411 by joining its top-down construction to the repository's existing bottom-up roots, without producing a second category, K-group, derived category, or moduli hierarchy?"
  objective: "Build the canonical relative numerical K-group, categorical transfer and semiorthogonal roots, neutral scheme-derived substrate, and classical moduli spine needed for Theorems 9.1 and 10.3; then assemble the absolute and relative projective-family constructions while the dg-derived enhancement proceeds independently."
  key_results:
    - "Definition 8.17 is represented by an inhabited geometric interface whose four conditions are theorems or explicit hypotheses at the correct layer."
    - "The relative numerical K-group of Definition 8.7 is a saturated quotient of the canonical numerical K-theory spine and has the functoriality of Proposition 8.10."
    - "Theorem 9.1 consumes one generic adjoint/exact transfer spine rather than separate absolute and relative copies."
    - "The algebraic `(P¹)^n` seed, transfer to `P^n`, and pullback to projective `X` culminate in Theorems 6.2, 6.8, and 10.3."
    - "The existing relative-perfect moduli work is completed through standard descent, algebraicity, semistable reduction, and good-moduli properness without overstating the current Big-Zariski presentation layer."
    - "The dg enhancement has a proved classical derived seam, but no paper-critical milestone waits for derived moduli foundations."
architecture_contract:
  policy: "docs/architecture/abstraction-tree.md"
  canonical_roots:
    ordinary_linear: "Mathlib CategoryTheory.Preadditive and CategoryTheory.Linear"
    dg_linear: "CategoryTheory.DGCategory plus DGLinear as a refinement"
    grothendieck: "CategoryTheory.GrothendieckPresentation with K₀Ab, K₀, and K₀dg specializations"
    stacks: "generic CategoryTheory.Sites/descent roots; AlgebraicGeometry supplies scheme-site leaves"
    derived_geometry: "neutral AlgebraicGeometry derived-category modules; stability families are consumers"
  required_review:
    - "Name the canonical root and its neutral owning module."
    - "Name two consumers or the statement-layer exception."
    - "Provide a projection, instance, abbreviation, or proved comparison."
    - "Prove agreement when the target already has an instance."
    - "Record and retain counterexamples to false generalizations."
  prohibited:
    - "paper-specific roots imported by generic subjects"
    - "parallel Grothendieck presentations or K-linear category hierarchies"
    - "algebraicity, preservation, descent, boundedness, or properness represented by unproved conclusion fields"
