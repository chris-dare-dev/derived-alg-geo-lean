  - id: projective-families-e7
    gh_issue: 1033
    gh_sub_issues: []
    kind: epic
    parent: projective-families-m3
    title: "Absolute scalar base change and stability transfer"
    status: in_progress
    priority: must
    size: XL
    summary: "The categorical half of §3 landed first: Definitions 3.1(2)--(3)/3.6(2)--(3) as one transfer operation on PreStabilityCondition.WithClassMap and StabilityCondition.WithClassMap with class map v ∘ K₀(F), conservativity derived from Slicing.PreimageData, support-property and local-finiteness transfer (Remarks 3.2/3.7), extreme phases and the slicing distance under transfer (Lemmas 3.5/3.9), and the two-witness slicing-order transfer (arXiv:2601.22994 Lemma 3.3). The second slice adds the twist/Bayer/metric layer (Lemma 3.5(1)/3.9(1) in full with the transported lifting witness, the Bayer property under transfer as used by Lemma 3.25, the mass and three-coordinate stability distance under transfer) and the Dᵇ(Coh) realization of f_♯σ along bounded coherent pullback, from an explicit witness or from the A.17 output. The third and fourth slices add the categorical Proposition 3.8: the adjoint transposition of condition (3.2) into the Corollary A.23 hypothesis, and Corollary A.23 itself as the joint between the owned Theorem A.17 (Polishchuk.induce) and the finite phase-truncation argument, from Definition A.22 data. The sixth and seventh slices are geometric: the direct image f_* on Dᵇ(Coh) along a finite morphism (Coh.pushforward, exact by affine-pushforward exactness on quasi-coherent sheaves; the HasCoherentPushforward contract inhabited by every finite morphism; boundedCoherentDerivedPushforward through mapDerivedCategory) and the realization of f^♯σ along it from an explicit witness or the A.17 output. Still open: the geometric inputs of Propositions 3.3/3.8 (Ind-extensions of the standard slicings inside Dqc, the adjunctions f_! ⊣ f^* ⊣ f_* on Dqc), Lemma 3.10 base-change compatibility, and the §2.2 scalar extension."
    tags: [stability, base-change, transfer]
    labels: [area:lean, area:stability, type:feature, source:2607.28411, source:2601.22994]

