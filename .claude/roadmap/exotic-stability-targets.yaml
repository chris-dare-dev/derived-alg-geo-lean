items:

  # ---------------------------------------------------------------- order 1
  - id: exotic-e3-lean
    kind: milestone
    title: "E3-LEAN — The signature-(1,k) divisor space, the wall quadric, and isometry equivariance at arbitrary Picard rank"
    status: proposed
    lane: now
    order: 1
    priority: must
    size: M
    summary: >
      Runs FIRST and is ungated by any research verdict. Owns the shared
      arbitrary-rank Lorentzian root that four Lean milestones independently
      proposed: a time-cone and reverse-triangle-inequality layer on a
      HodgeDefinite DivisorSpace, then DiagonalSpace k with
      hodgeDefinite_diagonal proved for ALL k by Cauchy-Schwarz on the
      negative-definite part — explicitly NOT by generalizing the
      three-variable nlinarith at Examples/Surface/BlowUpPlane.lean:627, which
      does not scale. Then the wall quadric in the divisor variable with its
      eigenvalue signature, and equivariance of the quadric family under
      form-preserving reflections. Modules: LinearAlgebra/BilinearForm/
      Lorentzian.lean (umbrella) + Lorentzian/TimeCone.lean +
      Lorentzian/Diagonal.lean; Walls/Divisorial/DivisorQuadric.lean;
      Walls/Divisorial/Equivariance.lean (consuming exotic-e2-lean's reflection
      once that lands, or a local isometry hypothesis until then);
      Examples/Surface/BlowUpPlaneIteratedWalls.lean.
      The falsifiable arithmetic check: instantiate wallQuadratic at k = 2 with
      Mizuno-Yoshida Remark 3.17's normalised H, G_1, G_2 and reproduce all
      three printed wall equations.
    acceptance:
      - "hodgeDefinite_diagonal is proved for all k with no case split on small k, and an example rederives Examples.BlowUpPlane.hodgeDefinite from it without editing that file's own proof."
      - "The wallQuadratic instantiation at k = 2 reproduces all three printed equations of Mizuno-Yoshida Remark 3.17 and yields E_i^2 = -1 for each. Failure to reproduce them falsifies the lemma and the milestone stops."
      - "The two LinearAlgebra modules import no stability-condition application, preserving the geometry firewall."
      - "No declaration named DelPezzo, MinusOneCurve, WeylGroup, RootSystem, MizunoYoshida, ArcaraMiles, Makela or Bousseau outside docstrings and bibliography comments."
      - "Zero sorries; check_layering.py, check_umbrella_coverage.py, check_coverage_map.py, check_audit.py, check_audit_complete.py pass; runLinter and lint-style clean; CI green on the self-hosted runners."
    supplied_data:
      - "That H, E_1, ..., E_k are the numerical divisor classes of an iterated blow-up of the plane and (3,-1,...,-1) is its anticanonical class."
      - "That IsMinusOneClass integral classes are represented by irreducible rational curves generating the effective cone."
      - "The (-1)-class cardinalities 6, 10, 16, 27, 56, 240 for k = 3..8. Finiteness IS proved here; the exact counts are not."
      - "That K-perp is the root lattice A_1, A_1+A_2, A_4, D_5, E_6, E_7, E_8 for k = 2..8. Mathlib has RootPairing.ofBilinear and weylGroup but no E_k classification."
      - "The ample cone, as a supplied predicate, following DivisorialParameters."
    tags: [lorentzian, wall-quadric, picard-rank, shared-root]
    labels: [area:lean, area:algebra, area:stability, type:feature]

  # ---------------------------------------------------------------- order 2
  - id: exotic-e5-rd
    kind: milestone
    title: "E5-R&D — Settle Serre-invariance of sigma_{omega,beta} on a torsion-canonical surface, and assemble the bielliptic data sheet"
    status: proposed
    lane: now
    order: 2
    priority: must
    size: S
    summary: >
      THE CHEAPEST KILL IN THE SET, and it is expected to fire. Step 1 is a
      three-line argument: on a smooth projective surface with c_1(omega_X) = 0
      in Num(X), ch(omega_X) = 1 preserves Z_{omega,beta} exactly and
      omega.c_1(omega_X) = 0 preserves the mu-torsion pair, so
      (- tensor omega_X) fixes sigma_{omega,beta} on the nose and S_X acts
      exactly as [2]. That ANSWERS the session's question — yes,
      sigma_{omega,beta} is Serre-invariant on Enriques and bielliptic surfaces
      — and it is almost certainly folklore. The milestone's real job is to
      decide whether it is PUBLISHED, and to attempt the sharp version: is the
      Serre-invariant locus ALL of Stab(S)? Also: falsify the applicability of
      Feyzbakhsh-Pertusi arXiv:2109.13549 Theorem 3.2 by computing its three
      conditions (k/r = 2 fails 0 < k/r < 2); read Macri-Mehrotra-Stellari
      arXiv:0705.3752, Nuer arXiv:2107.13370, Tochitani arXiv:2603.29471; and
      assemble Serrano's Num(S) = Z.A0 + Z.B0 with the hyperbolic form, the
      seven Bagnera-de Franchis types, and a hand computation of
      DivisorSpace.HodgeDefinite on the hyperbolic plane in the exact shape
      HodgeIndex.lean demands, transcribable line by line.
      Consumes Theorem A from .claude/notes/2026-09-19-net-new-results-scoping.md.
    acceptance:
      - "A proof, at most three pages, of the sigma_{omega,beta} invariance, with the heart-preservation step spelled out at the level of the torsion pair."
      - "An explicit citation for the observation, OR a written list of the sources searched and read IN FULL — at minimum Macri-Mehrotra-Stellari, Nuer, Tochitani."
      - "A written verification that Feyzbakhsh-Pertusi Theorem 3.2 conditions (C1), (C2), (C3) each fail, with the rank computations printed."
      - "A YES / NO / OPEN verdict on 'is the Serre-invariant locus all of Stab(S)', naming the blocking fact if OPEN. OPEN is an acceptable outcome; an absent verdict is not."
      - "A one-page bielliptic data sheet in which every number traces to a numbered statement or table row, plus the hand HodgeDefinite computation."
      - "A recorded negative note: a rank-one polarisation slice of a bielliptic surface is numerically INDISTINGUISHABLE from the abelian one (td_1 = 0, integral td_2 = 0 for both). This is what forces the rank-two carrier in exotic-e5-lean."
    kill_criteria: >
      ABANDON THE RESEARCH HALF AND KEEP THE LEAN HALF if step 3 finds the
      invariance statement already published with a proof. ABANDON THE NOVELTY
      CLAIM ENTIRELY if a colleague reads step 1 and calls it an exercise —
      which is the expected outcome. The Lean half survives either way.
    tags: [bielliptic, torsion-canonical, serre-invariance, cheapest-kill]
    labels: [area:research, area:geometry, type:investigation]

