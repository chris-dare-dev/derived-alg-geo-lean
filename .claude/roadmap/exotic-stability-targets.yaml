      - "chi(O_S) = 0 and c_2(S) = e(S) = 0, which is what makes biellipticTodd = (1,0,0)."
      - "q(S) = 1, mirroring IsEnriquesSurface's h1_vanishing field — this is what makes a bielliptic surface not an Enriques surface at the geometric layer."
      - "Bogomolov-Gieseker nonnegativity on the wall locus, already the repository's supplied input per Support/Divisorial.lean."
    tags: [bielliptic, hyperbolic-lattice, invariance-predicate, shared-root]
    labels: [area:lean, area:geometry, area:stability, type:feature]

  # ---------------------------------------------------------------- order 4
  - id: exotic-e2-rd
    kind: milestone
    title: "E2-R&D — Pin down the rank-zero spherical stratum of a weak del Pezzo, and survive the F_0 = F_2 lattice collapse"
    status: proposed
    lane: now
    order: 4
    priority: must
    size: M
    summary: >
      The one target with LOW collision risk: arXiv abstract searches for
      "weak del Pezzo" AND "stability conditions", and for "rational surface"
      AND "spherical object", return nothing relevant, and the complete
      2023-2026 "weak del Pezzo" listing contains no stability paper. But the
      scout sharpened the target in two ways that must be settled before any
      Lean. (a) The open statement is about RANK-ZERO spherical objects: every
      2-spherical object on a surface with K_X not numerically trivial should
      have rank 0 and class (0, Delta, s) with Delta an effective root — so the
      spherical objects are exactly those supported on the (-2)-configuration.
      (b) A lattice collapse: F_0 = P^1 x P^1 and F_2 = Sigma_2 are
      INDISTINGUISHABLE in the numerical lattice — setting f_1 = f, f_2 = s + f
      gives -K_{F_2} = 2f_1 + 2f_2 = -K_{F_0}, the same vector in the same
      lattice — so effectivity of the roots, not the lattice, is what separates
      weak del Pezzo from del Pezzo. That negative fact is the milestone's most
      valuable output and it directly shapes exotic-e2-lean's supplied data.
      STEP 2 IS A HARD GATE on everything downstream: is Mukai.RealExtension
      (a symmetric R + V + R) the right ambient for a NON-Calabi-Yau surface,
      given the chi(O_X) correction term?
    acceptance:
      - "A complete proof or explicit refutation of (i) Ext^*(O_C(-1),O_C(-1)) = k + k[-2] for a (-2)-curve, and (ii) 'K_X not numerically trivial implies every spherical object has rank 0'."
      - "The identity -(chi(E,F)+chi(F,E))/2 = <v,w>_Mukai - r.r'.chi(O_X) is confirmed AND checked against BlowUpPlane.chi on at least five explicit classes, or refuted with the correct formula written down. An explicit GO or NO-GO on Mukai.RealExtension as the carrier."
      - "The union over s of H(0,Delta,s) written out in the exact sign convention of pairingRe_of_rk_eq_zero, with a proof or disproof that it equals {q(Delta,omega) = 0}."
      - "The explicit basis change f_1 = f, f_2 = s + f exhibiting -K_{F_0} = -K_{F_2} in one hyperbolic lattice, plus a table of {Delta in K-perp : Delta^2 = -2} for Bl_n P^2, n = 2..8."
      - "Each of sub-targets (1), (2), (3) and the nodal-Enriques bonus carries an explicit PURSUE / RESTATE-AS / DROP verdict."
      - "Ohmiya arXiv:2601.01063 read IN FULL and assessed for overlap, not merely listed. It is a named abandon criterion for both this target and E1, and nobody in the project has read past its abstract."
    kill_criteria: >
      ABANDON if step 2 shows the Todd / chi(O_X) correction makes the correct
      ambient something other than an R + V + R with a symmetric form — the
      whole Walls/Spherical and Mukai.RealExtension reuse story then collapses,
      and exotic-e2-lean modules 3-5 are ill-posed and do not start.
    tags: [weak-del-pezzo, spherical-rank-zero, lattice-collapse, gate]
    labels: [area:research, area:geometry, type:investigation]

  # ---------------------------------------------------------------- order 5
  - id: exotic-e2-lean
    kind: milestone
    title: "E2-LEAN — The rank-zero spherical stratum, the root-hyperplane arrangement, and the del-Pezzo/weak-del-Pezzo lattice indistinguishability"
    status: proposed
    lane: next
    order: 5
