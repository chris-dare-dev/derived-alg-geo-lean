  # ---------------------------------------------------------------- order 9
  - id: exotic-e4-rd
    kind: milestone
    title: "E4-R&D — Fix the construction, the charge lattice and the first explicit walls for P(a,b,c)"
    status: proposed
    lane: later
    order: 9
    priority: should
    size: L
    summary: >
      The chamber description for P(a,b,c) is genuinely not in print, but the
      session's framing was half wrong in a way that matters. For the ADE case
      (P(1,1,2)) the construction exists (Lim-Rota arXiv:2001.09139) and the
      description is probably a transport of the F_2 picture along derived
      McKay — a corollary, not a theorem. For P(1,1,n) with n >= 3 the coarse
      singularity 1/n(1,1) is NOT Gorenstein and it is not established that ANY
      published construction covers it. Answer that first. The decisive
      question is the charge lattice: K_0(P(a,b,c)) is free of rank a+b+c (from
      the Auroux-Katzarkov-Orlov collection), while the repository's surface
      charge is rank 3, so the rank-3 charge is very likely the WRONG lattice —
      and SatisfiesHRR is FALSE for P(a,b,c) whenever a+b+c > 3, because
      chi(O(k)) is quasi-polynomial in k with period lcm(a,b,c) while HRR
      demands a degree-2 polynomial. Both need proving, not asserting; the
      scout listed the quasi-polynomiality under claims-it-could-not-verify.
    acceptance:
      - "The orbifold Bogomolov-Gieseker inequality of arXiv:2001.09139 fixed by theorem number, with an unambiguous statement of whether its discriminant uses ordinary stacky Chern classes or Chen-Ruan classes."
      - "A table for P(1,1,n), n = 2..6 and P(1,2,3), P(1,2,5), P(2,3,5): coarse singularity type, age spectrum, whether the Chen-Ruan grading is integral, rk A^*()_Q = 3, rk K_0 = a+b+c, and which published construction covers it."
      - "Explicit Euler-form Gram matrices for P(1,1,2) and P(1,1,3) in the basis (O, O(1), ..., O(a+b+c-1)), cross-checked against rank-nullity of the map to (rank, int H.ch1, int ch2)."
      - "Hand computation, independently reproduced by Macaulay2 or Sage, of the numerical walls in the (beta,alpha) half-plane for at least two classes on each of P(1,1,2) and P(1,1,3), each written as an explicit circle or line."
      - "An explicit YES/NO sentence: can the wall/chamber statement for P(a,b,c) be made against a rank-3 charge, or does it require a rank-(a+b+c) charge?"
      - "A dated arXiv re-check with the search queries recorded so the check is repeatable, covering the pages of Rota, Liu, Shen, Nimura and Gomez Saltachin (arXiv:2606.18238)."
    kill_criteria: >
      Abandon or sharply renarrow if step 1 finds arXiv:2001.09139 already
      contains the (beta,alpha) chamber decomposition in a section not
      reflected in its abstract, or if no published construction covers
      P(1,1,n) for n >= 3 and none is within reach.
    tags: [weighted-projective, orbifold, charge-lattice, weakest-evidence]
    labels: [area:research, area:geometry, type:investigation]

