    acceptance:
      - "hodgeDefinite_of_hyperbolic compiles with no sorry and BiellipticWalls.lean discharges HodgeDefinite through it rather than assuming it — verified by grep, not by intent."
      - "grep -rni 'serreinvariant|serre_invariant' over DerivedAlgGeo/ returns zero hits after the milestone lands, and SerreInvariance.lean's Z-surjectivity input is an explicit hypothesis binder, not an axiom and not an instance."
