brief: |
  Six targets in Bridgeland stability theory outside the Enriques /
  Serre-invariance thread, each carrying one R&D milestone (what must be
  settled on paper) and one Lean milestone (what the library can honestly
  carry at its pin). Scoped 2026-09-19 by six parallel literature-and-
  substrate scouts plus one deconfliction critic.

  The six: E1 the cell decomposition of Stab-dagger of a del Pezzo surface;
  E2 weak del Pezzo surfaces as a spherical-object problem; E3 the
  (-1)-curve wall arrangement on dP_k and its Weyl symmetry; E4 weighted
  projective planes and Kleinian orbisurfaces; E5 bielliptic surfaces and the
  torsion-canonical family; E6 the stability space of a local del Pezzo.

  NOT ONE OF THE SIX IS A CLEAN OPEN PROBLEM. Every scout returned
  PARTIALLY-OPEN, and three returned a verdict that materially shrinks its own
  target. Those verdicts are recorded per item rather than smoothed over,
  because the value of this roadmap is mostly in what it stops the repository
  from starting.

  WHAT THE SCOUTS FOUND THAT THE SESSION DID NOT KNOW:

  * Makela arXiv:2608.26080 (26 August 2026) proves the effective-divisor
    Arcara-Miles conjecture for EVERY smooth projective surface. That is
    strictly more general than the half of Mizuno-Yoshida arXiv:2502.18894
    that E3 sub-target (2) proposed to extend. E3 sub-target (2) is
    essentially closed twenty-four days before this scoping ran.
  * E5's headline question — is sigma_{omega,beta} Serre-invariant on an
    Enriques or bielliptic surface — is answered YES by a three-line argument:
    omega_X torsion gives ch(omega_X) = 1 and omega.c_1(omega_X) = 0, so the
    twist fixes both the central charge and the mu-torsion pair, hence fixes
    sigma_{omega,beta} on the nose. Easy is not a result. What remains open is
    the global statement: is EVERY sigma in Stab(S) Serre-invariant?
  * E6's collision is worse than suspected. Bridgeland and Giovenzana (the
    correct spelling; earlier session notes said "Giovenazza") are two of the
    three authors of arXiv:2412.08531, which is already about invariant
    stability conditions on omega_Z for Z a del Pezzo — and Bousseau's
    acknowledgement names exactly those two as the source of his question.
  * Bayer-Macri arXiv:0912.0043 section 1.7 page 6 explicitly poses the other
    local del Pezzos as open, so E6 is a stated open problem with a named
    group already inside it.
  * Mathlib at the pin HAS `Convex.contractibleSpace`
    (Mathlib/Analysis/Convex/Contractible.lean:34) and
    `StarConvex.contractibleSpace` (:25), which makes E1's algebraic-cell
    module cheap. Mathlib at the pin has NO braid group.
  * Also new to the project: Tochitani arXiv:2603.29471 (generators of
    Aut(D^b X) for bielliptic surfaces), Piskunov arXiv:2607.18918 (moduli on
    bielliptic surfaces), Gomez Saltachin arXiv:2606.18238 (exceptional
    collections for canonical stacks of log del Pezzo with 1/3(1,1)).

  SHARED ROOTS, AND WHO OWNS THEM. The critic found four pieces of substrate
  that more than one Lean milestone proposed to build, including one hard path
  collision. Ownership is assigned once here and every other item consumes:

  * Arbitrary-rank Lorentzian reverse Cauchy-Schwarz (HodgeDefinite for
    diag(1,-1,...,-1)) — proposed independently by FOUR Lean milestones.
    OWNER: exotic-e3-lean, under LinearAlgebra/BilinearForm/Lorentzian/.
    It is the only spec that states the correct proof route (Mathlib
    Cauchy-Schwarz on the negative-definite part) rather than hoping the k=2
    three-variable `nlinarith` at Examples/Surface/BlowUpPlane.lean:627
    generalizes, which it does not.
  * The arbitrary-rank blow-up numerical model (ring in Models/, walls in
    Examples/). OWNER: exotic-e1-lean, as BlowUpPlaneRank.lean and
    BlowUpPlaneRankWalls.lean. It is the only spec that schedules the RingEquiv
    agreement lemma back to the existing bespoke five-field
    Examples.BlowUpPlane.Ring. e2's BlowUpPlaneN.lean and e6's DelPezzo.lean /
    DelPezzoWalls.lean are DROPPED as duplicates of it; this also resolves the
    naming collision in which e1's acceptance grep bans `DelPezzo` while e6
    proposed a module of that name.
  * Reflection at a (-2)-class as a lattice isometry, bridged to Mathlib's
    root-system API. OWNER: exotic-e2-lean, under LinearAlgebra/RootSystem/.
    Verified at the pin: Mathlib/LinearAlgebra/RootSystem/OfBilinear.lean:49
    `IsReflective.of_dvd_two` exists and -2 divides 2.
  * An invariance-of-a-stability-condition-under-an-autoequivalence predicate.
    Verified absent repository-wide. OWNER: exotic-e5-lean, as
    `AutPair.IsInvariant` — and it correctly refuses the name `SerreInvariant`,
    because the identification of (- tensor omega_X)[2] with the Serre functor
    is not a theorem in this repository.
  * The rank-zero branch of the spherical wall layer. Verified genuinely
    missing: `0 < delta.1` is a live hypothesis at
    Walls/Spherical/Finiteness.lean:103, 116, 133, 167, 252.
    OWNER: exotic-e2-lean, as Walls/Spherical/RankZero.lean.
  * The hyperbolic ring currently buried in Examples/Surface/SmoothQuadric.lean.
    OWNER: exotic-e5-lean, which EXTRACTS it to Models/Surface/HyperbolicPlane.lean
    and rewrites SmoothQuadric.lean to import it. This must land BEFORE
    exotic-e2-lean adds declarations to that same file.

  AN INDEX-SET PROBLEM NOBODY OWNS. The wall-finiteness layer counts SPHERICAL
  classes (`IsSpherical q delta := selfPairing q delta = -2`,
  Walls/Spherical/Basic.lean:259). On a Fano surface the expected destabilizers
  are EXCEPTIONAL, not spherical, so a spherical wall count there may be a
  finite upper bound for an empty set. e4 and e6 both recorded this; e1 and e6
  both instantiate the layer on a Fano WITHOUT carrying the caveat. Every item
  that instantiates spherical wall finiteness on a del Pezzo must state in its
  module docstring what the count is a count of.

goal:
  hmw: "How might we turn six adjacent, partly-occupied research targets into a sequence the repository can execute, without building the same Lorentzian lemma four times, without naming a declaration for a paper concept the repository cannot prove, and without spending a year on the two targets a competing group is already inside?"
  objective: "For each of six targets, settle on paper what is actually open and what a 2026 preprint already took, then formalize only the rank-free, lattice-level, chart-level content that survives — with every geometric input an explicit supplied field."
  key_results:
    - "Every R&D milestone ends in a written PURSUE / RESTATE-AS / DROP verdict per sub-target, and a verdict that drops everything is an acceptable and successful outcome."
    - "The arbitrary-rank Lorentzian reverse Cauchy-Schwarz is proved exactly once, in LinearAlgebra/, and consumed by the other three Lean milestones rather than reproved."
    - "The arbitrary-rank blow-up model exists once, under a neutral name, with a proved agreement lemma back to the existing k = 2 carrier and no deletion or renaming of it."
    - "No declaration anywhere in the slice is named DelPezzo, WeakDelPezzo, Weyl, ADE, Dynkin, braidGroup, SerreInvariant, lePotier, Markov, gldim, stabDagger, geometricChamber, orbifold, ChenRuan or for any author."
    - "Zero sorries, zero admits, zero new axioms; every fact unprovable at the pin is a structure field with a docstring naming what would prove it."

