    root_system: "DerivedAlgGeo/LinearAlgebra/RootSystem/ — owned by exotic-e2-lean, extending Mathlib's RootSystem/OfBilinear.lean at Mathlib's own path"
    blowup_model: "DerivedAlgGeo/AlgebraicGeometry/Numerical/Models/Surface/BlowUpPlaneRank.lean — owned by exotic-e1-lean; a formal ring/grading/degree/Chern/Todd package is a Model, never an Example (layers.md rule 7 / MO1.06)"
    blowup_walls: "DerivedAlgGeo/AlgebraicGeometry/Numerical/Examples/Surface/BlowUpPlaneRankWalls.lean — owned by exotic-e1-lean; Examples/Surface/ is permitted to import the stability tree (layers.md rule 3)"
    spherical_walls: "DerivedAlgGeo/CategoryTheory/Triangulated/StabilityCondition/Walls/Spherical/ — the rank-zero branch owned by exotic-e2-lean"
    invariance: "DerivedAlgGeo/CategoryTheory/Triangulated/StabilityCondition/Symmetry/Combined/SerreInvariance.lean — owned by exotic-e5-lean, carrying AutPair.IsInvariant"
    hyperbolic: "DerivedAlgGeo/AlgebraicGeometry/Numerical/Models/Surface/HyperbolicPlane.lean — owned by exotic-e5-lean, extracted from Examples/Surface/SmoothQuadric.lean"
  prohibited:
    - "a second arbitrary-rank Lorentzian HodgeDefinite anywhere outside LinearAlgebra/BilinearForm/Lorentzian/"
    - "a second arbitrary-rank blow-up carrier; the existing k = 2 Examples.BlowUpPlane.Ring is compared to, never deleted or renamed"
    - "a declaration named for a paper concept, an author, or a geometric class whose identification with the formal model is not a theorem in the same slice"
    - "instantiating spherical wall finiteness on a Fano surface without a docstring stating what the count counts"
    - "a local whole-library lake build; verification runs on the self-hosted owner-win runners, and DAG_ALLOW_LOCAL_BUILD is reported in the pull request if ever used"

