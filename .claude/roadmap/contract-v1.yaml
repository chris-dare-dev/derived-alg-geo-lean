# ---------------------------------------------------------------------------
# LOCAL CONVENTION NOTE
#
# arXMCP maps one plan TRACK to one GitHub milestone, with epics as issues
# inside it. This roadmap uses phase milestones so its eleven epics retain
# useful burndown granularity alongside the repository's other tracks.
#
# Here, GitHub milestones are the track's PHASES (m0..m4 below) and epics are
# issues assigned to them. `kind: epic` items carry `parent: <milestone-id>`;
# milestones carry no parent. (This note previously said the reverse, which no
# entry in the file has ever matched.) If this track ever moves into arXMCP's
# tracker, collapse m0..m4 into one milestone named by `title:` above. See
# ADR-0006.
#
# `blocked_by: [<gh issue numbers>]` records that an item cannot start until
# those issues close. It mirrors GitHub's own blocked-by relation rather than
# replacing it -- the tracker stays authoritative, and this file exists so the
# same fact is legible without a network call. Absent means unblocked; it is
# never a synonym for `status: blocked`, which is about the item and not about
# what is holding it.
#
# `kind: task` is a leaf hanging off a MILESTONE rather than an epic. It exists
# because an issue with no epic otherwise has no representation here at all --
# and an unparented issue is invisible to a parent/child reconciliation by
# construction, so the gap would not even surface as drift. `kind: deliverable`
# in stability-families.yaml is the leaf-under-an-EPIC kind; all thirteen of
# those parent to an epic, so it does not cover this case. See #620.
# ---------------------------------------------------------------------------

items:
  # ===================== M0 — honest baseline =====================
  - id: contract-v1-m0
    gh_milestone: 11
    kind: milestone
    title: "Honest baseline — stop the repo making false claims about itself"
    summary: "Three claims in this repo are false as written, and one of them is a live drift hazard. formalization.yaml:3-5 says its schema 'mirrors the anchor key-for-key'; it is missing the anchor's first key (schema_version) and seven shared keys differ in TYPE. CLAUDE.md §8 cites arXMCP CLAUDE.md §4.8 for a rule §4.8 does not contain, and uses the present indicative for an R5 track that is brief-only with no plans/ entry. source.id pins an arXiv paper with no version, which silently resolves to latest. None of this needs the contract to exist, and all of it must be true before anything cites this repo."
    lane: now
    acceptance:
      - "Given formalization.yaml, when its keys are diffed against the anchor's, then either the file mirrors it key-for-key or the comment claiming so is gone and replaced by an honest one"
      - "Given CLAUDE.md §8, when each of its assertions is checked against arXMCP's shipped code and rules, then every assertion is either true or restated in the tense of what actually shipped"
      - "Given source.id, when it is read, then it carries a confirmed arXiv version that a human read off the abstract page — never one inferred from the corpus, which records arxiv_version = '' for every row"
      - "Given `lake build`, when it runs, then scripts/ is built (today it is covered by no lean_lib and can rot silently)"

  - id: contract-v1-e1
    gh_issue: 128
    gh_sub_issues: [139, 140, 141, 142, 143, 187]
    kind: epic
    parent: contract-v1-m0
    title: "Close the false claims in the trust record and the contract prose"
    summary: "formalization.yaml and CLAUDE.md §8 both assert things that are not true. The trust record's whole premise is that every field is a claim someone may cite; a false claim about the file's own schema is the worst possible place for the rot to start. Also mirrors the boundary into arXMCP, which today has zero documents mentioning this repo — the contract is unilateral."
    priority: must
    size: S
    tags: [value, trust, governance]
    links:
      note: [".claude/notes/2026-08-04-arxmcp-lean-integration-audit.md"]

  - id: contract-v1-e2
    gh_issue: 129
    gh_sub_issues: [144]
    kind: epic
    parent: contract-v1-m0
    title: "Make the audit script a real build target"
    summary: "Completed baseline work: subsystem audits are explicit Lake targets, CI checks their output rather than trusting #print axioms' exit code, and the combined environment emitter supplies the repository-wide gate. Current audit files are scripts/AlgebraicGeometryAudit.lean, scripts/StabilityConditionAudit.lean, and scripts/DGCategoryAudit.lean."
    priority: must
    size: S
    tags: [enabler, infra]

  # ===================== M1 — spec and producer =====================
  - id: contract-v1-m1
    gh_milestone: 10
    kind: milestone
    title: "Contract v1 — the spec, the emitter, and the first CI"
    summary: "The seven schemas exist and are green on their own conformance corpus; the emitter produces evidence by sweeping Environment.constants rather than by parsing source; and this repo has CI for the first time in its history. Nothing is exchanged with arXMCP yet — this milestone builds only the producing half, so its correctness does not depend on a decision about the consumer."
    lane: next
    acceptance:
      - "Given the seven schemas, when `mfc lint-schemas` runs, then no schema defines a property named status/verified/ok/passed/trusted/result, and the aggregate-status fixture is rejected"
      - "Given `set_option maxHeartbeats 400000 in theorem sneaky : False := by sorry` in a real compiled Lean fixture, when the emitter runs, then sneaky appears in the emission and the emitter exits non-zero"
      - "Given two consecutive emitter runs on an unchanged environment, when their outputs are compared, then they are byte-identical modulo the emitted_at field"
      - "Given a topic repo with zero declarations, when CI runs, then it passes under an explicit bootstrap flag and every axis reads not_run — and once constants[] is non-empty the flag cannot be re-set"
    links:
      note: [".claude/decisions/ADR-0003-evidence-at-the-environment.md", ".claude/decisions/ADR-0007-contract-package-location.md"]

  - id: contract-v1-e3
    gh_issue: 130
    gh_sub_issues: [145, 146, 147, 148, 149]
    kind: epic
    parent: contract-v1-m1
    title: "The contract package — schemas, adversarial fixtures, and the mfc CLI"
    summary: "Seven JSON Schema 2020-12 documents with additionalProperties:false, a language-neutral fixture corpus of ~15 must-reject cases drawn from demonstrated failures, and the mfc CLI (validate|bundle|lint|lint-schemas|registry|conformance|join|init). The banned-property lint is what converts arXMCP CLAUDE.md §4.9 from a review habit into a machine constraint. UNBLOCKED 2026-08-04 (later still) by ADR-0009: these live in math-formal-contract-lean, alongside the emitter, and mfc is a SHARED tool again. Preceding history, kept because the correction is the useful part: ADR-0007 is WITHDRAWN. It placed these in arXMCP/contract/ on the authority of _pipeline/stage-1-discovery/synthesis/target-architecture.md, which does not exist anywhere on disk or in git history; the personal-website vendoring precedent it cited does not exist either; and none of the seven filled instances carry the bridge.* envelope it says they must. Q2 was reopened and re-answered; see ADR-0009. Location is settled, the epic is startable, and no vendoring/checksum-drift dance is needed while the schemas and the emitter share a repo. Two consequences reshape this epic. (1) Every artifact rides the EXISTING bridge envelope (_pipeline/stage-1-discovery/synthesis/target-architecture.md 5.2) and registers in its artifact-type registry (5.3) rather than minting a private format -- verdict-record is already defined there as carrying 'statement hash, toolchain/env versions'. (2) Rule 7 of 5.4, 'no shared Python package imported by both repos', means mfc is an arXMCP-side CLI only; the topic repo validates against vendored schema copies with its own machinery, and pins them via the GET /bridge/contracts handshake."
    priority: must
    size: M
    tags: [enabler, schema, trust-language]

  - id: contract-v1-e4
    gh_issue: 131
    gh_sub_issues: [150, 151, 152, 153, 154, 155]
    kind: epic
    parent: contract-v1-m1
    title: "The emitter — evidence from Environment.constants, never from source"
    summary: "A zero-dependency Lake package: the @[cites] attribute (a SimplePersistentEnvExtension modeled on Mathlib/Tactic/StacksAttribute.lean, verified present at the pin) and MathFormalContract.Emit, which sweeps Environment.constants and calls Lean.collectAxioms. It never parses Lean source, which is what makes the set_option-in-theorem evasion structurally impossible rather than merely caught. Two probe-found defects ship fixed: collectAxioms output is unsorted, and emission must be module-scoped rather than name-prefix-scoped. HOME AND PINNING settled 2026-08-04 by ADR-0008: it is a SHARED Lake dependency at an exact commit, not vendored -- vendoring is impossible, not merely worse, because duplicate registration of a SimplePersistentEnvExtension is an import-time error and two vendored topic repos could never share a Lean environment. Recorded as the single named exception to CLAUDE.md section 1, bounded by the leaf property (zero transitive deps, core Lean only) and lapsing if that stops holding. It lives in its own minimal Lean-only repo, NOT in arXMCP/contract/ -- a Lake require on arXMCP would falsify that repo's CLAUDE.md 4.10, 'Sibling, never a subdirectory, never a dependency'."
    priority: must
    size: M
    tags: [enabler, lean, trust, named-exception]

  - id: contract-v1-e5
    gh_issue: 132
    gh_sub_issues: [156, 157, 158, 159, 160]
    kind: epic
    parent: contract-v1-m1
    title: "Producer CI — the first CI in this repo's history"
    summary: "One hermetic workflow: lean-action (build + nanoda with allow-sorry FALSE, since the default is true and leaving it adds a check that passes on sorry-backed proofs), then emit, bundle, lint, ilean-coverage, and a reproducibility assertion. Turns `builds_clean: true` and `axiom_count: 0` from unreproducible assertions about one workstation into observed facts. Includes the vacuous-pass guard, without which an empty emission is indistinguishable from a clean one."
    priority: must
    size: M
    tags: [enabler, infra, trust]

  # ===================== M2 — the seam closes =====================
  - id: contract-v1-m2
    gh_milestone: 12
    kind: milestone
    title: "The seam closes — identity, grounding, first release, first reader"
    summary: "The registry mints durable keys; arXMCP answers the one question it is allowed to answer and writes its answer to a file; this repo cuts its first tag ever; arXMCP pins that tag and re-serves its records verbatim. At the end of this milestone the artifact both repos call 'the entire interface' has a reader, on the consumer side, for the first time."
    lane: next
    acceptance:
      - "Given a fixture corpus whose chunk_ids are all rotated, when the resolver runs, then every registry entry still resolves current via its quote hash, and a genuinely removed statement yields unresolvable rather than a wrong match"
      - "Given a tampered attestation bundle whose contains_sorry_ax was flipped and whose file digest was recomputed, when the pinner runs, then it refuses — because it re-derives every digest from the git tag object rather than trusting the bundle"
      - "Given a registry entry whose relation is claimed exact, when its frontier is non-empty, then lint fails"
      - "Given the served record for any key, when it is read, then no field anywhere in it collapses distinct trust questions, and caveats[] is generated mechanically from the axis values"
      - "Given a reviewed entry and a bumped Mathlib or anchor rev, when `mfc restate-check` runs, then it reports restated / changed / not_checkable per entry — never a single verdict for the registry, and never not_checkable silently folded into changed"
    links:
      note: [".claude/decisions/ADR-0002-identity-is-minted-here.md", ".claude/decisions/ADR-0004-registry-lives-in-the-topic-repo.md"]

  - id: contract-v1-e6
    status: done
    gh_issue: 133
    gh_sub_issues: [161, 162, 163, 164, 165, 166, 167, 168]
    kind: epic
    parent: contract-v1-m2
    title: "The statement registry — durable identity, minted by hand"
    summary: "registry/<work-slug>.yaml: keys of the form stmt:<12hex>:<label> containing zero corpus-derived bytes, with the paper coordinate as typed fields rather than key segments (which is what makes textbook: sources work at all). Carries the verbatim quote and its hash, the dependency edges, and the assumption frontier. This epic also mechanizes CLAUDE.md §3 — which the architecture claimed to enforce and did not — via an import allowlist plus a per-topic forbidden-vocabulary lint on names and doc-comments."
    priority: must
    size: L
    tags: [value, identity, trust]

  - id: contract-v1-e7
    status: done
    gh_issue: 134
    gh_sub_issues: [169, 170, 171, 172]
    kind: epic
    parent: contract-v1-m2
    title: "Grounding resolution — arXMCP answers exactly one question"
    summary: "Two offline read-only CLIs in arXMCP: statement_mint (prefills a candidate entry from a chunk, because mfc's declared deps can reach neither LanceDB nor a loopback server) and statement_resolve (does this quote still appear, and where). Plus the arxiv_version backfill without which the resolver cannot honestly say current about a versioned entry — the corpus records '' for every row in both live notebooks. All three are cross-repo."
    priority: must
    size: M
    tags: [enabler, corpus, cross-repo]

  - id: contract-v1-e8
    status: done
    gh_issue: 135
    gh_sub_issues: [173, 174, 175, 176]
    kind: epic
    parent: contract-v1-m2
    title: "First release, and the consumer side that reads it"
    summary: "git tag v0.1.0 with attest/* as release assets — the first release in this repo's history, without which R5's premise that it 'pins RELEASED formalizations' is literally false. Then arXMCP's half: a pinner that re-derives digests from git objects, a notebooks.db v5->v6 migration (fixing in the same change the raw-sqlite3 path in notebook_restore.py that re-arms an unconditional DROP), and two MCP resources — never a tool, so the frozen tool-schema hash is provably untouched. Includes the revocation channel, which nothing in the batch had."
    priority: must
    size: M
    tags: [value, release, cross-repo]

  - id: contract-v1-e9
    gh_issue: 136
    gh_sub_issues: [177, 178, 179, 180, 181, 188]
    kind: epic
    parent: contract-v1-m2
    title: "Human faithfulness review — the axis no machine may write"
    summary: "The only axis that can catch CLAUDE.md §3's failure, and the only one that does not scale. Two to three reviewed entries, named and dated, with the reviewed statement digest, quote hash, and env digest recorded — so the review has a baseline and starts detecting the same-name-different-statement drift the audit called undetectable. Also carries the coverage census, without which ten records against 15,280 chunks reads as a covered corpus. NOW ALSO CARRIES `mfc restate-check` (#61), promoted from v1.1 by spike #27 and superseding #54: without it a single Mathlib or anchor bump invalidates 100% of human review at once, because env_digest includes every package rev and statement_stable is not_applicable across environments by construction. Recovery would cost the entire original review budget, per bump, at ~2h/entry. #27 measured the assumption it was deferred on -- 339/400 Lean-core theorems with instance-implicit binders round-trip defeq, 0 parse failures, 0 elaboration failures, and all 61 failures are pretty-printer elision, which E-07 already rejects. So the mitigation needs no new gate; it needs reviewed_statement_pp recorded under pp.explicit true, which is NOT what the emitter stores."
    priority: must
    size: M
    tags: [value, trust, gate-owner]

  # The first entry in this file to carry `blocked_by`. #179 cannot be built:
  # it adds {entries, papers_covered, corpus_chunks, generated_at} to
  # arxmcp://formal/{notebook}, and that resource does not exist -- registering
  # it is #175, which is open. Verified against arXMCP at main, where
  # server/mcp_resources.py registers only arxmcp://notebooks and
  # arxmcp://notebooks/{slug}, plus arxmcp://corpus-manifest elsewhere.
  #
  # `kind: deliverable` rather than a bare number in e9's gh_sub_issues,
  # because a number cannot carry a status. It follows the thirteen
  # deliverables in stability-families.yaml, which likewise appear under some
  # epics and not others.
  - id: contract-v1-e9-1
    gh_issue: 179
    gh_sub_issues: []
    kind: deliverable
    parent: contract-v1-e9
    blocked_by: [175]
    title: "Dated coverage census on the formal index resource"
    status: blocked
    summary: "Ten records against a 15,280-chunk corpus read as a covered corpus unless the denominator ships in the same response as the numerator, dated. #177's arithmetic put the served hit rate near 0.07%, and an agent that queries three times, gets nothing and stops is behaving rationally -- which reproduces one level up the failure this whole track exists to fix. arXMCP CLAUDE.md 4.9 already mandates the shape (novelty claims are dated censuses), so it is policy-compliant rather than new. The lane partition this issue asked for is GONE: it was conditional on the sketch lane, and #177 closed as deferred with one reopen trigger -- a second topic repository minting against the registry -- which has not happened. Shape is the flat {entries, papers_covered, corpus_chunks, generated_at}."
    priority: must
    size: S
    tags: [value, corpus, cross-repo, census]

  # `kind: task` — a leaf that hangs off a MILESTONE rather than an epic.
  #
  # `deliverable` in stability-families.yaml is the existing leaf kind and does
  # not fit: all thirteen of them parent to an epic. This is the first entry
  # that belongs to a milestone directly, and it exists because #618 was
  # deliberately unparented from e8 -- its siblings there are arXMCP's half of
  # the epic, and the release decision must not hold that epic open.
  #
  # Without this kind the file would simply have no record of #618, and an
  # unparented issue is invisible to any parent/child reconciliation by
  # construction -- so the gap would not even show up as drift. See #620.
  - id: contract-v1-m2-t1
    gh_issue: 618
    gh_sub_issues: []
    kind: task
    parent: contract-v1-m2
    title: "Tag v0.1.0 — the decision #173 could not make"
    status: done
    summary: "#173 asked for a release and turned out to be three things: two missing producers, a wrong asset name, and a decision. The producers landed (mfc build, mfc seal, and build/1.0's `measured` block; CI now runs the twelve conformance rules on every commit at 10 passed, 0 failed, 2 not_run). The asset name was wrong -- bindings.json is not an artifact this contract defines. What is left is the decision: tagging before #134 and #178 land freezes C-08 and C-10 as not_run in a published bundle, against a corpus resolution nobody computed and a review nobody performed. Wait-and-tag-seven or tag-now-at-six are both defensible; tagging without choosing is not. RESOLVED 2026-08-18: tagged at six of seven rather than waiting. v0.1.0 is tag object df9e6e6d at commit 7f649532, with attest/* shipped as release assets and 16002 constants recorded. C-08 and C-10 are not_run in the published bundle permanently, which is the cost that was accepted; #134 and #178 remain open and are no longer blockers for anything."
    priority: must
    size: S
    tags: [value, release, gate-owner]

  # ===================== M3 — generalization =====================
  - id: contract-v1-m3
    gh_milestone: 13
    kind: milestone
    title: "Generalization gate — a second topic, or the claim is not made"
    summary: "The user's requirement is that a notebook for any other topic can clone this contract. That is either demonstrated or it is not claimed. The gate is a deliberately DIFFERENT topic — no upstream anchor, different Mathlib coverage, at least one textbook-sourced entry — taken end to end before the template is published."
    lane: later
    acceptance:
      - "Given a second topic repo generated from the template, when it is taken end to end, then it reaches a green contract build with at least one real binding at relation_claimed: exact — not an empty repo with a vacuous pass"
      - "Given the template, when it is grepped for Bridgeland-specific strings, then there are zero hits"
