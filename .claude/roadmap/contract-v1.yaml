schema: roadmap/1
slug: contract-v1
project: derived-alg-geo-lean
title: "The arXMCP contract — a cold seam between a corpus and a formalization"
status: active
phase: decomposed        # init -> refined -> decomposed -> sequenced -> complete
brief: |
  Current state (2026-08-14): the formalization now lives in the unified
  `derived-alg-geo-lean` repository at Lean/Mathlib v4.32.1, with an
  environment-based emitter and CI already active. The remaining contract work
  is tracked here and any arXMCP changes stay explicitly cross-repository.

  Historical starting point (2026-08-04): two sibling repos documented a
  contract that had zero code on either side. The interface was prose and
  unilateral; corpus identifiers rotated under re-ingest; and the runtime
  `lean_verify` bridge had toolchain, timeout, sandbox, and fail-open gaps.
  This track builds a COLD SEAM: versioned files exchanged at git tags, no
  runtime coupling, identity minted by a human in this repo and containing zero
  corpus-derived bytes, and all elaboration/axiom evidence produced by sweeping
  `Environment.constants` in the pinned environment rather than by regex over
  source. It is designed to be cloned for another mathematical topic.
goal:
  hmw: "How might we let a Lean declaration durably cite a statement in a paper — and let an agent read how much that citation is worth, axis by axis — without either repo trusting the other's environment, uptime, or good intentions?"
  objective: "Ship a file-based, schema-validated, adversarially-fixtured contract between a corpus notebook and a topic formalization repo, prove it by cutting the first release, and prove it generalizes by standing up a second topic."
  key_results:
    - "A Lean declaration cites a paper statement by a key containing zero corpus-derived bytes, and the citation survives a re-ingest that rotates every chunk_id — proved by a test that rotates ids in a fixture and asserts every entry still resolves."
    - "All elaboration and axiom evidence is produced by sweeping Environment.constants + Lean.collectAxioms in this repo's pinned environment; no evidence anywhere in the contract is produced by parsing Lean source."
    - "Every trust record carries seven axes over four values (pass/fail/not_run/not_applicable) with no aggregate field at any level, enforced by additionalProperties:false plus a rejection fixture — not by review habit."
    - "An axis whose env_digest differs from the record's environment renders not_applicable, never pass and never fail, so the v4.31-vs-v4.29 skew is a value in the type system rather than a silent soundness hole."
    - "Both repos have CI for the first time; `builds_clean: true` and `axiom_count: 0` stop being unreproducible assertions about one workstation."
    - "This repo cuts its first git tag ever, with attest/* as release assets, so R5's premise ('pins RELEASED formalizations') stops being literally false."
    - "arXMCP gains a reader for the artifact both repos call 'the entire interface' — offline, read-only, on the ingest plane, never at request time."
    - "A second topic repo — different notebook, no upstream anchor, at least one textbook-sourced entry — reaches a green contract build from the template, before the template is published."
  assumptions:
    - tier: must
      text: "A machine-readable declaration inventory (name, type, module, axioms) is reachable from the v4.29.0 toolchain by sweeping Environment.constants, without doc-gen4 or a Mathlib-scale dependency."
      validation: "Ground-phase probe produced byte-identical output across two runs. Confirmed reachable; two defects found (collectAxioms output unsorted; name-prefix scoping escapable) and folded into contract-v1-e4."
    - tier: must
      text: "A quote hash under a named normalization survives the rotation classes that actually occur in practice."
      validation: "PARTIALLY FALSIFIED. Survives preamble-class rotation (which changes preamble_text, leaving body_text alone). Does NOT survive a chunker bump, which changes chunk boundaries and therefore body_text. Mitigation is the quote_containment resolution rung; see contract-v1-e6."
    - tier: must
      text: "Human faithfulness review can keep pace with minting at a rate that makes the served surface worth querying."
      validation: "LIKELY FALSE at one operator. ~2h/review, ~30min/mint, against 146 papers / 15,280 chunks gives a ~0.07% hit rate at ten entries. Gated on the owner decision in .claude/open-questions.md Q4; the fallback is a zero-axis `sketch` lane plus a dated coverage census."
    - tier: should
      text: "arXMCP can record which arXiv version a statement came from."
      validation: "FALSE TODAY. `arxiv_version` is '' for every row in both live notebooks (8/8 sampled each). Requires an ingest backfill — a third arXMCP change, not the two budgeted. See contract-v1-e7."
  wont:
    - "No runtime coupling. Neither repo calls the other, ever. (ADR-0001)"
    - "No identity issued by arXMCP. It answers one question — does this quote still appear, and where — and its answer is a committed file. (ADR-0002)"
    - "No elaboration or axiom verdict produced by arXMCP about this repo's environment. (ADR-0003)"
    - "No aggregate trust token at any level, in any artifact. (ADR-0005)"
    - "No `faithfulness: agent_drafted`. An LLM verdict may not occupy the one human axis. (ADR-0005)"
    - "No geometric-lane work inside this contract track. Derived categories, Serre duality, Chern characters, and Fourier–Mukai content are owned by their mathematical roadmaps under DerivedAlgGeo."
    - "No `sorry`, including as a contract-development convenience. CLAUDE.md §2 is unconditional."
  evidence:
    - ".claude/notes/2026-08-04-arxmcp-lean-integration-audit.md — 8 areas surveyed, each independently re-verified by a second agent instructed to default to REFUTED."
    - ".claude/notes/2026-08-04-contract-architecture.md — 4 competing designs, 8 adversarial judgements, the winner with runners-up's ideas grafted in."
    - ".claude/notes/2026-08-04-contract-schemas.md — the 7 artifacts as copy-pasteable schemas with a worked end-to-end trace."
    - ".claude/notes/2026-08-04-contract-red-team.md — 18 ranked gaps in the above. Read before implementing."
    - "arXMCP/server/handlers/lean_verify.py:397-399 — AXIOM_ALLOWLIST is byte-identical to this repo's formalization.yaml:82-90. The one pre-existing semantic touchpoint."
    - "arXMCP/server/handlers/lean_verify.py:445-456 — _DECL_SITE_RE/_DECL_NAME_RE fail open on `set_option ... in theorem` and `open ... in theorem`; regexes executed and reproduced."
    - "arXMCP/ingest/chunker.py:1277-1301 — chunk_id = arxiv:<paper>:<sha256(preamble + NFC(body))[:16]>, content-addressed and determinism-tested."
    - "arXMCP/ingest/store.py:598-600,907-911 — source_span written as literal None; merge_insert has no delete arm."
    - "arXMCP/CLAUDE.md §4.8, §4.9 — the data-plane boundary and the trust-language policy this contract must conform to."
    - "RETRACTED 2026-08-04: this list cited arXMCP/_pipeline/stage-1-discovery/synthesis/target-architecture.md:113-126 as the recorded verdict behind ADR-0007. That file does not exist -- not at that path, not at the ~/Personal/SourceCode root path ADR-0007 gives instead, not anywhere on disk, and never in arXMCP git history. The two citations disagreeing about its location is itself evidence nobody opened it. See the amendment at the foot of .claude/decisions/ADR-0007-contract-package-location.md."
    - "arXMCP/plans/verification-contract/roadmap.yaml — R3, whose named environments (core@/mathlib@/bridgeland-anchor@) and arxmcp://lean-env this track must compose with rather than duplicate."
    - "arXMCP/.claude/roadmap-briefs/R5-formal-target-registry.md — brief only, no plans/ track; the registry lifecycle this track's registry realizes."
