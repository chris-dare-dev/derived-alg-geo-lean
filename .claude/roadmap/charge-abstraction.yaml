schema: roadmap/1
slug: charge-abstraction
project: derived-alg-geo-lean
title: "One charge, indexed by truncation degree — and the leaves that reach it"
status: active
phase: sequenced          # init -> refined -> decomposed -> sequenced -> complete
brief: |
  This track exists because an adversarial abstraction audit on 2026-09-12 found
  the same defect in the charge lane that `numerical-k-theory` found in the
  Grothendieck-group lane: one mathematical object written several times because
  the literature spells it differently per example.

  The surface charge on three real coordinates
  (`Walls/Numerical/ChargeFamily.lean:28`) and the Bayer--Macrì--Toda threefold
  charge on four (`Walls/Threefold/Basic.lean:148`) are the same generating
  formula truncated at two codimensions. The threefold file's own docstring says
  so. They are nevertheless two unrelated roots with no shared parent, a fourfold
  charge does not exist, and the divisorial charge
  (`Walls/Divisorial/Charge.lean:333`) — the one that works in arbitrary Picard
  rank — sits beside both.

  THE INDEX IS THE POINT, and it is where `numerical-k-theory` stopped. That
  track's fourth assumption reads "the fourfold numerical formulas admit the same
  uniform shape as the surface and threefold ones, so one indexed type covers all
  three", and it is marked FALSIFIED 2026-08-27, parking `numerical-k-theory-e5`.
  That falsification is correct and this track does not overturn it. What the
  audit adds is the reason: dimension was the wrong index. The uniform object is
  indexed by TRUNCATION DEGREE `m`, and the geometric transport carries the
  dimension `n` separately. The proof that these must be separate indices is that
  the cubic-threefold Kuznetsov charge is `(n, m) = (3, 2)`: a family indexed by
  dimension alone cannot state it at all. So this track unparks e5 by changing
  its index rather than by re-opening its assumption.

  What makes this track unusual is that its own first design was wrong in ways
  its own review caught. A completeness critic found that the design left the
  correction slot uninhabited, shipped a second Mukai pairing with no bridge to
  the existing one, justified the cubic-fourfold node with a statement about the
  wrong lattice, and dropped a rotation that a verifier had flagged. A
  remediation pass then proved five repairs in Lean, refuted three claims of the
  design by counterexample, and two adversarial checkers caught seven further
  proposals that would themselves have shipped a second spelling of an existing
  declaration. Every one of those is a recorded negative result rather than a
  deletion, and the epics below carry them.

  What this is NOT: new stability mathematics. No epic here proves a new theorem
  about a variety. Each one either removes a copy in favour of an existing
  definition, or replaces an enumeration by a parameter, or records why an
  apparent unification is false.
goal:
  hmw: "How might we make the charge lane carry one polynomial indexed by truncation degree, so that a new dimension or a noncommutative example supplies data and inherits the charge, without restating a line of its mathematics?"
  objective: "Collapse every exponential central-charge definition in the repository onto one kernel indexed by truncation degree, give the geometric transport one owner for every (n, m, κ), and leave the discriminant, the twist and the Mukai pairing with exactly one root apiece."
  key_results:
    - "Exactly one exponential charge polynomial exists; a grep for a second returns nothing. The surface, threefold and slope charges are theorems about it at m = 2, 3, 1."
    - "The divisorial charge in arbitrary Picard rank is a proved instance of the same kernel, not a sibling of it. If only the rank-one slice reaches the root, the unification is cosmetic and has failed."
    - "A fourfold wall family exists and costs one `Polarization` and zero new polynomials."
    - "The Bogomolov--Mukai discriminant has one owner, reached by all seven of its current spellings."
    - "The (3,2) tilt charge is the existing surface family pulled back along a truncation, carries its rotation, and exactly one spelling of it survives."
    - "No declaration added by this track duplicates an existing one without a proved comparison theorem landing in the same pull request."
  assumptions:
    - tier: must
      text: "The surface and threefold charges are the same generating formula at two truncation degrees."
      validation: "CONFIRMED 2026-09-12 in Lean: `stCharge` and `Threefold.charge` are both proved equal to `Exp.ofMoments` at m = 2 and m = 3, and both family-level comparisons elaborate."
    - tier: must
      text: "Truncation degree and ambient dimension must be separate indices."
      validation: "CONFIRMED: the cubic-threefold Kuznetsov charge is (n, m) = (3, 2). A dimension-indexed family cannot state it. This is also why `numerical-k-theory-e5` was parked."
    - tier: must
      text: "The multi-divisor divisorial charge is a child of the kernel, not a sibling."
      validation: "CONFIRMED at the triple level: `expCharge_eq_ofMoments` is proved on a bare `Mukai.RealExtension D`. Two of three independent design angles asserted the opposite and were wrong; the keystone must be stated on the triple, not on `ChernCharacter`, or it cannot reach `mukaiCharge`."
    - tier: must
      text: "The correction class κ is a pullback, not a coefficient, and κ = 1 and κ = √td are two pullbacks."
      validation: "CONFIRMED: they give genuinely different walls. The transport at √td is proved equal to the existing Mukai charge on the rank-one slice for any surface, no K3 hypothesis."
    - tier: should
      text: "One dimension-indexed self-pairing can parent every discriminant in the tree."
      validation: "FALSIFIED 2026-09-12. A dimension-indexed Mukai self-pairing vanishes identically in odd degree, so the threefold leaf cannot reach it. The root is the fixed-arity pairing generalised over its COEFFICIENT RING; the arity stays three. Recorded in `docs/architecture/abstraction-tree.md`."
    - tier: should
      text: "A new graded pairing is needed to state the parity theorem."
      validation: "FALSIFIED at n = 2: the new form is literally `Mukai.realPairing (LinearMap.mul ℝ ℝ)` — same carrier, no weight, no transport. It survives only for n ≠ 2, and only because two further unifications are refuted. n = 2 must land as a comparison theorem, never as a definition."
    - tier: should
      text: "Parity of the compressed pairing decides the cubic-fourfold Kuznetsov node."
      validation: "FALSIFIED. The compressed form lives on `Fin (n+1) → ℝ`, dimension 5 at n = 4; the Mukai lattice of the component has rank 24 and signature (4,20). Symmetry there is automatic for an unrelated reason, so the parity argument is vacuous even on the correct space. The node needs a signature-additivity transfer, which is proved, plus geometry the tree does not have."
  wont:
    - "No new stability mathematics. No epic proves a new theorem about a variety."
    - "No `KuznetsovChargeData` carrier. A noncommutative example reaches the tree by restriction along its inclusion; a dedicated carrier is forbidden and the rule is recorded in the spine."
    - "No dimension-indexed generalisation of the Mukai pairing. The arity is fixed at three and only the coefficient ring generalises."
    - "No fusion of the cubic fourfold's charge lattice with its period-domain lattice. They are orthogonal complements for a very general X, so no comparison theorem between them can exist."
    - "No `sorry`, including as a refactoring convenience while a copy is being removed."
generated_by: { agent: claude-opus-5, at: "2026-09-12" }
