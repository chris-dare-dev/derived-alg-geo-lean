brief: |
  The gap analysis of 2026-09-20 (.claude/notes/2026-09-20-threefold-gap-
  analysis.md) asked, for Fano threefolds and for threefolds of general type,
  what open problems the twelve exotic-stability-targets milestones do not
  touch. The honest answer is: almost nothing the repository should take.

  THREEFOLDS OF GENERAL TYPE: the gap the handoff expected — existence of a
  Bridgeland stability condition — was closed by Chunyi Li (arXiv:2601.22994,
  30 Jan 2026, Theorem 1.1: every smooth projective variety over C) and
  sharpened by Cheng–Feyzbakhsh (arXiv:2607.04788, 6 Jul 2026: the induced
  stability conditions on any smooth projective threefold ARE the
  Bayer–Macrì–Toda double tilt for large a, and the weak, twisted BMT
  inequality holds). What remains — the strong BMT inequality on, e.g.,
  hypersurfaces X_d in P^4 for d >= 6 (Koseki 2008.09799 §1.3: solved only
  for d <= 5), the small-alpha region, the structure of Stab — is sheaf-level
  tilt-stability and Clifford/Brill–Noether work occupied by Feyzbakhsh,
  Koseki, Liu, Rekuski, Li and Cheng. NO ITEM IS REGISTERED FOR THIS
  DIRECTION.

  FANO THREEFOLDS: existence on all Fano threefolds is Bernardara–Macrì–
  Schmidt–Zhao (arXiv:1607.08199, Theorem 1.1, 2017) via a corrected
  inequality with a curve class Gamma. The invariant behind the original
  inequality's failure is NOT Picard rank: P^1 x P^2 and P^1 x P^1 x P^1
  satisfy it for every polarization (BMSZ Thm 5.1); it fails whenever an
  effective divisor with -D f-ample contracts to a point, for some H
  (Martinez–Schmidt, arXiv:1708.08567, Thm 1.1); and there is no known
  counterexample in Picard rank one. The one open question with a
  repository shape is BMSZ §6's: what is the optimal Gamma, and does
  Gamma.H = 0 always suffice? A NEGATIVE answer is a finite arithmetic
  certificate.

  WHAT SURVIVES. One Lean milestone and one low-odds R&D item.
  * threefold-f1-lean: the library's BMT.lean docstring says the inequality
    is false on Bl_pt P^3 and cites Schmidt, but the library has no
    threefold model above Picard rank one and cannot exhibit it. Schmidt's
    counterexample is four rationals and one quadratic form on a six-
    dimensional intersection ring; BMSZ's correction on the same class is
    one more rational parameter. Every number is in the note's §5.2 data
    sheet, checked by Hirzebruch–Riemann–Roch on six classes.
  * threefold-f2-rd: the Gamma.H = 0 feasibility question, with a one-week
    kill whose expected outcome is abandonment.

  THEOREM A (the parity obstruction of the net-new-results note) yields
  nothing on the ambient derived category of any threefold: the Serre
  functor acts on K_num by a scalar only when omega_X is numerically
  trivial, and then every object with S(F) = F[a] has a = 3 and the parity
  matches. Kuznetsov components stay with Candidate 3 of the first scoping
  note. Recorded so it is not re-run.

  DECONFLICTION. No E-milestone names Numerical/Models/Threefold/,
  Numerical/Examples/Threefold/ or Numerical/Stability/BMT.lean; none
  proposes a threefold ring; BMTData is mentioned by none. The shared roots
  assigned in exotic-stability-targets.yaml (Lorentzian, root system,
  surface blow-up model, hyperbolic plane, invariance predicate, rank-zero
  spherical walls, transvection) are all untouched here.

goal:
  hmw: "How might the library stop asserting in a docstring that its Bayer–Macrì–Toda datum is false in general, and instead exhibit the failure and the published correction on a computed class — without naming a declaration for a paper, an author or a geometric class it cannot identify with the formal model?"
  objective: "Land the first threefold numerical model with a two-dimensional codimension-two piece, transport Schmidt's class through the existing wall transport, prove the quadratic form is negative at an explicit point, conclude that every inhabitant of BMTData must declare that class tilt-unstable there, define the curve-class-corrected quantity, and prove the exact parameter interval on which it is nonnegative for that class."
  key_results:
    - "A theorem, not a docstring, says: for every B : BMTData on the rank-two threefold model with the half-anticanonical polarization, B.TiltSemistable (1/8) (1/4) v is false for Schmidt's class v."
    - "The corrected quantity exists once, in Numerical/Stability/BMT.lean, agrees with Q at correction zero, and its nonnegativity interval on Schmidt's class is proved as an iff with rational endpoints (1764 k^2 - 108 k + 1 <= 0)."
    - "The BMT.lean module docstring's 'known for' table and existence prose are current as of 2026-09 and cite BMSZ 2017, Koseki 2020, Sun 2021, Li 2019, Martinez–Schmidt 2017, Li 2026 and Cheng–Feyzbakhsh 2026."
    - "Zero sorries, zero admits, zero new axioms; the three supplied facts (carrier-to-scheme identification, Schmidt's stability point, integral generation of K_num) are docstring-level or explicit hypotheses, never fields that assert a theorem."

architecture_contract:
  policy: "docs/architecture/abstraction-tree.md"
  canonical_roots:
    threefold_model: "DerivedAlgGeo/AlgebraicGeometry/Numerical/Models/Threefold/BlowUpSpace.lean — a formal ring/grading/degree/Chern/Todd package is a Model, never an Example (layers.md rule 7 / MO1.06); stability-neutral; registered in Models/Threefold.lean"
    threefold_walls: "DerivedAlgGeo/AlgebraicGeometry/Numerical/Examples/Threefold/BlowUpSpaceWalls.lean — Examples/Threefold/ may import the stability tree (layers.md rule 3); mirrors Examples/Threefold/ProjectiveSpaceWalls.lean declaration for declaration; registered in Examples/Threefold.lean"
    corrected_quantity: "DerivedAlgGeo/AlgebraicGeometry/Numerical/Stability/BMT.lean — the curve-class-corrected quadratic form lives beside Threefold.Q; the codimension-two class enters as an element of ring.piece 2 with the literature's Γ·H ≥ 0 hypothesis, and there is no second carrier for it"
  prohibited:
    - "a declaration named Schmidt, BMSZ, Martinez, Gamma, Fano, delPezzoThreefold, toric or counterexample outside docstrings and bibliography comments"
    - "a second Q; the corrected quantity must reduce to the existing Threefold.Q at correction zero by rfl or simp, and the existing BMTData structure is not modified"
    - "inhabiting BMTData on the new model with anything but a sanity witness whose TiltSemistable is defined as the conclusion, in the exact style of p3BMTSanity, and only if a consumer needs it"
    - "a local whole-library lake build; verification runs on the self-hosted runners, and DAG_ALLOW_LOCAL_BUILD is reported in the pull request if ever used"

source:
  work: "Schmidt, Counterexample to the generalized Bogomolov–Gieseker inequality for threefolds, IMRN 2017 no. 8, 2562–2566; Bernardara–Macrì–Schmidt–Zhao, Bridgeland stability conditions on Fano threefolds, Épijournal Géom. Algébrique 1 (2017), Art. 2"
  arxiv: "1602.05055; 1607.08199"

evidence:
  - "Gap analysis 2026-09-20: .claude/notes/2026-09-20-threefold-gap-analysis.md (untracked in the shared checkout; force-added on branch agent/roadmap-threefold-gap). Page images of seven papers read directly; two automated PDF summaries were wrong and were discarded."
  - "Arithmetic re-derived by hand from Schmidt pp. 1–3 and BMSZ pp. 3, 21–22: H = 2L − E, H^3 = 7, class of O(L) = (7, 4, 1, 1/6), Q = 2α² + 2β² − β, Q(1/8, 1/4) = −3/32; with Γ = k(L² + 2E²), Q^Γ = 2α² + 2β² − (1 + 42k)β + 24k, nonnegative on the half-plane iff 1764k² − 108k + 1 ≤ 0, whose upper root (9 + 4√2)/294 equals BMSZ Prop. 6.1's 3/98 + 2√2/147."
  - "Todd and lattice data checked by HRR: χ = 1 for O_X, O_L, O_E, O_ℓ, O_m, O_pt; χ(O(L)) = 4; χ(O(−E)) = 0 (note §5.2)."
  - "Repository facts verified on origin/main 4bed5192: all threefold models are monogenic (MonogenicRing.lean docstring warns that this is not licensed by Picard rank one above dimension two); BMTData's only inhabitant is ProjectiveSpaceWalls.p3BMTSanity; BMT.lean's 'known for' table stops at abelian threefolds."
  - "Predecessor notes: .claude/notes/2026-09-19-net-new-results-scoping.md (Theorem A), .claude/notes/2026-09-19-exotic-stability-targets-scoping.md, .claude/notes/2026-09-20-handoff-threefold-gap-analysis.md."

