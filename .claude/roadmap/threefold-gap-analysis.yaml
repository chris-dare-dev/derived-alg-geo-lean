  - "No R&D item on threefolds of general type. Existence is closed (Li 2026); the strong BMT inequality there is occupied and not formalizable at the pin."
  - "No claim that any object is tilt-stable. Tilt-semistability remains an opaque supplied predicate; the milestone proves arithmetic about a class and draws the only conclusion the arithmetic licenses."
  - "No scheme-level blow-up of P^3 is constructed. The carrier's identification with Bl_pt P^3 is supplied, exactly as Examples/Surface/BlowUpPlane.lean supplies its own."
  - "No second arbitrary-rank blow-up SURFACE model; the exotic-e1-lean root is untouched, and the threefold ring is a different carrier with a two-dimensional codimension-two piece."

