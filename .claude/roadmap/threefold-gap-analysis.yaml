items:

  # ---------------------------------------------------------------- order 1
  - id: threefold-f1-lean
    kind: milestone
    title: "F1-LEAN — The rank-two threefold model, Schmidt's class, and the corrected quadratic form"
    status: proposed
    lane: next
    order: 1
    priority: should
    size: M
    summary: >
      Lands the first threefold numerical model whose codimension-two piece
      has dimension two: the six-dimensional ring Q<1, L, E, L^2, E^2, pt>
      with L.E = 0, L^3 = E^3 = pt, Todd class 1 + (2L − E) + ((11/6)L^2 +
      (1/3)E^2) + pt, and the six-class linear-section lattice [O_X], [O_L],
      [O_E], [O_line], [O_line-in-E], [O_pt] whose χ is integral by
      construction (note §5.2; every number checked by HRR). Then the
      half-anticanonical polarization H = 2L − E (H^3 = 7), the transport of
      Schmidt's class v = [O_X] + [O_L] + [O_line] + [O_pt] to
      (7, 4, 1, 1/6), the identity Q_{α,β}(v) = 2α² + 2β² − β, the value
      Q_{1/8,1/4}(v) = −3/32, and the conclusion — stated against the
      EXISTING BMTData, unmodified — that every inhabitant must declare v
      tilt-unstable at (1/8, 1/4), where Schmidt proves O(L) is tilt-stable.
      Adds the curve-class-corrected quantity to BMT.lean beside Q, proves
      it reduces to Q at correction zero, and proves that on v with
      Γ = k(L² + 2E²) it is nonnegative on the whole half-plane iff
      1764k² − 108k + 1 ≤ 0 — whose upper root is BMSZ Prop. 6.1's bound.
      Refreshes the BMT.lean module docstring, which under-reports what is
      known (BMSZ 2017, Koseki 2020, Sun 2021, Martinez–Schmidt 2017,
      Li 2026, Cheng–Feyzbakhsh 2026) and still says existence is open.
      Modules: Models/Threefold/BlowUpSpace.lean;
      Examples/Threefold/BlowUpSpaceWalls.lean; additions to
      Stability/BMT.lean; new audit slices.
    acceptance:
      - "BlowUpSpace.numericalVariety_satisfiesHRR is proved, and the six χ-values of the lattice generators plus χ(O(L)) = 4 and χ(O(−E)) = 0 are theorems, not comments."
      - "Q_{α,β}(v) = 2α² + 2β² − β is a theorem for all rational α, β, and Q_{1/8,1/4}(v) = −3/32 is a theorem. Falsifier: any disagreement with Schmidt's α² + (β − 1/4)² ≥ 1/16 stops the milestone."
      - "For every B : BMTData V P (the existing structure, textually unchanged), ¬ B.TiltSemistable (1/8) (1/4) v is proved, with a docstring stating that Schmidt's Theorem 3.1 places a tilt-stable line bundle at a point of the open disc and that the statement is insensitive to which point."
      - "The corrected quantity is defined once in BMT.lean, reduces to Threefold.Q at correction zero by rfl or simp, and the interval theorem on v is stated over ℚ as an iff with 1764k² − 108k + 1 ≤ 0 (no irrational endpoint)."
      - "check_layering.py passes: Models/Threefold/BlowUpSpace.lean reaches neither the stability tree nor Numerical/Examples/ (rule 7); Examples/Threefold/BlowUpSpaceWalls.lean imports Stability/ThreefoldWallTransport as ProjectiveSpaceWalls.lean does."
      - "A grep of the new and edited modules for Schmidt, BMSZ, Martinez, Gamma, Fano, delPezzo, toric, counterexample returns hits only inside docstrings and bibliography comments."
      - "The BMT.lean docstring's 'known for' table carries BMSZ 2017 (corrected form; original for P^1 x P^2, P^1 x P^1 x P^1, some polarizations on Bl_line P^3), Koseki 2020, Sun 2021, Li 2019, and its 'false' paragraph carries Martinez–Schmidt 2017's divisor-contracting-to-a-point criterion and 'no known counterexample in Picard rank one'; its existence prose cites Li 2026 and Cheng–Feyzbakhsh 2026 and no longer says existence is open."
      - "Zero sorries; check_layering.py, check_umbrella_coverage.py, check_coverage_map.py, check_audit.py, check_audit_complete.py pass; runLinter and lint-style clean; CI green on the runners."
    supplied_data:
      - "That the six-field carrier is the numerical intersection ring of the blow-up of P^3 at a point, with L and E its hyperplane pullback and exceptional divisor. The repository has no scheme-level blow-up; same status as Examples/Surface/BlowUpPlane.lean."
      - "Schmidt, Theorem 3.1: O(L) is ν_{α,β}-stable at some (α, β) with Q_{α,β}(O(L)) < 0. Docstring-level; the Lean theorem quantifies over inhabitants of BMTData and needs no stability predicate of its own."
      - "That [O_X], [O_L], [O_E], [O_line], [O_line-in-E], [O_pt] generate K_num over ℤ (rank 6 is consistent with the full exceptional collection and e(X) = 6). Supplied exactly as Models/Threefold/LinearSection.lean supplies its own generators."
      - "c₂(Bl_pt P^3) = 6L² (the point blow-up does not change c₂ on a threefold); it enters through the Todd coefficients and is checked by ∫td₃ = 1 and the six HRR values."
    tags: [threefold, rank-two-model, bmt-negative, corrected-quantity, docstring-refresh]
    labels: [area:lean, area:geometry, area:stability, type:feature]

  # ---------------------------------------------------------------- order 2
  - id: threefold-f2-rd
    kind: milestone
    title: "F2-R&D — Is the curve-class correction with Γ·H = 0 ever infeasible? A one-week numerical kill"
    status: proposed
    lane: later
    order: 2
    priority: could
    size: S
    summary: >
      THE ONE LIVE QUESTION WITH A REPOSITORY SHAPE, AND A LOTTERY TICKET.
      BMSZ 1607.08199 §6: "it would be interesting to know what the optimal
      class Γ is. A condition that is coherent with the case of Picard rank
      1 would be Γ·H = 0"; their Prop. 6.1 checks line bundles and O_e on
      Bl_pt P^3 only. Martinez–Schmidt 1708.08567 Question 2.6 asks for a Γ
      with Γ·H ≥ 0 on every threefold; Liu–Mao 2605.13808 (May 2026) prove
      the Γ form on singular Fanos. Open statement with quantifiers: does
      there exist a smooth projective threefold X with ample H such that for
      EVERY Γ in A_1(X)_Q with Γ·H = 0 there are (α, β) and a ν_{α,β}-stable
      E with ν_{α,β}(E) = 0 and ch₃^β(E) − Γ·ch₁^β(E) − (α²/6)H²ch₁^β(E) > 0?
      A NEGATIVE answer is a finite certificate — finitely many objects with
      PROVED tilt-stability (line bundles at large α, structure sheaves of
      contracted divisors, Schmidt's nested-wall argument) whose corrected
      constraints are jointly infeasible in the Picard-rank-many coordinates
      of Γ on the hyperplane Γ·H = 0 — and that certificate is arithmetic
      the library can check on the threefold-f1-lean model. A POSITIVE
      answer for a given X is a theorem about all objects and is not ours.
      Day 1: read Bayer–Macrì ICM 2023 Conjecture 4.7 (per Pertusi
      2602.24016 p. 24 the general corrected form; UNREAD as of 2026-09-20)
      and BMSZ §6 in full. Days 2–5: Bl_pt P^3 and Bl_line P^3 with a
      one-parameter family of polarizations; write the constraints; decide
      feasibility by hand or Sage. Expected outcome: feasible everywhere,
      abandon.
    acceptance:
      - "A written statement of Bayer–Macrì ICM 2023 Conjecture 4.7 with its exact Γ-shape, and a sentence saying whether it already answers or reframes the Γ·H = 0 question."
      - "For each (X, H) tried: the list of objects used, the source proving each one's tilt-stability at the points used, the constraint system in Γ, and a FEASIBLE / INFEASIBLE verdict with the computation printed."
      - "A dated collision list covering arXiv math.AG since Jan 2024 and the pages of Schmidt, Martinez, Piyaratne, Zhiyu Liu and Mao."
      - "A PURSUE / DROP verdict. DROP after five days of feasible cases is the expected and acceptable outcome; a single INFEASIBLE case is promoted to a Lean certificate on the threefold-f1-lean model."
    kill_criteria: >
      DROP if Bayer–Macrì ICM 2023 Conjecture 4.7 already fixes a Γ-shape that
      makes the Γ·H = 0 question moot, or if every (X, H) tried in five days
      is feasible, or if a preprint by Schmidt, Martinez, Piyaratne, Liu or
      Mao settles the optimal-Γ question for smooth threefolds. All three are
      expected.
    tags: [threefold, corrected-quantity, numerical-feasibility, lottery-ticket]
    labels: [area:research, area:stability, type:investigation]
