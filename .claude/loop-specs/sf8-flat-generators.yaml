issues:
  - number: 1495
    slug: sf8-flat-generators
    depends_on: []
    chunks:
      - id: sf8-flat-generators
        scope: >-
          For every scheme X and open U, prove the stalk of the canonical
          free-Yoneda O_X-module is O_{X,x} inside U and zero outside, hence
          stalkwise flat over the identity. At the generic small-ringed-site
          owner, construct the natural epimorphism from the explicit
          M.val.Elements-indexed coproduct of free-Yoneda sheaves, and
          specialize it to X.Modules. State the universe bound. Do not claim
          projectivity, an unbounded K-flat resolution, or arbitrary
          pullback acyclicity.
        requirements:
          - "Scheme module sheaves have explicit stalkwise-flat generators"
        files:
          - DerivedAlgGeo/Algebra/Category/ModuleCat/Sheaf/Generator.lean
          - DerivedAlgGeo/AlgebraicGeometry/Modules/FlatGenerators.lean
          - DerivedAlgGeo/AlgebraicGeometry/Modules.lean
          - scripts/AlgebraicGeometryAudit/ModuleFlatGenerators.lean
          - docs/architecture/generalization-backlog.md
          - docs/architecture/loop-engineering-friction.md
          - .claude/roadmap/stability-families.yaml
          - openspec/changes/sf8-sf9-pilot/proposal.md
          - openspec/changes/sf8-sf9-pilot/design.md
          - openspec/changes/sf8-sf9-pilot/tasks.md
          - openspec/changes/sf8-sf9-pilot/specs/sf8-sf9-supported-moduli/spec.md
        acceptance:
          - >-
            For every scheme X : Scheme.{u}, every open U : X.Opens, and point
            x : X, Lean proves that the stalk of the canonical free-Yoneda
            module sheaf is isomorphic to X.presheaf.stalk x as a module when
            x ∈ U, and is zero when x ∉ U. The proof uses the existing module
            sheafification-stalk comparison; it does not infer a scheme-level
            theorem from an affine example.
          - >-
            Each canonical free-Yoneda module sheaf on U is proved flat at
            every stalk over the identity of X, reusing
            Scheme.Modules.IsFlatOver and the module stalk functor. The family
            is therefore an explicit stalkwise-flat generating family for
            every X.Modules.
          - >-
            The generic small-ringed-site API constructs a coproduct indexed
            by M.val.Elements and an epimorphism from it to every sheaf of
            modules M. These constructions form a functor and a natural
            transformation to the identity; the corresponding scheme-module
            map is the specialization of this same root, not a duplicate
            presentation.
          - >-
            With X : Scheme.{u}, the section index M.val.Elements is shown to
            lie in Type u. All coproducts and maps are actual Lean terms with
            no hidden existence premise.
          - >-
            The implementation introduces no projectivity claim, all-complex
            K-flat resolution, or arbitrary-morphism pullback-acyclicity
            theorem. OpenSpec task 1.2 and issue #554 remain open; issues #522
            and #525 are not selected.
          - >-
            Every new public declaration is included in the generic/geometric
            axiom audit and exposed through the existing Sheaf and Modules
            umbrellas. No sorry, admit, new axiom, or duplicate generator
            carrier is introduced.
          - >-
            The targeted Lean build, focused audit, no-sorry check, applicable
            local precheck gates, four independent reviews on one final commit,
            and required hosted ci check pass before the PR merges. The PR
            closes #1495 and uses only a non-closing reference to #554.
        closure: complete
