schema: derived-alg-geo-lean.loop-run/v1
id: sf11-1-witnesses
repository: chris-dare-dev/derived-alg-geo-lean
actor: chris-dare-dev
remote: origin
base_branch: main
base_ref: agent/sf11-1-cap
mode: independent
enabled: true
allow_force_push: false
state_dir: .loop-runs
roadmap_gate: required

openspec:
  change: sf11-base-change-t-structures
  validation: cli-required
  required_artifacts:
    - proposal.md
    - design.md
    - tasks.md
    - specs/sf11-base-change-t-structures/spec.md

limits:
  min_issues: 1
  max_issues: 1
  max_review_rounds_per_chunk: 5

eligibility:
  allow_epic_issues:
    - 1060

review:
  independent: true
  reviewers:
    - mathematics-adversary
    - repository-boundary-adversary
    - abstraction-adversary
    - mathlib-reviewer

runner:
  required_checks:
    - ci
    - trust-surface

merge:
  method: squash
  delete_branch: false
  allow_method_override: true
  allow_delete_branch_override: true
  allow_auto: true
  allow_admin: true

closure:
  code_issue: pr_merge_keyword
  allow_non_pr: false

mutations:
  comment_issue: true
  close_issue: true
  push_branch: true
  create_pr: true
  approve_pr: true
  merge_pr: true

issues:
  - number: 1060
    slug: sf11-1-witnesses
    depends_on: []
    chunks:
      - id: sf11-1-witnesses
        scope: Finish OpenSpec tasks 2.1-2.3 for SF11.1 by replacing the remaining supplied geometric witness seams with theorem-backed constructions wherever the repository supports them, and preserving explicit hypotheses only at genuine external theorem boundaries.
        requirements:
          - Base-change categories are constructed from honest operations
          - The §3 witnesses discharge the supported SF11.1 statements
        files:
          - .claude
          - .github
          - DerivedAlgGeo/AlgebraicGeometry/DerivedCategory/Families
          - DerivedAlgGeo/CategoryTheory/Triangulated/CompactlyGenerated
          - openspec
          - scripts
          - notes/loop-engineering-sf11.md
        acceptance:
          - Each task 2.1-2.3 obligation has a theorem-backed implementation or a named external theorem hypothesis at the geometry owner; no structure field is presented as a proof merely because it is inhabited.
          - D_T and (Dqc)_T remain constructed from external-product closure and bounded-coherent intersection, with all inclusion comparison maps and functor restrictions explicit.
          - Targeted native-PowerShell Lean builds and the no-sorry/axiom audit pass without invoking a whole-repository build.
