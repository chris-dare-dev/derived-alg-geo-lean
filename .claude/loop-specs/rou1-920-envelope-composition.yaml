issues:
  - number: 920
    slug: 920-envelope-composition
    depends_on:
      - 917
      - 919
    chunks:
      - id: rou1-920-envelope-composition
        scope: >-
          Prove composition and transfer of the existing iterated-envelope
          stages, derive the generation-time-plus-one and finite Rouquier
          dimension consequences, and prove the bounded object-property form
          of Stacks 0FXA. Do not add a competing closure operation or assert
          generation-time additivity or a non-uniform strong-generator bound.
        requirements:
          - Iterated envelope bounds compose
          - Generation time plus one is submultiplicative
          - Strong-generator transfer requires a uniform stage
        files:
          - DerivedAlgGeo/CategoryTheory/Triangulated.lean
          - DerivedAlgGeo/CategoryTheory/Triangulated/Dimension.lean
          - DerivedAlgGeo/CategoryTheory/Triangulated/Dimension/Composition.lean
          - DerivedAlgGeo/CategoryTheory/Triangulated/Dimension/Rouquier.lean
          - DerivedAlgGeo/CategoryTheory/Triangulated/Generators.lean
          - DerivedAlgGeo/CategoryTheory/Triangulated/Generators/Composition.lean
          - docs/architecture/generalization-backlog.md
          - scripts/StabilityConditionAudit/Dimension.lean
        acceptance:
          - >-
            Stage zero is contained in each iterated envelope, two finite
            envelope stages compose with bound m * n + m + n, and the bound
            transfers through an intermediate property, including the empty
            property case and without a new closure carrier.
          - >-
            Generation time plus one is submultiplicative in ℕ∞; no false
            additive theorem is introduced, and the documented k[t]/(t^6)
            counterexample and iter-index comparison explain the failure.
          - >-
            Bounded strong-generation transfer, its single-object classical
            generator corollary, and the finite Rouquier-dimension consequences
            are proved; documentation states why pointwise non-uniform stages
            do not establish the arbitrary-property statement.
          - >-
            New public declarations are audited, and the generic modules add
            no geometry or stability imports, competing closure operation,
            sorry, admit, or hidden axiom.
          - >-
            Named module builds, scripts/precheck.sh, strict OpenSpec
            validation, four independent reviews on the same final commit, and
            required hosted ci pass before merge.
        closure: complete
