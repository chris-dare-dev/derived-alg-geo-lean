issues:
  - number: 554
    slug: sf8-5-affine-kprojective-scheme-comparison
    depends_on: []
    chunks:
      - id: sf8-5-affine-kprojective-scheme-comparison
        scope: >-
          For every commutative-ring map R → S, descend the affine tilde and
          underived scheme-module-pullback comparison through localization on
          the full affine module K-projective derived locus. Do not construct a
          replacement on all scheme-module complexes or claim an arbitrary
          scheme-morphism result.
        requirements:
          - "Supported arbitrary derived pullbacks are constructed"
        files:
          - DerivedAlgGeo/AlgebraicGeometry/DerivedCategory/Dqc/AffineKProjectivePullback.lean
          - DerivedAlgGeo/AlgebraicGeometry/DerivedCategory/Dqc/AffineNonflatDerivedObject.lean
          - docs/architecture/generalization-backlog.md
          - scripts/AlgebraicGeometryAudit/SchemeDerived.lean
          - docs/architecture/loop-engineering-friction.md
        acceptance:
          - >-
            A public natural isomorphism is proved for every commutative-ring
            map R → S, from the affine K-projective derived locus to
            DerivedCategory ((Spec S).Modules), the derived category of all
            S-scheme-module sheaves. Its source applies actual degreewise
            Scheme.Modules.pullback to the sheafification of K-projective
            representatives and then localizes; its target is
            affineKProjectiveDerivedPullback followed by the derived functor
            induced by AlgebraicGeometry.tilde.functor S. It is not a functor
            into the separate affine quasi-coherent derived category. The
            comparison is post-localization, not only a chain-level
            restatement.
          - >-
            No flatness hypothesis is added to the affine ring map. The
            source remains KProjectiveDerivedCategory (ModuleCat R), not the
            full derived category of all scheme-module sheaves.
          - >-
            Specialization to the displayed ZMod 2 representative composes
            with the existing scheme-module H^-1 witness from PR #1471; the
            new result does not assert a general left-derived-pullback
            universal property or general K-flat existence.
          - >-
            The declarations have no sorry, admit, or new axiom; every new
            public declaration is recorded in SchemeDerived.lean, with no
            duplicate resolution or pullback carrier and no unrelated umbrella
            change.
          - >-
            Record any genuinely deferred generalization lift in
            docs/architecture/generalization-backlog.md; do not add an
            unverified backlog row for an existing API consumed directly by
            this chunk.
          - >-
            The PR is progress-only, refers to #554 without a closing keyword,
            leaves #554 open, and does not select #522 or #525.
          - >-
            All four independent reviewers pass on the same commit, required
            hosted CI succeeds, and controller merge validation passes before
            publication or merge.
        closure: progress
