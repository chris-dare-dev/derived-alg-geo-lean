schema: derived-alg-geo-lean.loop-run/v1
id: sf8-sf9-pilot
repository: chris-dare-dev/derived-alg-geo-lean
actor: chris-dare-dev
remote: origin
base_branch: main
base_ref: origin/main
mode: stack
enabled: true
allow_force_push: false
state_dir: .loop-runs
roadmap_gate: required

openspec:
  change: sf8-sf9-pilot
  validation: cli-required
  required_artifacts:
    - proposal.md
    - design.md
    - tasks.md
    - specs/sf8-sf9-supported-moduli/spec.md

limits:
  min_issues: 2
  max_issues: 3
  max_review_rounds_per_chunk: 3

review:
  independent: true
  reviewers:
    - mathematics-adversary
    - repository-boundary-adversary
    - abstraction-adversary
    - mathlib-reviewer

runner:
  required_checks:
    - ci
    - trust-surface

merge:
  method: squash
  delete_branch: false
  allow_method_override: true
  allow_delete_branch_override: true
  allow_auto: true
  allow_admin: true

closure:
  code_issue: pr_merge_keyword
  allow_non_pr: false
  allow_progress_pr: true

mutations:
  comment_issue: true
  close_issue: true
  push_branch: true
  create_pr: true
  approve_pr: true
  merge_pr: true

issues:
  - number: 554
    slug: sf8-5-supported-pullback
    depends_on: []
    chunks:
      - id: sf8-5-pullback-construction
        scope: Add the supported non-flat nonidentity affine witness for SF8.5 item 9 as a progress chunk; do not claim the remaining preservation/coherence obligations.
        requirements:
          - Supported arbitrary derived pullbacks are constructed
        files:
          - DerivedAlgGeo/AlgebraicGeometry/DerivedCategory.lean
          - DerivedAlgGeo/AlgebraicGeometry/DerivedCategory
        acceptance:
          - The `ℤ → ZMod 2` ring map and its affine `Spec.map` are actual Lean data with proved non-flatness and non-isomorphism.
          - The existing supported affine geometric pullback is instantiated without a flatness hypothesis, and the general preservation/coherence boundary remains explicit.
        closure: progress

  - number: 522
    slug: sf9-2-supported-algebraicity
    depends_on:
      - 554
    chunks:
      - id: sf9-2-supported-algebraicity
        scope: Prove algebraicity for the supported relative-perfect moduli stack with actual atlas, diagonal, and local-finiteness morphisms.
        requirements:
          - Algebraicity is proved for the supported moduli stack
        files:
          - DerivedAlgGeo/AlgebraicGeometry/Moduli
          - DerivedAlgGeo/AlgebraicGeometry/Stacks
        acceptance:
          - The atlas is an actual scheme morphism with the required coverage statements.
          - The diagonal and local-finiteness claims are proved without a representability shortcut.

  - number: 525
    slug: sf9-3-semistable-reduction
    depends_on:
      - 522
    chunks:
      - id: sf9-3-semistable-reduction
        scope: Formalize supported semistable-reduction data and the quasi-properness adapter only after the algebraicity chain is accepted and merged.
        requirements:
          - Semistable reduction and quasi-properness are proved for the supported moduli stack
        files:
          - DerivedAlgGeo/AlgebraicGeometry/Moduli
          - DerivedAlgGeo/AlgebraicGeometry/Stacks
        acceptance:
          - DVR/Dedekind test diagrams, permitted base change, and semistable replacement are represented by actual supported structures.
          - The quasi-properness adapter consumes the canonical algebraicity and relative-HN interfaces without a valuative conclusion postulate.
