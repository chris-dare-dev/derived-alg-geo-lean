          - DerivedAlgGeo/CategoryTheory/Triangulated/Dimension.lean
          - scripts/StabilityConditionAudit/Dimension.lean
        acceptance:
          - The docstring says the invariant ranges over single objects without selecting a minimizing witness, pins down Rouquier's ⟨G⟩_{n+1} convention, and proves there is no index offset against Mathlib's iterated envelope.
