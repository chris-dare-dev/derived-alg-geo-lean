# Phase 1 publishes the OpenSpec plan with the first implementation chunk.
schema: derived-alg-geo-lean.loop-run/v1
id: rou1-generation-time-core
repository: chris-dare-dev/derived-alg-geo-lean
actor: chris-dare-dev
remote: origin
base_branch: main
base_ref: codex/rou1-openspec-bootstrap
mode: independent
enabled: true
allow_force_push: false
state_dir: .loop-runs
roadmap_gate: required

openspec:
  change: rou1-generation-time-rouquier-dimension
  validation: cli-required
  required_artifacts:
    - proposal.md
    - design.md
    - tasks.md
    - specs/triangulated-generation-dimension/spec.md

limits:
  min_issues: 1
  max_issues: 1
  max_review_rounds_per_chunk: 3

review:
  independent: true
  reviewers:
    - mathematics-adversary
    - repository-boundary-adversary
    - abstraction-adversary
    - mathlib-reviewer
  advisors:
    - altitude-scout
    - hypothesis-elimination-scout

runner:
  required_checks:
    - ci

merge:
  method: squash
  delete_branch: false
  allow_method_override: false
  allow_delete_branch_override: false
  allow_auto: false
  allow_admin: false

closure:
  code_issue: pr_merge_keyword
  allow_non_pr: false
  allow_progress_pr: false

mutations:
  comment_issue: false
  close_issue: false
  push_branch: true
  create_pr: true
  approve_pr: false
  merge_pr: true

issues:
  - number: 918
    slug: rou1-extension-closure-comparison
    depends_on:
      - 917
    chunks:
      - id: rou1-2-extension-closure-comparison
        scope: Compare the owner ExtensionClosure with Mathlib's iterated extension products and triangulated envelope, including the counterexample for empty generators, without changing ExtensionClosure.lean.
        requirements:
          - The owner extension closure has only proved comparisons
        files:
          - DerivedAlgGeo/CategoryTheory/Triangulated/Dimension/ExtensionClosureComparison.lean
          - DerivedAlgGeo/CategoryTheory/Triangulated/Dimension.lean
          - scripts/StabilityConditionAudit/Dimension.lean
          - openspec/changes/rou1-generation-time-rouquier-dimension/.openspec.yaml
          - openspec/changes/rou1-generation-time-rouquier-dimension/proposal.md
          - openspec/changes/rou1-generation-time-rouquier-dimension/design.md
          - openspec/changes/rou1-generation-time-rouquier-dimension/tasks.md
          - openspec/changes/rou1-generation-time-rouquier-dimension/specs/triangulated-generation-dimension/spec.md
          - .claude/loop-specs/rou1-generation-time-core.yaml
          - .claude/loop-specs/rou1-rouquier-dimension.yaml
          - .claude/loop-specs/rou1-functorial-transport.yaml
        acceptance:
          - Every Mathlib extensionProductIter iterate lies in ExtensionClosure.
          - The typeclass-vocabulary le_of_closed corollary is present and records any difference from its raw hypotheses.
          - ExtensionClosure P is contained in P.triangEnvelope only under P.Nonempty and triangulated-category hypotheses.
          - The P = bottom counterexample is recorded, and the supremum equality is claimed only if both inclusions are proved.
          - The generation-time bound is proved and all declarations are audited.
          - ExtensionClosure.lean is unchanged.
        closure: complete
