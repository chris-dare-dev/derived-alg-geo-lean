        scope: >-
          Prove the finite-family local-to-global Noetherian-heart implication
          for the existing S-local restriction interface and the categorical
          preservation of heart monomorphisms. Leave geometric conservativity,
          affine/projective local Noetherianity, bounded-coherent D_T
          restrictions, and full Theorem 5.7(2) to parent #1063.
        files:
          - DerivedAlgGeo/CategoryTheory/Triangulated/TStructure/Local.lean
          - DerivedAlgGeo/AlgebraicGeometry/DerivedCategory/Families/SLocal.lean
          - scripts/StabilityConditionAudit/TStructureCore.lean
          - scripts/AlgebraicGeometryAudit/StabilityConditionFamilies.lean
          - docs/architecture/generalization-backlog.md
          - docs/architecture/loop-engineering-friction.md
        acceptance:
          - >-
            A triangulated t-exact restriction has a proved
            PreservesMonomorphisms instance for its induced heart functor,
            derived by mapping a distinguished triangle of a heart mono and
            applying the target heart's short-exact comparison.
          - >-
            NoetherianLocalityData no longer assumes the local-to-global
            conclusion. Its finite selected quasi-compact opens, local
            Noetherianity, heart-mono preservation, and joint reflection of
            isomorphisms feed the existing finite-family Noetherian-object
            detector to prove that conclusion. Geometric detection remains
            an explicit input and the global-to-local half remains owner data.
          - >-
            The public declarations are included in their audit slices;
            focused Lean targets and audits compile without sorry, admit, or
            new axioms. The non-build precheck is run and its exact verdict
            recorded; every applicable gate must pass before publication.
          - >-
            Four independent adversarial reviewers inspect the same frozen
            commit, with at most three critique/revise rounds and automatic
            research recovery if exhausted. The PR closes only issue #1496
            and references parent #1063 without claiming Theorem 5.7(2).
