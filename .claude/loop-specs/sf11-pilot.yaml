schema: derived-alg-geo-lean.loop-run/v1
id: sf11-pilot
repository: chris-dare-dev/derived-alg-geo-lean
actor: chris-dare-dev
remote: origin
base_branch: main
base_ref: agent/sf11-base
mode: stack
enabled: true
allow_force_push: false
state_dir: .loop-runs
roadmap_gate: required

openspec:
  change: sf11-base-change-t-structures
  validation: cli-required
  required_artifacts:
    - proposal.md
    - design.md
    - tasks.md
    - specs/sf11-base-change-t-structures/spec.md

limits:
  min_issues: 2
  max_issues: 3
  max_review_rounds_per_chunk: 3

eligibility:
  # Issues #1060-#1062 are intentionally selected epics; no other epic is
  # admitted by this exception.
  allow_epic_issues:
    - 1060
    - 1061
    - 1062

review:
  independent: true
  reviewers:
    - mathematics-adversary
    - repository-boundary-adversary
    - abstraction-adversary
    - mathlib-reviewer

runner:
  required_checks:
    - ci
    - trust-surface

merge:
  method: squash
  delete_branch: false
  allow_method_override: true
  allow_delete_branch_override: true
  allow_auto: true
  allow_admin: true

closure:
  code_issue: pr_merge_keyword
  allow_non_pr: false

mutations:
  comment_issue: true
  close_issue: true
  push_branch: true
  create_pr: true
  approve_pr: true
  merge_pr: true

issues:
  - number: 1060
    slug: sf11-1-base-change-categories
    depends_on: []
    chunks:
      - id: sf11-1-base-change-categories
        scope: Complete the constructed D_T and (Dqc)_T categories, their source-faithful functors, and the supported Proposition 3.15, Theorem 3.17, and Lemma 3.18 obligations.
        requirements:
          - Base-change categories are constructed from honest operations
          - The §3 witnesses discharge the supported SF11.1 statements
        files:
          - DerivedAlgGeo/AlgebraicGeometry/DerivedCategory/Families
          - DerivedAlgGeo/CategoryTheory/Triangulated/CompactlyGenerated
          - .claude/roadmap/stability-families.yaml
          - openspec/changes/sf11-base-change-t-structures/tasks.md
          - notes/loop-engineering-sf11.md
        acceptance:
          - D_T and (Dqc)_T are constructed from the external-product closure and bounded-coherent intersection, not postulated.
          - Pullback/pushforward, adjunction, projection, boundedness, and Lemma 3.18 statements compile with exact explicit hypotheses and no sorry or admit.

  - number: 1061
    slug: sf11-2-s-local-structures
    depends_on:
      - 1060
    chunks:
      - id: sf11-2-s-local-structures
        scope: Complete S-local t-structures, affine-base inhabitants, Lemmas 4.15 and 4.16(3), and the S-local slicing analogue.
        requirements:
          - S-local t-structures and slicings are inhabited
        files:
          - DerivedAlgGeo/AlgebraicGeometry/DerivedCategory/Families/SLocal.lean
          - DerivedAlgGeo/CategoryTheory/Triangulated/TStructure
          - DerivedAlgGeo/CategoryTheory/Triangulated/StabilityCondition/Phase/Transfer
          - .claude/roadmap/stability-families.yaml
          - openspec/changes/sf11-base-change-t-structures/tasks.md
          - notes/loop-engineering-sf11.md
        acceptance:
          - S-locality quantifies over quasi-compact opens and has uniqueness and two affine-base inhabitants.
          - Lemma 4.15, Lemma 4.16(3), and the slicing analogue are theorem-backed and compile without new axioms.

  - number: 1062
    slug: sf11-3-base-changed-tstructure
    depends_on:
      - 1060
      - 1061
    chunks:
      - id: sf11-3-base-changed-tstructure
        scope: Reconcile the existing Ind extension with Lemma 5.1 and prove the supported clauses of Theorem 5.3 on (Dqc)_T.
        requirements:
          - Theorem 5.3 reuses the existing Ind extension
        files:
          - DerivedAlgGeo/AlgebraicGeometry/DerivedCategory/Families
          - DerivedAlgGeo/CategoryTheory/Triangulated/CompactlyGenerated/IndExtension.lean
          - DerivedAlgGeo/CategoryTheory/Triangulated/TStructure
          - DerivedAlgGeo/CategoryTheory/Triangulated/StabilityCondition/Phase/Transfer
          - .claude/roadmap/stability-families.yaml
          - openspec/changes/sf11-base-change-t-structures/tasks.md
          - notes/loop-engineering-sf11.md
        acceptance:
          - The existing Ind-extension carrier is reused through a proved comparison with the filtered-colimit presentation.
          - Theorem 5.3 clauses (1)-(5), including flat/fpqc descent and t-exactness, compile without duplicate carriers or postulated conclusions.
