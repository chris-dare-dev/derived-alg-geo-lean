issues:
  - number: 919
    slug: rou1-919-rouquier-dimension
    depends_on:
      - 917
    chunks:
      - id: rou1-919-rouquier-dimension
        scope: >-
          Define Rouquier dimension from singleton generation times and prove
          the finite-bound, strong/classical-generator, and zero-stage
          characterisations with Rouquier's n+1 envelope indexing. Do not
          implement composition or functor transport in this chunk.
        requirements:
          - Rouquier dimension measures single-object generation
          - Finite Rouquier dimension characterizes strong generation
          - Zero dimension is generation without extensions
          - Extension-step indexing matches Rouquier's convention
        files:
          - DerivedAlgGeo/CategoryTheory/Triangulated/Dimension/Rouquier.lean
          - DerivedAlgGeo/CategoryTheory/Triangulated/Dimension.lean
          - scripts/StabilityConditionAudit/Dimension.lean
          - docs/architecture/generalization-backlog.md
        acceptance:
          - >-
            Rouquier dimension is the infimum of generation time over
            singleton object properties, with the no-offset correspondence
            to Rouquier's `⟨G⟩_{n+1}` convention documented and justified by
            the zeroth/successor envelope indices and the conditional
            `triangEnvelopeIter_add` equation. The docstring explains that the
            latter requires `[IsTriangulated C]`, which is not a public API
            hypothesis for Rouquier dimension and does not state a
            generation-time composition or subadditivity law (issue #920).
          - >-
            The finite-bound, finite-dimension/strong-generator,
            classical-generator, and zero-stage characterisations compile
            under the existing pretriangulated hypotheses. Any `Nonempty C`
            binder required by `ENat.exists_eq_iInf` is derived locally from
            `HasZeroObject`, not exposed in the public API.
          - >-
            The new public declarations are audited; the generic module adds
            no geometry or stability imports, competing closure carrier,
            `sorry`, `admit`, or hidden axiom. Its docstring states the
            single-object/non-attainment scope caveat and no-offset indexing.
          - >-
            Any advisor/reviewer lift not implemented in the chunk has a
            complete append-only row in docs/architecture/generalization-backlog.md
            in the exact reviewed commit; no unrelated backlog row is changed.
          - >-
            The named module build, scripts/precheck.sh, four independent
            reviews on the same final commit, and required hosted ci check
            pass before the PR is offered for review.
        closure: complete
